<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مِشْكاة المعرفة — الموسوعة الثقافية الشاملة</title>
  <!-- خطوط عربية متناغمة من Google Fonts (الاعتماد الخارجي الوحيد) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       1. المتغيرات اللونية والهوية البصرية (الوضع الداكن الزمردي + الفاتح الدافئ)
       ========================================================================= */
    :root {
      --bg: #eef3ee;
      --bg-soft: #e3ece4;
      --card: #fafcf8;
      --card-glass: rgba(250, 252, 248, 0.88);
      --tx: #182923;
      --mu: #526a61;
      --ac: #247253;
      --ac-hover: #1d5d44;
      --ac-glow: rgba(36, 114, 83, 0.22);
      --acx: #ffffff;
      --gold: #b57e1d;
      --gold-bg: rgba(181, 126, 29, 0.14);
      --bd: #cfdcd1;
      --bad: #b84b34;
      --bad-bg: rgba(184, 75, 52, 0.12);
      --good: #1c8556;
      --good-bg: rgba(28, 133, 86, 0.13);
      --warn: #b97a10;
      --warn-bg: rgba(185, 122, 16, 0.14);
      --shadow: 0 10px 28px rgba(17, 36, 28, 0.08);
      --shadow-lg: 0 18px 42px rgba(17, 36, 28, 0.15);

      /* تدرجات التصنيفات في الوضع الفاتح */
      --g-s: linear-gradient(145deg, #d7efef, #a9dad6); --c-s: #125d57;
      --g-h: linear-gradient(145deg, #f5e3cf, #e5be96); --c-h: #824916;
      --g-p: linear-gradient(145deg, #e5e1f6, #c6bce8); --c-p: #4f3a8f;
      --g-l: linear-gradient(145deg, #f9e1e9, #ecbfd0); --c-l: #94294c;
      --g-g: linear-gradient(145deg, #d9edf8, #b0d7f0); --c-g: #165e8c;
      --g-m: linear-gradient(145deg, #dcf4e5, #b1e2c5); --c-m: #176e40;
      --g-t: linear-gradient(145deg, #dde7fa, #b8cef4); --c-t: #234b91;
      --g-a: linear-gradient(145deg, #f9e6da, #eec7ae); --c-a: #95421a;
      --g-o: linear-gradient(145deg, #dfeedb, #b9d7b2); --c-o: #2b613f;
    }

    :root[data-theme="dark"] {
      --bg: #0c1514;
      --bg-soft: #111e1c;
      --card: #152220;
      --card-glass: rgba(21, 34, 32, 0.86);
      --tx: #e7f0ea;
      --mu: #95aba3;
      --ac: #8fd0a9;
      --ac-hover: #a2dbba;
      --ac-glow: rgba(143, 208, 169, 0.24);
      --acx: #091912;
      --gold: #ebc87e;
      --gold-bg: rgba(235, 200, 126, 0.14);
      --bd: #243739;
      --bad: #e68c72;
      --bad-bg: rgba(230, 140, 114, 0.14);
      --good: #6fd89f;
      --good-bg: rgba(111, 216, 159, 0.14);
      --warn: #ebc87e;
      --warn-bg: rgba(235, 200, 126, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.42);

      /* تدرجات التصنيفات في الوضع الداكن */
      --g-s: linear-gradient(145deg, #0f393f, #1e6c6a); --c-s: #82e8e0;
      --g-h: linear-gradient(145deg, #3b2316, #7a4c2a); --c-h: #f4c682;
      --g-p: linear-gradient(145deg, #211e47, #4c407d); --c-p: #cabcf9;
      --g-l: linear-gradient(145deg, #3f1928, #732f49); --c-l: #f8abc3;
      --g-g: linear-gradient(145deg, #112d42, #21577a); --c-g: #87d2f8;
      --g-m: linear-gradient(145deg, #123727, #226949); --c-m: #88eab3;
      --g-t: linear-gradient(145deg, #172544, #2b4a84); --c-t: #9ac2ff;
      --g-a: linear-gradient(145deg, #3e2318, #75432e); --c-a: #f8b895;
      --g-o: linear-gradient(145deg, #1d3321, #406648); --c-o: #a6e3bc;
    }

    /* =========================================================================
       2. القواعد الأساسية والخطوط والتجاوب
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--tx);
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Segoe UI", "Traditional Arabic", Tahoma, Arial, serif;
      font-size: 16px;
      line-height: 1.72;
      background-image:
        radial-gradient(920px 500px at 88% -8%, var(--ac-glow), transparent),
        radial-gradient(700px 460px at 5% 35%, rgba(127, 196, 212, 0.08), transparent),
        radial-gradient(560px 420px at 50% 98%, rgba(235, 200, 126, 0.06), transparent);
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 84px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4, button, .kufi, select, .chip, .tag, .pill {
      font-family: "Reem Kufi", "Segoe UI", "Geeza Pro", Tahoma, Arial, sans-serif;
    }

    button {
      font-family: "Reem Kufi", "Segoe UI", "Geeza Pro", Tahoma, Arial, sans-serif;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input, textarea, select {
      font-family: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--ac-glow);
    }

    /* ألوان التصنيفات */
    .cat-s { --cat-bg: var(--g-s); --cat-ac: var(--c-s); }
    .cat-h { --cat-bg: var(--g-h); --cat-ac: var(--c-h); }
    .cat-p { --cat-bg: var(--g-p); --cat-ac: var(--c-p); }
    .cat-l { --cat-bg: var(--g-l); --cat-ac: var(--c-l); }
    .cat-g { --cat-bg: var(--g-g); --cat-ac: var(--c-g); }
    .cat-m { --cat-bg: var(--g-m); --cat-ac: var(--c-m); }
    .cat-t { --cat-bg: var(--g-t); --cat-ac: var(--c-t); }
    .cat-a { --cat-bg: var(--g-a); --cat-ac: var(--c-a); }
    .cat-o { --cat-bg: var(--g-o); --cat-ac: var(--c-o); }

    /* خلفية التلال المتحركة بنعومة */
    .hills-wrap {
      position: fixed;
      inset: auto 0 0 0;
      width: 100%;
      height: 165px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      color: var(--ac);
    }

    .hills-svg {
      width: 112%;
      height: 100%;
      margin-right: -6%;
      display: block;
    }

    .hill-wave-1 {
      animation: hillDrift 16s ease-in-out infinite alternate;
    }

    .hill-wave-2 {
      animation: hillDrift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes hillDrift {
      from { transform: translateX(-18px); }
      to { transform: translateX(18px); }
    }

    /* الحاوية الرئيسية */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    @media (min-width: 640px) {
      .app-shell { padding: 24px 22px 30px; }
    }

    /* =========================================================================
       3. الشريط العلوي (Top HUD) والبطاقات الأساسية
       ========================================================================= */
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--ac);
      color: var(--acx);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      box-shadow: 0 8px 20px var(--ac-glow);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.8vw, 1.85rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 0.83rem;
      color: var(--mu);
    }

    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      min-height: 40px;
      border-radius: 999px;
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
      font-size: 0.86rem;
      font-weight: 600;
      transition: transform 0.16s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .hud-pill:hover { border-color: var(--ac); }
    .hud-pill:active { transform: scale(0.96); }

    .sheet-group {
      display: inline-flex;
      align-items: stretch;
      border-radius: 999px;
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .sheet-group.is-ok { border-color: var(--ac); }
    .sheet-group.is-warn { border-color: var(--warn); }
    .sheet-group.is-err { border-color: var(--bad); }

    .sheet-status-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      min-height: 40px;
      border: 0;
      background: transparent;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .sheet-refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      min-height: 40px;
      min-width: 40px;
      border: 0;
      border-right: 1px solid var(--bd);
      background: transparent;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }

    .sheet-refresh-btn:hover { background: var(--ac-glow); }

    .spin {
      display: inline-block;
      animation: spin360 1s linear infinite;
    }

    @keyframes spin360 {
      to { transform: rotate(360deg); }
    }

    /* البطاقات السطحية والزجاجية */
    .surface {
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .themed-card {
      background: var(--cat-bg, var(--card));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      box-shadow: var(--shadow);
      color: var(--tx);
    }

    /* بانر الإشراقة المعرفية */
    .spotlight {
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .spotlight-body {
      flex: 1 1 320px;
      min-width: 0;
    }

    .spotlight-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .spotlight-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.72;
    }

    .spotlight-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* =========================================================================
       4. شريط التنقل الرئيسي (6 تبويبات)
       ========================================================================= */
    .main-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      .main-nav {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 8px;
      min-height: 46px;
      border-radius: 16px;
      border: 1px solid var(--bd);
      background: var(--card-glass);
      color: var(--tx);
      font-size: 0.86rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .nav-btn:hover { border-color: var(--ac); }
    .nav-btn:active { transform: scale(0.97); }

    .nav-btn.active {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      box-shadow: 0 6px 18px var(--ac-glow);
    }

    .nav-btn span.lbl {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* تنبيه بطاقات اليوم */
    .daily-nudge {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 18px;
      border: 1px solid var(--ac);
      background: var(--card-glass);
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .daily-nudge:hover { transform: translateY(-1px); }

    /* =========================================================================
       5. الأزرار والشارات والفلاتر
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 18px;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.14s ease, filter 0.18s ease, background 0.18s ease;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.06); }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-primary {
      background: var(--ac);
      color: var(--acx);
      box-shadow: 0 6px 18px var(--ac-glow);
    }

    .btn-ghost {
      background: var(--bg);
      color: var(--tx);
      border-color: var(--bd);
    }

    .btn-outline-ac {
      background: transparent;
      color: var(--ac);
      border-color: var(--ac);
    }

    .btn-bad {
      background: var(--bad);
      color: #ffffff;
    }

    .btn-gold {
      background: var(--gold-bg);
      color: var(--gold);
      border-color: var(--gold);
    }

    .btn-sm {
      padding: 7px 12px;
      min-height: 36px;
      font-size: 0.82rem;
      border-radius: 12px;
    }

    .btn-block { width: 100%; }

    .badge-sheet {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--ac);
      color: var(--acx);
      font-size: 0.72rem;
      font-weight: 700;
      box-shadow: 0 3px 10px var(--ac-glow);
    }

    .tag-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--cat-ac, var(--ac));
      color: var(--cat-ac, var(--ac));
      background: rgba(0, 0, 0, 0.14);
      font-size: 0.76rem;
      font-weight: 600;
    }

    :root[data-theme="light"] .tag-cat {
      background: rgba(255, 255, 255, 0.55);
    }

    .tag-gold {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--gold-bg);
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 600;
    }

    /* =========================================================================
       6. الشبكات والموسوعة
       ========================================================================= */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .stat-box {
      padding: 13px 10px;
      text-align: center;
      border-radius: 18px;
      transition: transform 0.16s ease, border-color 0.2s ease;
    }

    .stat-box.clickable { cursor: pointer; }
    .stat-box.clickable:hover { transform: translateY(-2px); border-color: var(--ac); }

    .stat-box b {
      display: block;
      font-family: "Reem Kufi", "Segoe UI", "Geeza Pro", Tahoma, Arial, sans-serif;
      font-size: 1.55rem;
      line-height: 1.25;
    }

    .stat-box span {
      font-size: 0.78rem;
      color: var(--mu);
    }

    .filter-panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
    }

    .search-box input {
      padding-right: 40px;
      padding-left: 36px;
    }

    .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.65;
    }

    .search-clear {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--mu);
      font-size: 0.9rem;
      padding: 4px 6px;
    }

    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      padding: 7px 14px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .chip:hover { border-color: var(--ac); }

    .chip.on {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      box-shadow: 0 4px 14px var(--ac-glow);
    }

    .chip.sheet-chip {
      border-color: var(--ac);
    }

    .chip.fav-chip.on {
      background: var(--gold);
      color: #151208;
      border-color: var(--gold);
    }

    .facts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 680px) {
      .facts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 1024px) {
      .facts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .fact-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .fact-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .fact-card.from-sheet {
      border: 2px solid var(--ac);
    }

    .fact-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .fact-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .fact-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 0;
      background: rgba(0, 0, 0, 0.14);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: background 0.18s ease, transform 0.14s ease;
    }

    :root[data-theme="light"] .icon-btn {
      background: rgba(255, 255, 255, 0.55);
    }

    .icon-btn:hover { background: rgba(0, 0, 0, 0.28); }
    .icon-btn:active { transform: scale(0.92); }

    .fact-q {
      margin: 0 0 8px;
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.48;
    }

    .fact-a {
      margin: 0;
      font-size: 0.93rem;
      opacity: 0.92;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fact-foot {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    :root[data-theme="light"] .fact-foot {
      border-top-color: rgba(0, 0, 0, 0.1);
    }

    .mini-pill {
      border: 0;
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.22);
      color: var(--tx);
      transition: opacity 0.18s ease;
    }

    :root[data-theme="light"] .mini-pill {
      background: rgba(255, 255, 255, 0.65);
    }

    /* =========================================================================
       7. بطاقات اليوم ثلاثية الأبعاد (3D Flip Cards)
       ========================================================================= */
    .narrow-wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .medium-wrap {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--bd);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--ac);
      transition: width 0.4s ease;
    }

    .flip-wrap {
      perspective: 1200px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      min-height: 320px;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 26px;
      padding: 28px 24px;
      background: var(--cat-bg, var(--card));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-y: auto;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .float-icon {
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 10px;
      animation: floatSoft 3.6s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stack-md {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .stack-md { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* =========================================================================
       8. شارات الإنجاز + تحدي الثقافة + ويكيبيديا + حقيبتي
       ========================================================================= */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 600px) {
      .badges-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .badge-item {
      padding: 13px 8px;
      border-radius: 18px;
      border: 1px dashed var(--bd);
      background: var(--bg);
      text-align: center;
      opacity: 0.48;
      filter: grayscale(1);
      transition: all 0.25s ease;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: none;
      border-style: solid;
      border-color: var(--ac);
      animation: badgeGlow 2.4s infinite alternate;
    }

    @keyframes badgeGlow {
      from { box-shadow: 0 0 0 rgba(143, 208, 169, 0); }
      to { box-shadow: 0 0 18px var(--ac-glow); }
    }

    .quiz-opt {
      width: 100%;
      text-align: right;
      padding: 15px 16px;
      border-radius: 18px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, Arial, serif;
      font-size: 0.98rem;
      line-height: 1.6;
      transition: border-color 0.18s ease, transform 0.14s ease, background 0.18s ease;
    }

    .quiz-opt:hover:not(:disabled) {
      border-color: var(--ac);
      transform: translateX(-2px);
    }

    .quiz-opt.correct {
      background: var(--good);
      border-color: var(--good);
      color: #ffffff;
    }

    .quiz-opt.wrong {
      background: var(--bad);
      border-color: var(--bad);
      color: #ffffff;
    }

    .quiz-opt.dimmed { opacity: 0.52; }

    .opt-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Reem Kufi", "Segoe UI", "Geeza Pro", Tahoma, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .wiki-card-flex {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: flex-start;
    }

    @media (min-width: 640px) {
      .wiki-card-flex { flex-direction: row; }
    }

    .wiki-thumb {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid var(--bd);
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .wiki-thumb {
        width: 190px;
        height: 190px;
      }
    }

    .srs-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--bd);
    }

    .srs-list-item:last-child { border-bottom: 0; }

    /* =========================================================================
       9. النوافذ المنبثقة (Modals) والإشعارات (Toast)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      animation: fadePop 0.22s ease-out;
    }

    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 26px;
      padding: 24px 22px;
      position: relative;
      box-shadow: var(--shadow-lg);
    }

    .modal-close {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 16px);
      z-index: 95;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--ac);
      color: var(--acx);
      font-family: "Reem Kufi", "Segoe UI", "Geeza Pro", Tahoma, Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      max-width: 92vw;
      text-align: center;
      transition: opacity 0.26s ease, transform 0.26s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .anim-pop {
      animation: fadePop 0.28s ease-out;
    }

    @keyframes fadePop {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .muted { color: var(--mu); }
    .text-ac { color: var(--ac); }
    .text-gold { color: var(--gold); }
    .text-good { color: var(--good); }
    .text-bad { color: var(--bad); }
    .text-center { text-align: center; }

    .alert-box {
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      border: 1px solid var(--bd);
    }

    .alert-err {
      background: var(--bad-bg);
      border-color: var(--bad);
      color: var(--bad);
    }

    .alert-ok {
      background: var(--good-bg);
      border-color: var(--good);
      color: var(--good);
    }

    .alert-warn {
      background: var(--warn-bg);
      border-color: var(--warn);
      color: var(--warn);
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-inner, .float-icon, .badge-item.unlocked, .hill-wave-1, .hill-wave-2, .spin, .anim-pop {
        animation: none !important;
        transition: none !important;
      }
    }

    /* =========================================================================
       10. ثيمات الألوان القابلة للفتح (Unlockable Skins — داكن وفاتح)
       ========================================================================= */
    /* الليل الياقوتي (المستوى 2) */
    :root[data-skin="sapphire"] {
      --bg: #eef2f8; --bg-soft: #e1e8f3; --card: #f8faff; --card-glass: rgba(248, 250, 255, 0.9);
      --tx: #162238; --mu: #4d6082; --ac: #2463a8; --ac-hover: #1b4f88; --ac-glow: rgba(36, 99, 168, 0.22); --bd: #cad7ec;
    }
    :root[data-theme="dark"][data-skin="sapphire"] {
      --bg: #0a1220; --bg-soft: #101b2e; --card: #14223a; --card-glass: rgba(20, 34, 58, 0.88);
      --tx: #e7effa; --mu: #8ea5c7; --ac: #7ec2f8; --ac-hover: #9bd0fb; --ac-glow: rgba(126, 194, 248, 0.26); --acx: #071728; --bd: #243859;
    }

    /* الصحراء الذهبية (المستوى 3) */
    :root[data-skin="desert"] {
      --bg: #f6f1e7; --bg-soft: #ede4d3; --card: #fdfaf3; --card-glass: rgba(253, 250, 243, 0.9);
      --tx: #2b2013; --mu: #735c42; --ac: #a66c1a; --ac-hover: #8a5812; --ac-glow: rgba(166, 108, 26, 0.22); --bd: #dfd0b8;
    }
    :root[data-theme="dark"][data-skin="desert"] {
      --bg: #17120c; --bg-soft: #211a11; --card: #282015; --card-glass: rgba(40, 32, 21, 0.88);
      --tx: #f4ece0; --mu: #b5a184; --ac: #eab967; --ac-hover: #f2ca83; --ac-glow: rgba(234, 185, 103, 0.25); --acx: #1b1206; --bd: #443523;
    }

    /* الأرجواني الملكي (المستوى 5) */
    :root[data-skin="royal"] {
      --bg: #f2eff8; --bg-soft: #e6e0f3; --card: #faf8ff; --card-glass: rgba(250, 248, 255, 0.9);
      --tx: #211838; --mu: #5e5180; --ac: #6c43b8; --ac-hover: #573399; --ac-glow: rgba(108, 67, 184, 0.22); --bd: #d5cae8;
    }
    :root[data-theme="dark"][data-skin="royal"] {
      --bg: #110d1e; --bg-soft: #18132b; --card: #1f1836; --card-glass: rgba(31, 24, 54, 0.88);
      --tx: #eeeaf9; --mu: #a093c2; --ac: #bca0fa; --ac-hover: #ceb8fc; --ac-glow: rgba(188, 160, 250, 0.26); --acx: #130b26; --bd: #342957;
    }

    /* الفجر القرمزي (المستوى 7) */
    :root[data-skin="crimson"] {
      --bg: #f8eff1; --bg-soft: #f0dfe3; --card: #fff9fa; --card-glass: rgba(255, 249, 250, 0.9);
      --tx: #2f171d; --mu: #78505a; --ac: #b53d5c; --ac-hover: #962f4a; --ac-glow: rgba(181, 61, 92, 0.22); --bd: #e6cbd2;
    }
    :root[data-theme="dark"][data-skin="crimson"] {
      --bg: #1a0e12; --bg-soft: #251319; --card: #2c171e; --card-glass: rgba(44, 23, 30, 0.88);
      --tx: #f8eaee; --mu: #bd94a0; --ac: #f495ae; --ac-hover: #f8aec2; --ac-glow: rgba(244, 149, 174, 0.25); --acx: #240a12; --bd: #4a2833;
    }

    /* سديم السماوات (المستوى 10) */
    :root[data-skin="nebula"] {
      --bg: #ecf5f6; --bg-soft: #ddecef; --card: #f7fcfd; --card-glass: rgba(247, 252, 253, 0.9);
      --tx: #11272e; --mu: #466973; --ac: #0d828c; --ac-hover: #096870; --ac-glow: rgba(13, 130, 140, 0.23); --bd: #c2dce0;
    }
    :root[data-theme="dark"][data-skin="nebula"] {
      --bg: #071319; --bg-soft: #0c1d26; --card: #102531; --card-glass: rgba(16, 37, 49, 0.88);
      --tx: #e4f6fa; --mu: #87b1be; --ac: #5de0e6; --ac-hover: #82e9ee; --ac-glow: rgba(93, 224, 230, 0.27); --acx: #051b21; --bd: #1e4152;
    }

    /* =========================================================================
       11. شريط المستوى والخبرة (XP Strip) + إطارات الرتب + التحفيز
       ========================================================================= */
    .xp-strip {
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.16s ease;
    }

    .xp-strip:hover {
      border-color: var(--ac);
      transform: translateY(-1px);
    }

    .avatar-ring {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--rank-color, var(--ac));
      box-shadow: 0 0 18px var(--rank-glow, var(--ac-glow));
    }

    .avatar-ring.lg {
      width: 78px;
      height: 78px;
      padding: 4px;
    }

    .avatar-ring.rank-6 {
      background: linear-gradient(135deg, #ebc87e, #f58a7a, #8fd0a9, #87d2f8);
      animation: rankPulse 3s ease-in-out infinite alternate;
    }

    @keyframes rankPulse {
      from { box-shadow: 0 0 14px rgba(235, 200, 126, 0.45); }
      to { box-shadow: 0 0 28px rgba(143, 208, 169, 0.65); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      line-height: 1;
    }

    .avatar-ring.lg .avatar-inner {
      font-size: 2.3rem;
    }

    .lvl-pill {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ac);
      color: var(--acx);
      font-family: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      white-space: nowrap;
      border: 2px solid var(--card);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .xp-strip-main {
      flex: 1 1 240px;
      min-width: 0;
    }

    .xp-strip-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .rank-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid var(--rank-color, var(--ac));
      color: var(--rank-color, var(--ac));
      background: rgba(0, 0, 0, 0.12);
    }

    :root[data-theme="light"] .rank-tag {
      background: rgba(255, 255, 255, 0.65);
    }

    .mult-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid var(--gold);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .xp-bar-track {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: var(--bd);
      overflow: hidden;
      position: relative;
    }

    .xp-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ac), var(--gold));
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .xp-bar-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.32), transparent);
      transform: translateX(-100%);
      animation: xpShimmer 2.8s infinite;
    }

    @keyframes xpShimmer {
      100% { transform: translateX(100%); }
    }

    .xp-strip-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 5px;
      font-size: 0.78rem;
      color: var(--mu);
    }

    /* التبويب السابع: تعديل شبكة التنقل لتناسب 7 تبويبات بأناقة */
    .main-nav {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (min-width: 520px) {
      .main-nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 960px) {
      .main-nav {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 9px;
      }
    }

    .nav-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      flex-shrink: 0;
    }

    /* المهام اليومية (Daily Quests) */
    .quest-card {
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--bd);
      background: var(--bg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s ease;
    }

    .quest-card.ready {
      border-color: var(--gold);
      background: var(--gold-bg);
    }

    .quest-card.claimed {
      opacity: 0.72;
      border-color: var(--good);
    }

    /* متجر الثيمات والأيقونات (Unlockables) */
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 640px) {
      .skins-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .skin-card {
      padding: 13px;
      border-radius: 18px;
      border: 1px solid var(--bd);
      background: var(--bg);
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .skin-card:hover:not(:disabled) {
      border-color: var(--ac);
      transform: translateY(-2px);
    }

    .skin-card.active {
      border: 2px solid var(--ac);
      box-shadow: 0 6px 18px var(--ac-glow);
    }

    .skin-card.locked {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .skin-swatches {
      display: flex;
      gap: 6px;
    }

    .skin-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 480px) {
      .avatars-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .avatar-opt {
      padding: 10px 6px;
      border-radius: 16px;
      border: 1px solid var(--bd);
      background: var(--bg);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.14s ease, border-color 0.2s ease;
    }

    .avatar-opt:hover:not(:disabled) {
      border-color: var(--ac);
      transform: translateY(-2px);
    }

    .avatar-opt.active {
      border: 2px solid var(--ac);
      background: var(--ac-glow);
    }

    .avatar-opt.locked {
      opacity: 0.45;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    /* سجل النشاط */
    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--bd);
      font-size: 0.9rem;
    }

    .activity-item:last-child { border-bottom: 0; }

    /* نافذة الترقية الاحتفالية (Level-Up Modal) */
    .levelup-backdrop {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(5, 12, 10, 0.8);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadePop 0.26s ease-out;
    }

    .levelup-box {
      width: 100%;
      max-width: 460px;
      border-radius: 28px;
      padding: 28px 24px;
      text-align: center;
      background: var(--card);
      border: 2px solid var(--gold);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(235, 200, 126, 0.25);
      position: relative;
