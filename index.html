    // =========================================================================
    // 7. محرك Google Sheets المتكامل (الاستخراج، التطبيع، RFC-4180 CSV، التبديل الاحتياطي)
    // =========================================================================
    function extractSheetId(input) {
      const s = String(input || "").trim();
      if (!s) return "";
      const m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]{15,})/i);
      if (m && m[1] !== "e") return m[1];
      if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
      return "";
    }

    function parseCSV(text) {
      const clean = String(text || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        const next = clean[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (ch === "\r" && next === "\n") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
            i++;
          } else if (ch === "\n" || ch === "\r") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += ch;
          }
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }

      return rows.filter(r => r.some(v => v !== ""));
    }

    /**
     * التطبيع الذكي للتصنيفات العربية (مع إصلاح أولوية «علم النفس» قبل «علوم»)
     */
    function normalizeCategory(rawCat) {
      let v = normalizeArabic(rawCat);
      if (!v) return "o";
      if (CATS[v]) return v;

      const noAl = v.replace(/(^|\s)ال(?=\S)/g, "$1").trim();
      const tests = [v, noAl];

      for (const s of tests) {
        if (s === "m" || /(طب|صحه|علم النفس|نفسي|نفس|دماغ)/.test(s)) return "m";
        if (s === "s" || /^(علوم|فضاء|فلك|فيزياء|كيمياء|احياء)/.test(s) || /(علوم|فضاء|فلك|فيزياء|كيمياء|احياء|علم)/.test(s)) return "s";
        if (s === "h" || /(تاريخ|حضار|تراث)/.test(s)) return "h";
        if (s === "p" || /(فلسف|فكر|منطق)/.test(s)) return "p";
        if (s === "l" || /(ادب|لغه|شعر|نثر|بلاغه)/.test(s)) return "l";
        if (s === "g" || /(جغرافي|عجائب|دول|خرائط)/.test(s)) return "g";
        if (s === "t" || /(تكنولوج|تقني|اختراع|حاسوب|برمج|ذكاء)/.test(s)) return "t";
        if (s === "a" || /(فنون|فن|عماره|موسيقي|رسم|خط)/.test(s)) return "a";
      }
      return "o";
    }

    function extractFactsFromCSV(csvText) {
      const rows = parseCSV(csvText);
      if (!rows.length) return [];

      let startIdx = 0;
      let catIdx = 0, qIdx = 1, aIdx = 2;

      const firstNorm = rows[0].map(c => normalizeArabic(c));
      const joined = firstNorm.join(" ");
      const isHeader = /(تصنيف|فئه|سؤال|عنوان|اجابه|جواب|category|question|answer)/.test(joined);

      if (isHeader) {
        startIdx = 1;
        const foundCat = firstNorm.findIndex(c => /(تصنيف|فئه|مجال|category)/.test(c));
        const foundQ = firstNorm.findIndex(c => /(سؤال|عنوان|معلومه|question|title)/.test(c));
        const foundA = firstNorm.findIndex(c => /(اجابه|جواب|شرح|تفصيل|answer)/.test(c));
        if (foundQ !== -1 && foundA !== -1) {
          qIdx = foundQ;
          aIdx = foundA;
          catIdx = foundCat !== -1 ? foundCat : -1;
        }
      }

      const items = [];
      const seen = new Set();

      for (let i = startIdx; i < rows.length; i++) {
        const r = rows[i];
        let rawCat = "", q = "", a = "";

        if (r.length >= 3) {
          rawCat = catIdx >= 0 ? (r[catIdx] || "") : "";
          q = (r[qIdx] || "").trim();
          a = (r[aIdx] || "").trim();
          if (aIdx === 2 && r.length > 3) {
            const extra = r.slice(3).filter(Boolean).join("، ");
            if (extra) a = a ? `${a}، ${extra}` : extra;
          }
        } else if (r.length === 2) {
          rawCat = "o";
          q = r[0].trim();
          a = r[1].trim();
        } else {
          continue;
        }

        if (!q || !a) continue;
        const k = normalizeArabic(q);
        if (!k || seen.has(k)) continue;
        seen.add(k);

        items.push([normalizeCategory(rawCat), q, a]);
      }

      return items;
    }

    function rebuildAllFacts() {
      const combined = [];
      const seen = new Set();

      const sheetList = Array.isArray(state.sheetFacts) ? state.sheetFacts : [];
      for (const row of sheetList) {
        if (!Array.isArray(row) || row.length < 3) continue;
        const q = String(row[1] || "").trim();
        const a = String(row[2] || "").trim();
        if (!q || !a) continue;
        const key = normalizeArabic(q);
        if (seen.has(key)) continue;
        seen.add(key);
        combined.push({
          cat: CATS[row[0]] ? row[0] : "o",
          q,
          a,
          key,
          fromSheet: true
        });
      }

      for (const row of BASE_FACTS) {
        const q = row[1];
        const a = row[2];
        const key = normalizeArabic(q);
        if (seen.has(key)) continue;
        seen.add(key);
        combined.push({
          cat: row[0],
          q,
          a,
          key,
          fromSheet: false
        });
      }

      ALL_FACTS = combined;
      if (spotlightIdx >= ALL_FACTS.length) {
        spotlightIdx = 0;
      }
    }

    async function fetchCSVEndpoint(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const text = await res.text();
      const head = text.slice(0, 350).toLowerCase();
      if (head.includes("<!doctype html") || head.includes("<html") || head.includes("accounts.google.com")) {
        throw new Error("الجدول خاص أو يتطلب تسجيل دخول");
      }
      return text;
    }

    async function syncGoogleSheet({ customUrl = null, manual = false } = {}) {
      let targetUrl = customUrl !== null ? customUrl.trim() : (state.sheetRawUrl || DEFAULT_SHEET_URL);
      let sheetId = extractSheetId(targetUrl);
      const isDirectPubCsv = /\/spreadsheets\/d\/e\/[^/]+\/pub/i.test(targetUrl);

      if (!sheetId && !isDirectPubCsv) {
        sheetStatus = "error";
        sheetErrorMsg = "الرابط المدخل لا يبدو كرابط Google Sheets صالح.";
        updateSheetHud();
        if (manual) showToast("⚠️ يرجى لصق رابط Google Sheets صحيح");
        if (document.getElementById("sheet-modal-content")) renderSheetsModalBody();
        return false;
      }

      if (typeof navigator !== "undefined" && navigator.onLine === false) {
        sheetStatus = "offline";
        sheetErrorMsg = "لا يوجد اتصال بالإنترنت حالياً؛ يعمل الموقع بالكامل بالـ 1,000 معلومة المدمجة.";
        updateSheetHud();
        if (manual) showToast("📦 دون اتصال — الموسوعة المدمجة (1,000 معلومة) تعمل بالكامل!");
        if (document.getElementById("sheet-modal-content")) renderSheetsModalBody();
        return false;
      }

      sheetStatus = "loading";
      sheetErrorMsg = "";
      updateSheetHud();
      if (document.getElementById("sheet-modal-content")) renderSheetsModalBody();

      const ts = Date.now();
      const endpoints = [];

      if (isDirectPubCsv) {
        const csvUrl = /output=csv/i.test(targetUrl)
          ? targetUrl
          : targetUrl.replace(/\/pubhtml/i, "/pub") + (targetUrl.includes("?") ? "&output=csv" : "?output=csv");
        endpoints.push({ label: "Published CSV", url: `${csvUrl}&_t=${ts}` });
      } else {
        endpoints.push({
          label: "gviz/tq CSV",
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&_t=${ts}`
        });
        endpoints.push({
          label: "export CSV",
          url: `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&_t=${ts}`
        });
      }

      let lastErr = null;
      let csvText = null;

      for (const ep of endpoints) {
        try {
          csvText = await fetchCSVEndpoint(ep.url);
          sheetUsedEndpoint = ep.label;
          break;
        } catch (err) {
          lastErr = err;
        }
      }

      if (csvText === null) {
        const isAuthErr = lastErr && /خاص|دخول|403|401/.test(String(lastErr.message));
        sheetStatus = (!manual && !isAuthErr) ? "offline" : "error";
        sheetErrorMsg = isAuthErr
          ? "تعذّر الوصول إلى الجدول. تأكد من ضبط المشاركة على «أي شخص لديه الرابط: عارض»."
          : "تعذّر الاتصال بـ Google Sheets حالياً. يمكنك استخدام الـ 1,000 معلومة المدمجة والمحاولة لاحقاً.";
        if (lastErr && lastErr.message) {
          console.warn("Google Sheets sync fallback:", lastErr.message);
        }
        updateSheetHud();
        if (manual) showToast(isAuthErr ? "⚠️ تحقق من مشاركة الجدول (أي شخص لديه الرابط: عارض)" : "📦 تعذّر الاتصال — الـ 1,000 معلومة المدمجة جاهزة للاستخدام");
        if (document.getElementById("sheet-modal-content")) renderSheetsModalBody();
        return false;
      }

      const parsed = extractFactsFromCSV(csvText);
      const prevCount = state.sheetFacts.length;

      state.sheetId = sheetId || state.sheetId;
      state.sheetRawUrl = targetUrl;
      state.sheetFacts = parsed;
      state.sheetLastSync = new Date().toISOString();
      if (prevCount === 0 && parsed.length > 0) {
        awardXP(25, "أول مزامنة ناجحة مع جدول Google Sheets", { icon: "📊" });
      }

      sheetStatus = "ok";
      sheetErrorMsg = "";
      saveState();
      rebuildAllFacts();

      if (parsed.length > 0 && manual) {
        spotlightIdx = 0;
      }

      updateHeader();
      updateSheetHud();
      renderNav();
      renderView(false);
      if (document.getElementById("sheet-modal-content")) renderSheetsModalBody();

      if (manual) {
        showToast(parsed.length > 0
          ? `🟢 تمت المزامنة بنجاح! تم جلب ${parsed.length} معلومة من جدولك`
          : "🟢 تم الاتصال بالجدول بنجاح (لا توجد صفوف معلومات بعد)");
      }
      return true;
    }

    function updateSheetHud() {
      const grp = document.getElementById("sheet-hud-group");
      const btn = document.getElementById("sheet-status-btn");
      const ref = document.getElementById("sheet-refresh-btn");
      if (!grp || !btn || !ref) return;

      grp.classList.remove("is-ok", "is-warn", "is-err");
      const count = state.sheetFacts.length;

      if (sheetStatus === "loading") {
        grp.classList.add("is-warn");
        btn.innerHTML = `⏳ جاري المزامنة...`;
        ref.innerHTML = `<span class="spin">🔄</span>`;
        ref.disabled = true;
      } else if (sheetStatus === "ok") {
        grp.classList.add("is-ok");
        btn.innerHTML = `🟢 Google Sheets (${count})`;
        ref.innerHTML = `🔄`;
        ref.disabled = false;
      } else if (sheetStatus === "offline") {
        grp.classList.add("is-ok");
        btn.innerHTML = count > 0
          ? `📦 محلي (${ALL_FACTS.length}) · محفوظ (${count})`
          : `📦 وضع محلي (${ALL_FACTS.length})`;
        ref.innerHTML = `🔄`;
        ref.disabled = false;
      } else {
        grp.classList.add("is-warn");
        btn.innerHTML = count > 0
          ? `⚠️ محفوظ (${count}) · تحقق من المشاركة`
          : `📦 محلي (${ALL_FACTS.length}) · الجدول`;
        ref.innerHTML = `🔄`;
        ref.disabled = false;
      }
    }

    function formatSyncDate(iso) {
      if (!iso) return "لم تتم المزامنة بعد";
      try {
        return new Date(iso).toLocaleString("ar", {
          year: "numeric", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit"
        });
      } catch (e) {
        return iso;
      }
    }

    function renderSheetsModalBody() {
      const root = document.getElementById("sheet-modal-content");
      if (!root) return;

      const count = state.sheetFacts.length;
      const editUrl = state.sheetId
        ? `https://docs.google.com/spreadsheets/d/${state.sheetId}/edit`
        : (state.sheetRawUrl || DEFAULT_SHEET_URL);

      let statusBanner = "";
      if (sheetStatus === "loading") {
        statusBanner = `<div class="alert-box alert-warn">⏳ <b>جاري الاتصال والمزامنة مع جدول Google Sheets...</b></div>`;
      } else if (sheetStatus === "ok") {
        statusBanner = `
          <div class="alert-box alert-ok">
            🟢 <b>الجدول متصل ومُزامَن بنجاح!</b><br>
            تم جلب <b>${count}</b> معلومة من جدولك وتظهر في مقدمة الموسوعة بشارة «📊 من Google Sheets» إلى جانب <b>${BASE_FACTS.length}</b> معلومة مدمجة.<br>
            <small>آخر مزامنة: ${formatSyncDate(state.sheetLastSync)} ${sheetUsedEndpoint ? `(${sheetUsedEndpoint})` : ""}</small>
          </div>
        `;
      } else if (sheetStatus === "offline") {
        statusBanner = `
          <div class="alert-box alert-ok">
            📦 <b>الوضع المحلي جاهز — 1,000 معلومة مدمجة تعمل بدون إنترنت!</b><br>
            ${esc(sheetErrorMsg)}<br>
            ${count > 0 ? `<small>إضافة إلى آخر ${count} معلومة محفوظة مؤقتاً من جدولك.</small>` : ""}
          </div>
        `;
      } else {
        statusBanner = `
          <div class="alert-box alert-warn">
            ⚠️ <b>ملاحظة المزامنة:</b> ${esc(sheetErrorMsg)}<br>
            <small>الموسوعة المدمجة (${BASE_FACTS.length} معلومة)${count > 0 ? ` وآخر ${count} صف محفوظ من جدولك` : ""} متاحة بالكامل.</small>
          </div>
        `;
      }

      root.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
          <div style="width:44px;height:44px;border-radius:14px;background:var(--ac-glow);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;">📊</div>
          <div>
            <h2 style="margin:0;font-size:1.25rem;">جدول Google Sheets المتصل</h2>
            <p class="muted" style="margin:2px 0 0;font-size:0.84rem;">أي صف تضيفه في جدولك يظهر تلقائياً مع الـ 1,000 معلومة المدمجة</p>
          </div>
        </div>

        ${statusBanner}

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
          <a href="${esc(editUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="flex:1 1 200px;">
            ✏️ افتح الجدول للتعديل ↗
          </a>
          <button onclick="syncGoogleSheet({ manual: true })" ${sheetStatus === "loading" ? "disabled" : ""} class="btn btn-outline-ac" style="flex:1 1 160px;">
            🔄 تحديث الآن
          </button>
        </div>

        <div style="padding:14px;border-radius:18px;background:var(--bg);border:1px solid var(--bd);margin-bottom:16px;">
          <label for="custom-sheet-inp" class="kufi" style="display:block;font-size:0.86rem;font-weight:600;margin-bottom:8px;">
            تغيير رابط الجدول (اختياري):
          </label>
          <input id="custom-sheet-inp" type="url" dir="ltr" value="${esc(state.sheetRawUrl || DEFAULT_SHEET_URL)}"
            placeholder="https://docs.google.com/spreadsheets/d/..." style="margin-bottom:10px;font-size:0.82rem;">
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button onclick="applyCustomSheetUrl()" class="btn btn-primary btn-sm">🔗 ربط هذا الرابط</button>
            <button onclick="resetDefaultSheet()" class="btn btn-ghost btn-sm">↩️ العودة لجدولي الافتراضي</button>
          </div>
        </div>

        <div style="padding:14px;border-radius:18px;background:var(--bg);border:1px solid var(--bd);font-size:0.86rem;color:var(--mu);">
          <b class="kufi" style="color:var(--tx);display:block;margin-bottom:6px;">🛠️ نصائح سريعة في حال تعذّر الجلب:</b>
          <div style="line-height:1.8;">
            1. افتح جدولك في Google Sheets واضغط زر <b>مشاركة (Share)</b> في الأعلى.<br>
            2. من قسم «الوصول العام» غيّر الإعداد إلى: <b style="color:var(--ac);">أي شخص لديه الرابط ← عارض (Viewer)</b>.<br>
            3. رتّب الأعمدة الثلاثة الأولى كالتالي: <b style="color:var(--tx);">التصنيف | السؤال | الإجابة</b>.<br>
            4. يدعم الموقع التصنيفات العربية تلقائياً (العلوم، التاريخ، الفلسفة، الأدب، الجغرافيا، الطب وعلم النفس، التكنولوجيا، الفنون، أو أي تصنيف عام).
          </div>
        </div>
      `;
    }

    function applyCustomSheetUrl() {
      const inp = document.getElementById("custom-sheet-inp");
      if (!inp) return;
      syncGoogleSheet({ customUrl: inp.value, manual: true });
    }

    function resetDefaultSheet() {
      syncGoogleSheet({ customUrl: DEFAULT_SHEET_URL, manual: true });
    }

    // =========================================================================
    // 8. الرأس والتنقل وشريط المستوى والإشراقة المعرفية
    // =========================================================================
    function updateHeader() {
      const totalEl = document.getElementById("hdr-total");
      if (totalEl) totalEl.textContent = ALL_FACTS.length;

      const st = getStreak();
      const mult = getStreakMultiplier();
      const lvlInfo = getLevelInfo(state.xp);
      const avObj = AVATARS.find(a => a.id === state.avatarId) || AVATARS[0];
      const qs = getQuestsSummary();

      const stEl = document.getElementById("hud-streak");
      if (stEl) stEl.textContent = st;
      const multInline = document.getElementById("hud-mult");
      if (multInline) {
        multInline.style.display = mult.bonusPct > 0 ? "inline" : "none";
        multInline.textContent = mult.label;
      }
      const xpEl = document.getElementById("hud-xp");
      if (xpEl) xpEl.textContent = lvlInfo.totalXp;

      // تحديث شريط التقدم الديناميكي في الهيدر
      const ring = document.getElementById("hud-avatar-ring");
      if (ring) {
        ring.className = `avatar-ring ${lvlInfo.rank.cls}`;
        ring.style.setProperty("--rank-color", lvlInfo.rank.color);
        ring.style.setProperty("--rank-glow", lvlInfo.rank.glow);
      }
      const avIcon = document.getElementById("hud-avatar-icon");
      if (avIcon) avIcon.textContent = avObj.icon;
      const lvlBadge = document.getElementById("hud-lvl-badge");
      if (lvlBadge) lvlBadge.textContent = `Lv.${lvlInfo.level}`;
      const nameEl = document.getElementById("hud-user-name");
      if (nameEl) nameEl.textContent = state.userName || "باحث المعرفة";

      const rankEl = document.getElementById("hud-rank-badge");
      if (rankEl) {
        rankEl.textContent = `${lvlInfo.rank.icon} ${lvlInfo.rank.name}`;
        rankEl.style.setProperty("--rank-color", lvlInfo.rank.color);
      }
      const multBadge = document.getElementById("hud-mult-badge");
      if (multBadge) {
        multBadge.style.display = mult.bonusPct > 0 ? "inline-flex" : "none";
        multBadge.textContent = `⚡ مضاعف السلسلة ${mult.label}`;
      }
      const questsPill = document.getElementById("hud-quests-pill");
      if (questsPill) {
        const pending = qs.readyCount + (qs.bonusReady ? 1 : 0);
        questsPill.innerHTML = pending > 0
          ? `<span class="text-gold">🎁 ${pending} مكافأة جاهزة للاستلام!</span>`
          : `🎯 المهام اليومية: <b>${qs.claimedCount}/3</b>`;
      }

      const barFill = document.getElementById("hud-xp-fill");
      if (barFill) barFill.style.width = `${lvlInfo.pct}%`;
      const numsEl = document.getElementById("hud-xp-numbers");
      if (numsEl) numsEl.textContent = `${lvlInfo.currentLevelXp} / ${lvlInfo.neededForNext} XP`;
      const pctEl = document.getElementById("hud-xp-pct");
      if (pctEl) pctEl.textContent = `${lvlInfo.pct}% · متبقي ${lvlInfo.remainingXp} XP للمستوى ${lvlInfo.level + 1}`;

      if (!ALL_FACTS.length) return;
      const f = ALL_FACTS[spotlightIdx % ALL_FACTS.length];
      const cat = CATS[f.cat] || CATS.o;
      document.getElementById("spot-cat").textContent = `${cat.icon} ${cat.name}`;
      const sb = document.getElementById("spot-sheet-badge");
      if (sb) sb.style.display = f.fromSheet ? "inline-flex" : "none";
      document.getElementById("spot-text").innerHTML =
        `<b class="kufi text-ac">${esc(f.q)}</b> — ${esc(f.a)}`;
    }

    function rotateSpotlight() {
      if (ALL_FACTS.length <= 1) return;
      let next = Math.floor(Math.random() * ALL_FACTS.length);
      if (next === spotlightIdx) next = (next + 1) % ALL_FACTS.length;
      spotlightIdx = next;
      updateHeader();
    }

    function switchTab(tab) {
      currentTab = tab;
      cardFlipped = false;
      reviewRevealed = false;
      renderNav();
      renderView(true);
      if (tab === "wiki" && !wiki.article && !wiki.loading && !wiki.results.length) {
        fetchRandomWikiArticle();
      }
    }

    function renderNav() {
      const dueCount = getDueCards().length;
      const qs = getQuestsSummary();
      const hasQuestGift = (qs.readyCount > 0 || qs.bonusReady);

      const tabs = [
        { id: "explore", label: "الموسوعة",       icon: "📚" },
        { id: "daily",   label: "بطاقات اليوم",    icon: "🎴" },
        { id: "review",  label: dueCount > 0 ? `المراجعة (${dueCount})` : "المراجعة", icon: "🧠" },
        { id: "quiz",    label: "تحدي الثقافة",    icon: "🏆" },
        { id: "wiki",    label: "استكشف بلا حدود", icon: "🌐" },
        { id: "studio",  label: "حقيبتي",         icon: "✍️" },
        { id: "profile", label: "ملفي وإنجازاتي",  icon: "🏅", dot: hasQuestGift }
      ];

      document.getElementById("main-nav").innerHTML = tabs.map(t => `
        <button onclick="switchTab('${t.id}')" class="nav-btn ${t.id === currentTab ? "active" : ""}">
          <span>${t.icon}</span>
          <span class="lbl">${t.label}</span>
          ${t.dot ? `<span class="nav-dot" title="لديك مكافأة مهمة جاهزة!"></span>` : ""}
        </button>
      `).join("");

      const nudge = document.getElementById("daily-nudge-root");
      const dailyDoneToday = state.dailyDate === todayNum() && state.dailyKeys.length > 0 && state.dailyPos >= state.dailyKeys.length;
      if (!dailyDoneToday && currentTab !== "daily") {
        nudge.innerHTML = `
          <div onclick="switchTab('daily')" class="daily-nudge">
            <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;">
              <span style="font-size:1.3rem;">🎴</span>
              <span><b>بطاقات اليوم بانتظارك!</b> اقلب بطاقاتك اليومية لتثبيت المعرفة وكسب <b>+50 XP</b> إضافية.</span>
            </div>
            <span class="btn btn-primary btn-sm">ابدأ الآن</span>
          </div>
        `;
      } else {
        nudge.innerHTML = "";
      }
    }

    function renderView(animate = true) {
      const view = document.getElementById("app-view");
      if (!view) return;
      if (animate) {
        view.classList.remove("anim-pop");
        void view.offsetWidth;
        view.classList.add("anim-pop");
      } else {
        view.classList.remove("anim-pop");
      }

      if (currentTab === "explore") view.innerHTML = viewExplore();
      else if (currentTab === "daily") view.innerHTML = viewDaily();
      else if (currentTab === "review") view.innerHTML = viewReview();
      else if (currentTab === "quiz") view.innerHTML = viewQuiz();
      else if (currentTab === "wiki") view.innerHTML = viewWiki();
      else if (currentTab === "studio") view.innerHTML = viewStudio();
      else if (currentTab === "profile") view.innerHTML = viewProfile();
    }

    // =========================================================================
    // 9. التبويب 1: الموسوعة (بحث فوري، جدولك أولاً، فلاتر مع العدادات، مفضلة، ترقيم)
    // =========================================================================
    function viewExplore() {
      const sheetCount = ALL_FACTS.filter(f => f.fromSheet).length;
      const favCount = ALL_FACTS.filter(f => state.favorites.includes(f.key)).length;

      const catCounts = {};
      Object.keys(CATS).forEach(k => catCounts[k] = 0);
      ALL_FACTS.forEach(f => {
        if (catCounts[f.cat] !== undefined) catCounts[f.cat]++;
      });

      const qNorm = normalizeArabic(expSearch);
      const qRaw = expSearch.trim().toLowerCase();

      const filtered = [];
      ALL_FACTS.forEach((f, idx) => {
        if (expFilter === "sheet" && !f.fromSheet) return;
        if (expFilter === "fav" && !state.favorites.includes(f.key)) return;
        if (expFilter !== "all" && expFilter !== "sheet" && expFilter !== "fav" && f.cat !== expFilter) return;

        if (qRaw) {
          const hit = f.q.toLowerCase().includes(qRaw)
            || f.a.toLowerCase().includes(qRaw)
            || f.key.includes(qNorm)
            || normalizeArabic(f.a).includes(qNorm);
          if (!hit) return;
        }
        filtered.push({ idx, f });
      });

      const visible = filtered.slice(0, expLimit);
      const hasMore = filtered.length > expLimit;
      const catList = catCounts.o > 0 ? [...MAIN_CAT_KEYS, "o"] : MAIN_CAT_KEYS;

      let html = `
        <div class="stats-grid">
          <div onclick="setExpFilter('all')" class="surface stat-box clickable">
            <b class="text-ac">${ALL_FACTS.length}</b>
            <span>إجمالي المعلومات</span>
          </div>
          <div onclick="setExpFilter('sheet')" class="surface stat-box clickable" style="${sheetCount > 0 ? "border-color:var(--ac);" : ""}">
            <b class="${sheetCount > 0 ? "text-good" : "muted"}">${sheetCount}</b>
            <span>📊 من جدولك الحي</span>
          </div>
          <div onclick="setExpFilter('fav')" class="surface stat-box clickable">
            <b class="text-gold">${favCount}</b>
            <span>❤️ في المفضلة</span>
          </div>
          <div onclick="switchTab('wiki')" class="surface stat-box clickable">
            <b class="text-ac">∞</b>
            <span>🌐 ويكيبيديا الحية</span>
          </div>
        </div>

        <div class="surface filter-panel">
          <div class="search-row">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input id="exp-search-inp" type="text" value="${esc(expSearch)}"
                oninput="onExploreSearch(this.value)"
                placeholder="ابحث في ${ALL_FACTS.length} معلومة (مثلاً: المريخ، الخوارزمي، المتنبي، البلاسيبو)...">
              ${expSearch ? `<button onclick="onExploreSearch('')" class="search-clear" aria-label="مسح البحث">✕</button>` : ""}
            </div>
            <button onclick="openRandomFactModal()" class="btn btn-primary" style="flex-shrink:0;">
              🎲 معلومة عشوائية
            </button>
          </div>

          <div class="chips-row">
            <button onclick="setExpFilter('all')" class="chip ${expFilter === "all" ? "on" : ""}">
              🌐 الكل (${ALL_FACTS.length})
            </button>
            <button onclick="setExpFilter('sheet')" class="chip sheet-chip ${expFilter === "sheet" ? "on" : ""}">
              📊 من جدولك (${sheetCount})
            </button>
            <button onclick="setExpFilter('fav')" class="chip fav-chip ${expFilter === "fav" ? "on" : ""}">
              ❤️ المفضلة (${favCount})
            </button>
            ${catList.map(k => `
              <button onclick="setExpFilter('${k}')" class="chip ${expFilter === k ? "on" : ""}">
                ${CATS[k].icon} ${CATS[k].name} (${catCounts[k]})
              </button>
            `).join("")}
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:0 4px;font-size:0.86rem;">
          <span class="kufi muted">عرض <b>${visible.length}</b> من أصل <b>${filtered.length}</b> معلومة</span>
          ${(expFilter !== "all" || expSearch)
            ? `<button onclick="resetExploreFilters()" class="kufi text-ac" style="background:none;border:0;text-decoration:underline;font-size:0.84rem;">إعادة ضبط الفلاتر</button>`
            : ""}
        </div>
      `;

      if (filtered.length === 0) {
        const isSheetEmpty = expFilter === "sheet" && sheetCount === 0;
        html += `
          <div class="surface text-center" style="padding:42px 22px;">
            <div style="font-size:2.8rem;margin-bottom:8px;">${isSheetEmpty ? "📊" : "🔭"}</div>
            <h3 style="margin:0 0 8px;">
              ${isSheetEmpty ? "لا توجد صفوف مُزامنة من جدولك بعد" : "لم نعثر على نتائج مطابقة"}
            </h3>
            <p class="muted" style="max-width:480px;margin:0 auto 18px;font-size:0.93rem;">
              ${isSheetEmpty
                ? "تحقق من أن جدول Google Sheets مضبوط على «أي شخص لديه الرابط: عارض» ويحتوي على صفوف تحت العناوين، ثم اضغط تحديث."
                : (expSearch ? `لم نجد «${esc(expSearch)}» في الموسوعة المدمجة — يمكنك البحث عنها مباشرةً في ويكيبيديا العربية الحية!` : "جرّب تصنيفاً آخر أو تصفح كل المعلومات.")}
            </p>
            <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
              ${isSheetEmpty ? `
                <button onclick="syncGoogleSheet({ manual: true })" class="btn btn-primary">🔄 تحديث من Google Sheets</button>
                <button onclick="openSheetsModal()" class="btn btn-ghost">⚙️ تفاصيل الجدول</button>
              ` : ""}
              ${expSearch ? `
                <button onclick="searchCurrentExpInWiki()" class="btn btn-primary">🌐 ابحث في ويكيبيديا الحية</button>
              ` : ""}
              <button onclick="resetExploreFilters()" class="btn btn-ghost">عرض كل المعلومات</button>
            </div>
          </div>
        `;
        return html;
      }

      html += `<div class="facts-grid">`;
      visible.forEach(({ idx, f }) => {
        const cat = CATS[f.cat] || CATS.o;
        const isFav = state.favorites.includes(f.key);
        const inDeck = state.cards.some(c => normalizeArabic(c.q) === f.key);

        html += `
          <article onclick="openFactDetailModal(${idx})" class="themed-card fact-card ${cat.cls} ${f.fromSheet ? "from-sheet" : ""}">
            <div>
              <div class="fact-head">
                <div class="fact-badges">
                  ${f.fromSheet ? `<span class="badge-sheet">📊 من Google Sheets</span>` : ""}
                  <span class="tag-cat">${cat.icon} ${cat.short}</span>
                </div>
                <div class="fact-tools" onclick="event.stopPropagation()">
                  <button onclick="copyFactByIdx(${idx})" class="icon-btn" title="نسخ المعلومة" aria-label="نسخ">📋</button>
                  <button onclick="toggleFavorite(${idx})" class="icon-btn" title="المفضلة" aria-label="مفضلة">
                    ${isFav ? "❤️" : "🤍"}
                  </button>
                </div>
              </div>
              <h3 class="fact-q">${esc(f.q)}</h3>
              <p class="fact-a">${esc(f.a)}</p>
            </div>

            <div class="fact-foot" onclick="event.stopPropagation()">
              <button onclick="sendFactToReview(${idx})" class="mini-pill">
                ${inDeck ? "✅ في المراجعة" : "🧠 أضف للمراجعة"}
              </button>
              <button onclick="openFactDetailModal(${idx})" class="kufi" style="background:none;border:0;font-size:0.8rem;opacity:0.88;">
                اقرأ المزيد ←
              </button>
            </div>
          </article>
        `;
      });
      html += `</div>`;

      if (hasMore) {
        const rem = filtered.length - expLimit;
        html += `
          <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;">
            <button onclick="expLimit += 18; renderView(false);" class="btn btn-primary">
              عرض المزيد (+${Math.min(18, rem)} من أصل ${rem} متبقية)
            </button>
            <button onclick="expLimit = ${filtered.length}; renderView(false);" class="btn btn-ghost">
              عرض الكل (${filtered.length})
            </button>
          </div>
        `;
      }

      return html;
    }

    function onExploreSearch(val) {
      expSearch = val;
      expLimit = 18;
      renderView(false);
      const inp = document.getElementById("exp-search-inp");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }

    function setExpFilter(filter) {
      expFilter = filter;
      expLimit = 18;
      renderView(false);
    }

    function resetExploreFilters() {
      expFilter = "all";
      expSearch = "";
      expLimit = 18;
      renderView(false);
    }

    function searchCurrentExpInWiki() {
      const term = expSearch.trim();
      wiki.query = term;
      currentTab = "wiki";
      renderNav();
      renderView(true);
      runWikiSearch(term);
    }

    function toggleFavorite(idx) {
      const f = ALL_FACTS[idx];
      if (!f) return;
      const pos = state.favorites.indexOf(f.key);
      if (pos === -1) {
        state.favorites.push(f.key);
        if (!state.rewardedFavorites.includes(f.key)) {
          state.rewardedFavorites.push(f.key);
          advanceQuest("fav_collect", 1);
          const res = awardXP(5, "إضافة معلومة جديدة إلى المفضلة", { icon: "❤️" });
          showToast(`❤️ أُضيفت إلى المفضلة (${formatXpGainText(res)})`);
        } else {
          showToast("❤️ أُضيفت إلى المفضلة");
        }
      } else {
        state.favorites.splice(pos, 1);
        showToast("أُزيلت من المفضلة");
      }
      saveState();
      updateHeader();
      renderNav();
      renderView(false);
    }

    function copyFactByIdx(idx) {
      const f = ALL_FACTS[idx];
      if (!f) return;
      copyToClipboard(`💡 ${f.q}\n${f.a}\n— موسوعة مِشْكاة المعرفة`);
    }

    function sendFactToReview(idx) {
      const f = ALL_FACTS[idx];
      if (!f) return;

      renderNav();
      renderView(false);

    // =========================================================================
    // 10. التبويب 2: بطاقات اليوم ثلاثية الأبعاد (Daily 3D Flip Cards)
    // =========================================================================
    function buildDailySession(force = false) {
      const t = todayNum();
      const valid = state.dailyKeys.filter(k => ALL_FACTS.some(f => f.key === k));
      if (!force && state.dailyDate === t && valid.length > 0) {
        state.dailyKeys = valid;
        return;
      }

      let pool = ALL_FACTS.filter(f => {
        if (state.dailyCat === "all") return true;
        if (state.dailyCat === "sheet") return f.fromSheet;
        return f.cat === state.dailyCat;
      });
      if (!pool.length) pool = ALL_FACTS.slice();

      const sheetItems = pool.filter(f => f.fromSheet);
      const otherItems = pool.filter(f => !f.fromSheet);
      for (let i = otherItems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherItems[i], otherItems[j]] = [otherItems[j], otherItems[i]];
      }
      const combined = [...sheetItems, ...otherItems];

      state.dailyDate = t;
      state.dailyKeys = combined.slice(0, Math.min(state.dailySize, combined.length)).map(f => f.key);
      state.dailyPos = 0;
      cardFlipped = false;
      saveState();
    }

    function changeDailyConfig(newSize, newCat) {
      if (newSize) state.dailySize = newSize;
      if (newCat) state.dailyCat = newCat;
      buildDailySession(true);
      renderView(false);
      showToast(`تم تجهيز جلسة جديدة (${state.dailyKeys.length} بطاقة)`);
    }

    }

    // =========================================================================
    // 12. التبويب 4: تحدي الثقافة (Quiz Mode — 5 / 10 / 15 سؤال + شروحات)
    // =========================================================================
    function startQuiz() {
      let pool = ALL_FACTS.filter(f => {
        if (quiz.cat === "all") return true;
        if (quiz.cat === "sheet") return f.fromSheet;
        return f.cat === quiz.cat;
      });
      if (pool.length < 4) {
        showToast("أقل من 4 معلومات في هذا القسم — سيتم التحدي من كامل الموسوعة");
        pool = ALL_FACTS.slice();
      }

      const sheetRows = pool.filter(f => f.fromSheet);
      const others = pool.filter(f => !f.fromSheet);
      for (let i = others.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [others[i], others[j]] = [others[j], others[i]];
      }
      const mixed = [...sheetRows.slice(0, 3), ...others];
      for (let i = mixed.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
      }

      const selected = mixed.slice(0, Math.min(quiz.count, mixed.length));
      quiz.questions = selected.map(correct => {
        // منع تكرار المشتّتات بتطبيع نص الإجابة
        const correctNorm = normalizeArabic(correct.a);
        const pickUniqueDistractors = (source) => {
          const out = [];
          const seenAns = new Set([correctNorm]);
          const copy = source.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          for (const item of copy) {
            if (item.key === correct.key) continue;
            const normA = normalizeArabic(item.a);
            if (!normA || seenAns.has(normA)) continue;
            seenAns.add(normA);
            out.push(item.a);
            if (out.length === 3) break;
          }
          return out;
        };

        let distractors = pickUniqueDistractors(ALL_FACTS.filter(x => x.cat === correct.cat));
        if (distractors.length < 3) {
          distractors = pickUniqueDistractors(ALL_FACTS);
        }

        const options = [
          { text: correct.a, ok: true },
          ...distractors.slice(0, 3).map(d => ({ text: d, ok: false }))
        ];
        for (let i = options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [options[i], options[j]] = [options[j], options[i]];
        }
        return {
          cat: correct.cat,
          q: correct.q,
          explanation: correct.a,
          fromSheet: correct.fromSheet,
          options
        };
      });

      quiz.active = true;
      quiz.index = 0;
      quiz.score = 0;
      quiz.answered = false;
      quiz.chosenIdx = null;
      renderView(true);
    }

    function viewQuiz() {
      const sheetCount = ALL_FACTS.filter(f => f.fromSheet).length;

      if (!quiz.active) {
        return `
          <div class="narrow-wrap surface text-center" style="padding:30px 22px;">

            </p>

            ${state.quizBest > 0 ? `<div class="tag-gold" style="margin-bottom:18px;font-size:0.84rem;">🥇 أعلى نتيجة: ${state.quizBest}%</div>` : ""}

            <div style="text-align:right;background:var(--bg);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:20px;">

                <select onchange="quiz.cat = this.value">
                  <option value="all" ${quiz.cat === "all" ? "selected" : ""}>🌐 جميع التصنيفات (متنوع)</option>
                  ${sheetCount >= 4 ? `<option value="sheet" ${quiz.cat === "sheet" ? "selected" : ""}>📊 من جدولك فقط (${sheetCount})</option>` : ""}
                  ${MAIN_CAT_KEYS.map(k => `<option value="${k}" ${quiz.cat === k ? "selected" : ""}>${CATS[k].icon} ${CATS[k].name}</option>`).join("")}
                </select>
              </div>
              <div>

                <div class="row-3">
                  ${[5, 10, 15].map(n => `
                    <button onclick="quiz.count = ${n}; renderView(false);" class="btn btn-sm ${quiz.count === n ? "btn-primary" : "btn-ghost"}">${n} أسئلة</button>

              </div>
            </div>

            <button onclick="startQuiz()" class="btn btn-primary" style="min-width:220px;">🚀 ابدأ التحدي الآن</button>
          </div>
        `;
      }

      if (quiz.index >= quiz.questions.length) {
        const total = quiz.questions.length;
        const pct = Math.round((quiz.score / total) * 100);
        const msg = pct >= 90 ? "أداء أسطوري! أنت موسوعة متحركة بحق 🌟"
                  : pct >= 70 ? "ثقافة رفيعة ومعلومات غزيرة 👏"
                  : pct >= 50 ? "نتيجة جيدة جداً! واصل الاستكشاف 📚"
                  : "بداية رائعة! تصفح الموسوعة وعد لجولة أقوى 🌱";

        return `
          <div class="narrow-wrap surface text-center" style="padding:36px 22px;">
            <div class="float-icon">${pct >= 80 ? "🥇" : pct >= 50 ? "🥈" : "🌱"}</div>
            <h2 style="margin:0 0 8px;">نتيجتك: ${quiz.score} من ${total} (${pct}%)</h2>
            <p class="muted" style="margin:0 0 22px;">${msg}</p>
            <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
              <button onclick="startQuiz()" class="btn btn-primary">🔄 جولة جديدة</button>
              <button onclick="quiz.active = false; renderView(false);" class="btn btn-ghost">⚙️ تغيير الإعدادات</button>
              <button onclick="switchTab('profile')" class="btn btn-gold">🏅 ملفي وإنجازاتي</button>
            </div>
          </div>
        `;
      }

      const qObj = quiz.questions[quiz.index];
      const cat = CATS[qObj.cat] || CATS.o;
      const pct = Math.round((quiz.index / quiz.questions.length) * 100);
      const isRightAnswer = quiz.answered && qObj.options[quiz.chosenIdx] && qObj.options[quiz.chosenIdx].ok;

      return `
        <div class="narrow-wrap">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.86rem;margin-bottom:6px;" class="kufi muted">
            <span>السؤال ${quiz.index + 1} من ${quiz.questions.length}</span>
            <div style="display:flex;align-items:center;gap:12px;">
              <span>النقاط: <b class="text-ac">${quiz.score}</b></span>
              <button onclick="quiz.active = false; renderView(false);" style="background:none;border:0;text-decoration:underline;font-size:0.8rem;color:var(--mu);">إنهاء</button>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%;"></div>
          </div>

          <div class="themed-card ${cat.cls}" style="padding:22px;margin-bottom:14px;">
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
              ${qObj.fromSheet ? `<span class="badge-sheet">📊 من Google Sheets</span>` : ""}
              <span class="tag-cat">${cat.icon} ${cat.name}</span>
            </div>
            <h3 style="margin:0;font-size:1.22rem;line-height:1.55;">${esc(qObj.q)}</h3>
          </div>

          <div>
            ${qObj.options.map((opt, i) => {
              let cls = "quiz-opt";
              let mark = ["أ", "ب", "ج", "د"][i];
              if (quiz.answered) {
                if (opt.ok) { cls += " correct"; mark = "✓"; }
                else if (i === quiz.chosenIdx) { cls += " wrong"; mark = "✕"; }
                else cls += " dimmed";
              }
              return `
                <button onclick="answerQuiz(${i}, event)" ${quiz.answered ? "disabled" : ""} class="${cls}">
                  <span class="opt-letter">${mark}</span>
                  <span>${esc(opt.text)}</span>
                </button>
              `;
            }).join("")}
          </div>

          ${quiz.answered ? `
            <div class="alert-box ${isRightAnswer ? "alert-ok" : "alert-warn"} anim-pop" style="margin-top:12px;">
              <b>${isRightAnswer ? "✅ إجابة صحيحة! (+15 XP)" : "💡 الإجابة الصحيحة:"}</b><br>
              ${esc(qObj.explanation)}
            </div>
            <button onclick="nextQuizStep()" class="btn btn-primary btn-block anim-pop">
              ${quiz.index + 1 < quiz.questions.length ? "السؤال التالي ←" : "عرض النتيجة النهائية 🏆"}
            </button>
          ` : ""}
        </div>
      `;
    }

    function answerQuiz(optIdx, ev) {
      if (quiz.answered) return;
      quiz.answered = true;
      quiz.chosenIdx = optIdx;

      const ok = quiz.questions[quiz.index].options[optIdx].ok;
      if (ok) {
        quiz.score++;
        advanceQuest("quiz_correct", 1);
        awardXP(15, "إجابة صحيحة في تحدي الثقافة", { icon: "🏆" });
        if (ev) boom(ev.clientX, ev.clientY, 26);
      }

      if (quiz.index + 1 === quiz.questions.length) {
        const pct = Math.round((quiz.score / quiz.questions.length) * 100);
        if (pct > state.quizBest) state.quizBest = pct;
        advanceQuest("quiz_finish", 1);
        const finishBonus = pct >= 80 ? 35 : 15;
        awardXP(finishBonus, `إتمام جولة تحدي الثقافة بنتيجة ${pct}%`, { icon: pct >= 80 ? "🥇" : "🎯" });
        if (pct >= 80) {
          setTimeout(() => boom(window.innerWidth / 2, window.innerHeight / 3, 130), 220);
        }
      }

      saveState();
      updateHeader();
      renderNav();
      renderView(false);
    }

    function nextQuizStep() {
      quiz.index++;
      quiz.answered = false;
      quiz.chosenIdx = null;
      renderView(true);
    }

    // =========================================================================
    // 13. التبويب 5: استكشف بلا حدود — ويكيبيديا العربية الحية + مقالات بديلة
    // =========================================================================
    const WIKI_TOPICS = [
      "الحضارة السومرية", "الثقوب السوداء", "الأندلس", "ابن الهيثم",
      "بيت الحكمة", "بابل", "الفلسفة الرواقية", "الذكاء الاصطناعي", "طريق الحرير"
    ];

    async function fetchRandomWikiArticle() {
      wiki.loading = true;
      wiki.error = "";
      wiki.results = [];
      renderView(false);

      try {
        const res = await fetch("https://ar.wikipedia.org/api/rest_v1/page/random/summary");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        wiki.article = {
          title: data.title,
          description: data.description || "",
          extract: data.extract || "لا يوجد ملخص متاح لهذا المقال.",
          thumb: data.thumbnail ? data.thumbnail.source : "",
          url: (data.content_urls && data.content_urls.desktop) ? data.content_urls.desktop.page : ""
        };
      } catch (e) {
        wiki.error = "تعذّر الاتصال بويكيبيديا العربية حالياً. يمكنك تصفح هذه المقالات المختارة من مكتبتنا المدمجة أدناه!";
      } finally {
        wiki.loading = false;
        if (currentTab === "wiki") renderView(false);
      }
    }

    async function runWikiSearch(customTerm) {
      const term = (customTerm !== undefined ? customTerm : wiki.query).trim();
      if (!term) {
        showToast("اكتب موضوعاً للبحث في ويكيبيديا العربية");
        return;
      }
      wiki.query = term;
      wiki.loading = true;
      wiki.error = "";
      renderView(false);

      try {
        const url = `https://ar.wikipedia.org/w/api.php?action=query&list=search&origin=*&format=json&srlimit=8&srsearch=${encodeURIComponent(term)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const list = (data.query && data.query.search) ? data.query.search : [];
        wiki.results = list.map(r => ({
          title: r.title,
          snippet: r.snippet.replace(/<[^>]+>/g, "")
        }));
        if (list.length > 0) {
          await fetchWikiSummary(list[0].title, false);
        } else {
          wiki.article = null;
          wiki.error = `لم نجد مقالات في ويكيبيديا العربية تطابق «${term}».`;
        }
      } catch (e) {
        wiki.error = "تعذّر الاتصال بخادم ويكيبيديا الآن. تصفّح المقترحات المدمجة أدناه.";
      } finally {
        wiki.loading = false;
        if (currentTab === "wiki") renderView(false);
      }
    }

    async function fetchWikiSummary(title, showLoad = true) {
      if (showLoad) {
        wiki.loading = true;
        wiki.error = "";
        renderView(false);
      }
      try {
        const res = await fetch(`https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        wiki.article = {
          title: data.title,
          description: data.description || "",
          extract: data.extract || "لا يوجد ملخص نصي متاح.",
          thumb: data.thumbnail ? data.thumbnail.source : "",
          url: (data.content_urls && data.content_urls.desktop) ? data.content_urls.desktop.page : ""
        };
      } catch (e) {
        wiki.error = "تعذّر جلب ملخص هذا المقال حالياً.";
      } finally {
        if (showLoad) {
          wiki.loading = false;
          if (currentTab === "wiki") renderView(false);
        }
      }
    }

    function openWikiResultIdx(i) {
      const r = wiki.results[i];
      if (r) fetchWikiSummary(r.title, true);
    }

    function saveWikiArticle() {
      if (!wiki.article) return;
      const sel = document.getElementById("wiki-cat-sel");
      const cat = sel ? sel.value : "o";
      const q = `ما هو / من هو: ${wiki.article.title}؟`;
      if (state.cards.some(c => normalizeArabic(c.q) === normalizeArabic(q))) {
        showToast("هذا المقال محفوظ بالفعل في بطاقاتك");
        return;
      }
      addCardToSRS(cat, q, wiki.article.extract, 0, 0);
      state.wikiSavedCount = (state.wikiSavedCount || 0) + 1;
      advanceQuest("srs_review", 1);
      const res = awardXP(20, `حفظ مقال ويكيبيديا: ${wiki.article.title}`, { icon: "🌐" });
      saveState();
      updateHeader();
      renderNav();
      showToast(`✨ تم حفظ المقال كبطاقة مراجعة (${formatXpGainText(res)})`);
    }

    function viewWiki() {
      const fallbacks = [];
      for (let i = 0; i < 3 && ALL_FACTS.length; i++) {
        fallbacks.push((spotlightIdx + i * 23) % ALL_FACTS.length);
      }

      return `
        <div class="medium-wrap">
          <div class="surface" style="padding:20px;margin-bottom:16px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
              <div>
                <h2 style="margin:0;font-size:1.25rem;">🌐 استكشف بلا حدود (ويكيبيديا العربية)</h2>
                <p class="muted" style="margin:2px 0 0;font-size:0.86rem;">ابحث عن أي موضوع ثقافي وحوّل المقال بضغطة واحدة إلى بطاقة مراجعة</p>
              </div>
              <button onclick="fetchRandomWikiArticle()" class="btn btn-primary btn-sm">🎲 مقال عشوائي</button>

              <input id="wiki-inp" type="text" value="${esc(wiki.query)}" oninput="wiki.query = this.value"
                placeholder="ابحث عن أي موضوع: بابل، النسبية، المتنبي، اليابان...">
              <button type="submit" class="btn btn-primary" style="flex-shrink:0;">بحث</button>
            </form>

            <div class="chips-row">
              ${WIKI_TOPICS.map(t => `<button onclick="runWikiSearch('${t}')" class="chip" style="min-height:34px;padding:4px 12px;">${t}</button>`).join("")}
            </div>
          </div>

          ${wiki.loading ? `
            <div class="surface text-center" style="padding:42px 20px;">
              <div class="float-icon">🛰️</div>
              <p class="kufi" style="margin:0;">جاري جلب المقال من ويكيبيديا العربية...</p>
            </div>
          ` : ""}

          ${!wiki.loading && wiki.error ? `
            <div class="surface" style="padding:18px;margin-bottom:16px;border-color:var(--warn);">
              <p class="kufi" style="margin:0 0 12px;color:var(--warn);">⚠️ ${esc(wiki.error)}</p>
              <div class="facts-grid">
                ${fallbacks.map(idx => {
                  const f = ALL_FACTS[idx];
                  const c = CATS[f.cat] || CATS.o;
                  return `
                    <div onclick="openFactDetailModal(${idx})" class="themed-card fact-card ${c.cls}" style="padding:14px;">
                      <span class="tag-cat" style="margin-bottom:8px;">${c.icon} ${c.short}</span>
                      <h4 style="margin:0;font-size:0.95rem;">${esc(f.q)}</h4>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          ` : ""}

          ${!wiki.loading && wiki.article ? `
            <article class="surface anim-pop" style="padding:22px;margin-bottom:16px;">
              <div class="wiki-card-flex">
                ${wiki.article.thumb ? `
                  <img src="${esc(wiki.article.thumb)}" alt="${esc(wiki.article.title)}"
                    onerror="this.style.display='none'" class="wiki-thumb">
                ` : ""}
                <div style="flex:1;min-width:0;">
                  <span class="badge-sheet" style="margin-bottom:8px;">📖 ويكيبيديا العربية</span>
                  <h3 style="margin:0 0 4px;font-size:1.4rem;">${esc(wiki.article.title)}</h3>
                  ${wiki.article.description ? `<p class="kufi muted" style="margin:0 0 10px;font-size:0.84rem;">${esc(wiki.article.description)}</p>` : ""}
                  <p style="margin:0 0 16px;font-size:1rem;line-height:1.85;">${esc(wiki.article.extract)}</p>

                  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--bd);">
                    <select id="wiki-cat-sel" style="width:auto;padding:8px 12px;font-size:0.84rem;">
                      ${MAIN_CAT_KEYS.map(k => `<option value="${k}">${CATS[k].icon} ${CATS[k].short}</option>`).join("")}
                      <option value="o">✨ ثقافة عامة</option>
                    </select>
                    <button onclick="saveWikiArticle()" class="btn btn-primary btn-sm">🧠 حفظ كبطاقة مراجعة</button>
                    <button onclick="copyToClipboard(wiki.article.title + '\\n' + wiki.article.extract)" class="btn btn-ghost btn-sm">📋 نسخ</button>
                    ${wiki.article.url ? `<a href="${esc(wiki.article.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-ac btn-sm">المقال الكامل ↗</a>` : ""}
                  </div>
                </div>
              </div>
            </article>
          ` : ""}

          ${!wiki.loading && wiki.results.length > 1 ? `
            <div class="surface" style="padding:18px;">
              <h4 style="margin:0 0 12px;">📑 نتائج أخرى ذات صلة</h4>
              <div class="stack-md">
                ${wiki.results.map((r, i) => `
                  <button onclick="openWikiResultIdx(${i})" style="text-align:right;padding:13px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);">
                    <b class="kufi text-ac" style="display:block;margin-bottom:4px;">${esc(r.title)}</b>
                    <span class="muted" style="font-size:0.84rem;font-family:'Noto Naskh Arabic',serif;">${esc(r.snippet)}...</span>
                  </button>
                `).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }

    // =========================================================================
    // 14. التبويب 6: حقيبتي (إضافة بطاقات فردية/جماعية، إدارة المراجعة، JSON)
    // =========================================================================
    function viewStudio() {
      const q = normalizeArabic(studioSearch);
      const filtered = state.cards.filter(c =>
        !q || normalizeArabic(c.q).includes(q) || normalizeArabic(c.a).includes(q)
      );

      return `
        <div class="medium-wrap" style="display:flex;flex-direction:column;gap:16px;">
          <div class="stack-md">
            <div class="surface" style="padding:20px;">
              <h3 style="margin:0 0 4px;">✍️ إضافة بطاقة جديدة</h3>
              <p class="muted" style="margin:0 0 12px;font-size:0.84rem;">تُضاف مباشرةً إلى جدول المراجعة الذكية</p>
              <div style="display:flex;flex-direction:column;gap:10px;">
                <select id="st-cat">
                  ${MAIN_CAT_KEYS.map(k => `<option value="${k}">${CATS[k].icon} ${CATS[k].name}</option>`).join("")}
                  <option value="o">✨ ثقافة عامة</option>
                </select>
                <input id="st-q" type="text" placeholder="السؤال أو عنوان المعلومة...">
                <textarea id="st-a" rows="3" placeholder="الإجابة أو الشرح..."></textarea>
                <button onclick="handleSingleAdd()" class="btn btn-primary btn-block">+ حفظ البطاقة</button>
              </div>
            </div>

            <div class="surface" style="padding:20px;display:flex;flex-direction:column;justify-content:space-between;">
              <div>
                <h3 style="margin:0 0 4px;">⚡ إضافة عدة بطاقات معاً</h3>
                <p class="muted" style="margin:0 0 12px;font-size:0.84rem;">كل سطر بصيغة: <b>السؤال | الإجابة</b></p>
                <textarea id="st-bulk" rows="6" placeholder="من مؤلف كتاب العين؟ | الخليل بن أحمد الفراهيدي&#10;ما عاصمة اليابان؟ | طوكيو" style="margin-bottom:10px;"></textarea>
              </div>
              <button onclick="handleBulkAdd()" class="btn btn-outline-ac btn-block">استيراد جميع السطور</button>
            </div>
          </div>

          <div class="surface" style="padding:20px;">
            <h3 style="margin:0 0 4px;">💾 النسخ الاحتياطي واستعادة البيانات (JSON)</h3>
            <p class="muted" style="margin:0 0 14px;font-size:0.84rem;">احفظ بطاقاتك ومستواك وأوسمتك وثيماتك ومفضلتك على جهازك أو انقلها لمتصفح آخر</p>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <button onclick="exportBackupJSON()" class="btn btn-primary btn-sm">⬇️ تنزيل JSON</button>
              <button onclick="copyBackupJSON()" class="btn btn-ghost btn-sm">📋 نسخ JSON</button>
              <label class="btn btn-outline-ac btn-sm" style="cursor:pointer;">
                ⬆️ استيراد ملف JSON
                <input type="file" accept=".json,application/json" onchange="importBackupFile(event)" style="display:none;">
              </label>
              <button onclick="openPasteImportModal()" class="btn btn-ghost btn-sm">📥 لصق JSON</button>
            </div>
          </div>

          <div class="surface" style="padding:20px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
              <h3 style="margin:0;">🗂️ بطاقاتي في المراجعة (${state.cards.length})</h3>
              ${state.cards.length ? `
                <input id="st-search" type="text" value="${esc(studioSearch)}" oninput="onStudioSearch(this.value)"
                  placeholder="ابحث في بطاقاتك..." style="max-width:240px;padding:7px 12px;font-size:0.85rem;">
              ` : ""}
            </div>

            ${!filtered.length ? `
              <p class="muted text-center" style="padding:22px 0;margin:0;">
                ${state.cards.length === 0 ? "لا توجد بطاقات بعد. أضف بطاقاتك من الأعلى أو من الموسوعة!" : "لا توجد بطاقة مطابقة للبحث."}
              </p>
            ` : `
              <div style="max-height:420px;overflow-y:auto;">
                ${filtered.slice().reverse().map(c => {
                  const cat = CATS[c.cat] || CATS.o;
                  const diff = c.due - todayNum();
                  const dueTxt = diff <= 0 ? "مستحقة اليوم" : `بعد ${diff} يوم`;
                  return `
                    <div class="srs-list-item">
                      <div style="min-width:0;flex:1;">
                        <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.q)}</div>
                        <small class="kufi muted">${cat.icon} ${cat.short} · ${dueTxt} · مرحلة ${c.box + 1}/5</small>
                      </div>
                      <button onclick="deleteCard(${c.id})" class="icon-btn text-bad" title="حذف البطاقة" aria-label="حذف">✕</button>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function onStudioSearch(v) {
      studioSearch = v;
      renderView(false);
      const inp = document.getElementById("st-search");
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }

    function handleSingleAdd() {
      const cat = document.getElementById("st-cat").value;
      const q = document.getElementById("st-q").value.trim();
      const a = document.getElementById("st-a").value.trim();
      if (!q || !a) {
        showToast("يرجى إدخال السؤال والإجابة معاً");
        return;
      }
      const normQ = normalizeArabic(q);
      if (state.cards.some(c => normalizeArabic(c.q) === normQ)) {
        showToast("⚠️ هذه البطاقة موجودة بالفعل في حقيبتك");
        return;
      }
      addCardToSRS(cat, q, a, 0, 0);
      advanceQuest("srs_review", 1);
      const res = awardXP(10, "إنشاء بطاقة مراجعة شخصية جديدة", { icon: "✍️" });
      saveState();
      updateHeader();
      renderNav();
      renderView(false);
      showToast(`✅ تمت إضافة البطاقة (${formatXpGainText(res)})`);
    }

    function handleBulkAdd() {
      const lines = document.getElementById("st-bulk").value.split("\n");
      const existing = new Set(state.cards.map(c => normalizeArabic(c.q)));
      let n = 0;
      let skipped = 0;
      lines.forEach(l => {
        const p = l.split("|");
        if (p.length >= 2 && p[0].trim() && p[1].trim()) {
          const qText = p[0].trim();
          const aText = p.slice(1).join("|").trim();
          const normQ = normalizeArabic(qText);
          if (existing.has(normQ)) {
            skipped++;
            return;
          }
          existing.add(normQ);
          addCardToSRS("o", qText, aText, 0, 0);
          n++;
        }
      });
      if (!n) {
        showToast(skipped > 0 ? "جميع البطاقات المدخلة موجودة بالفعل" : "تأكد من الصيغة: السؤال | الإجابة في كل سطر");
        return;
      }
      advanceQuest("srs_review", n);
      const res = awardXP(Math.min(n * 5, 100), `استيراد ${n} بطاقة جديدة إلى حقيبتي`, { icon: "⚡" });
      saveState();
      updateHeader();
      renderNav();
      renderView(false);
      showToast(`✨ تمت إضافة ${n} بطاقات (${formatXpGainText(res)})${skipped ? ` · تم تخطي ${skipped} مكررة` : ""}`);
    }

    function deleteCard(id) {
      state.cards = state.cards.filter(c => c.id !== id);
      saveState();
      renderNav();
      renderView(false);
      showToast("تم حذف البطاقة");
    }

    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `mishkat-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("⬇️ تم تنزيل ملف النسخة الاحتياطية!");
      } catch (e) {
        copyBackupJSON();
      }
    }

    function copyBackupJSON() {
      copyToClipboard(JSON.stringify(state), "📋 تم نسخ النسخة الاحتياطية (JSON)!");
    }

    function applyImportedJSON(text) {
      try {
        const obj = JSON.parse(text);
        if (!obj || typeof obj !== "object" || !Array.isArray(obj.cards)) {
          throw new Error("ملف غير صالح");
        }
        state = Object.assign({}, state, obj);
        if (!state.sheetId) state.sheetId = DEFAULT_SHEET_ID;
        if (!Array.isArray(state.rewardedFavorites)) state.rewardedFavorites = (state.favorites || []).slice();
        if (!Array.isArray(state.unlockedBadges)) state.unlockedBadges = [];
        if (!Array.isArray(state.activityLog)) state.activityLog = [];
        if (!SKINS.some(s => s.id === state.skin)) state.skin = "emerald";
        if (!AVATARS.some(a => a.id === state.avatarId)) state.avatarId = "lamp";
        saveState();
        applyTheme();
        rebuildAllFacts();
        ensureDailyQuests();
        updateHeader();
        updateSheetHud();
        renderNav();
        renderView(false);
        closeModal();
        showToast(`✅ تمت استعادة ${state.cards.length} بطاقة ومستواك بنجاح!`);
      } catch (e) {
        showToast("⚠️ صيغة JSON غير صحيحة");
      }
    }

    function importBackupFile(ev) {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => applyImportedJSON(r.result);
      r.onerror = () => showToast("تعذّرت قراءة الملف");
      r.readAsText(f);
    }

    function openPasteImportModal() {
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="surface modal-box">
            <button onclick="closeModal()" class="modal-close" aria-label="إغلاق">✕</button>
            <h3 style="margin:0 0 10px;">📥 استيراد نسخة احتياطية بلصق JSON</h3>
            <textarea id="paste-json" rows="6" dir="ltr" placeholder='{"cards":[...]}' style="margin-bottom:14px;font-family:monospace;font-size:0.82rem;"></textarea>
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button onclick="closeModal()" class="btn btn-ghost btn-sm">إلغاء</button>
              <button onclick="applyImportedJSON(document.getElementById('paste-json').value)" class="btn btn-primary btn-sm">استعادة الآن</button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 15. التبويب 7: ملفي وإنجازاتي (المستويات، المهام اليومية، المتجر، الأوسمة، السجل)
    // =========================================================================
    function formatActivityTime(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("ar", {
          month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
      } catch (e) {
        return "";
      }
    }

    function viewProfile() {
      const info = getLevelInfo(state.xp);
      const st = getStreak();
      const bestSt = Math.max(st, state.bestStreak || 0);
      const mult = getStreakMultiplier();
      const avObj = AVATARS.find(a => a.id === state.avatarId) || AVATARS[0];
      const nextRank = RANKS.find(r => r.minLvl > info.level);
      const mastered = state.cards.filter(c => c.box >= 3).length;
      const qs = getQuestsSummary();
      const badges = getAchievementsList();
      const unlockedCount = badges.filter(b => b.on).length;

      return `
        <div class="medium-wrap" style="display:flex;flex-direction:column;gap:16px;">

          <!-- 1. بطاقة الملف الشخصي والمستوى التصاعدي -->
          <div class="surface" style="padding:22px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:18px;">
              <div class="avatar-ring lg ${info.rank.cls}" style="--rank-color:${info.rank.color};--rank-glow:${info.rank.glow};">
                <div class="avatar-inner">${avObj.icon}</div>
                <span class="lvl-pill">Lv.${info.level}</span>
              </div>

              <div style="flex:1 1 240px;min-width:0;">
                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;">
                  <h2 style="margin:0;font-size:1.45rem;">${esc(state.userName)}</h2>
                  <span class="rank-tag" style="--rank-color:${info.rank.color};">${info.rank.icon} ${info.rank.name}</span>
                  ${mult.bonusPct > 0 ? `<span class="mult-tag">⚡ مضاعف السلسلة ${mult.label}</span>` : ""}
                </div>
                <p class="muted" style="margin:0 0 10px;font-size:0.86rem;">
                  ${nextRank
                    ? `الرتبة القادمة: <b style="color:${nextRank.color};">${nextRank.icon} ${nextRank.name}</b> عند المستوى <b>${nextRank.minLvl}</b>`

          <!-- 2. لوحة الإحصائيات (Stats Dashboard) -->

            <div class="stats-grid" style="margin-bottom:0;">

              <div class="surface stat-box">

              </span>

          </div>

          <!-- 4. متجر المكافآت وفتح الميزات (Unlockables: Skins & Avatars) -->

            <h3 style="margin:0 0 4px;font-size:1.15rem;">🎨 متجر المكافآت والتخصيص (تُفتح تلقائياً بارتفاع مستواك)</h3>

            <h4 class="kufi" style="margin:0 0 10px;font-size:0.95rem;">🌈 ثيمات الألوان (${SKINS.filter(s => info.level >= s.reqLvl).length}/${SKINS.length} مفتوحة)</h4>
            <div class="skins-grid" style="margin-bottom:20px;">
              ${SKINS.map(s => {
                const unlocked = info.level >= s.reqLvl;

                return `
                  <button onclick="equipSkin('${s.id}')" class="skin-card ${active ? "active" : ""} ${!unlocked ? "locked" : ""}">

            </div>

            <h4 class="kufi" style="margin:0 0 10px;font-size:0.95rem;">🎭 الأيقونات الشخصية الحصرية (${AVATARS.filter(a => info.level >= a.reqLvl).length}/${AVATARS.length} مفتوحة)</h4>
            <div class="avatars-grid">
              ${AVATARS.map(a => {
                const unlocked = info.level >= a.reqLvl;
                const active = state.avatarId === a.id;
                return `
                  <button onclick="equipAvatar('${a.id}')" class="avatar-opt ${active ? "active" : ""} ${!unlocked ? "locked" : ""}">
                    <span style="font-size:1.75rem;line-height:1.1;">${a.icon}</span>
                    <b class="kufi" style="font-size:0.78rem;">${a.name}</b>
                    <small class="kufi ${active ? "text-ac" : "muted"}" style="font-size:0.7rem;">
                      ${active ? "✓ مُختار" : (unlocked ? "مفتوح" : `🔒 Lv.${a.reqLvl}`)}
                    </small>
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- 5. الأوسمة والإنجازات الكاملة (16 وساماً) -->
          <div class="surface" style="padding:20px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
              <h3 style="margin:0;font-size:1.15rem;">🏅 الأوسمة والإنجازات</h3>
              <span class="kufi text-ac" style="font-size:0.86rem;">${unlockedCount} / ${badges.length} مفتوحة</span>

            <div class="badges-grid">

          <!-- 6. سجل النشاط الأخير (Activity Log) -->
          <div class="surface" style="padding:20px;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;">
              <h3 style="margin:0;font-size:1.15rem;">📜 سجل النشاط والنقاط الأخيرة</h3>
              ${state.activityLog.length ? `<button onclick="clearActivityLog()" class="btn btn-ghost btn-sm">مسح السجل</button>` : ""}
            </div>
            ${!state.activityLog.length ? `
              <p class="muted text-center" style="margin:0;padding:18px 0;">
                لم تُسجَّل أنشطة بعد — ابدأ بتصفح الموسوعة أو قلب بطاقات اليوم أو خوض التحدي!
              </p>
            ` : `
              <div style="max-height:360px;overflow-y:auto;">
                ${state.activityLog.map(item => `
                  <div class="activity-item">
                    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
                      <span style="font-size:1.25rem;flex-shrink:0;">${item.icon || "⭐"}</span>
                      <div style="min-width:0;">
                        <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.reason)}</div>
                        <small class="kufi muted" style="font-size:0.75rem;">${formatActivityTime(item.ts)}</small>
                      </div>
                    </div>
                    <div style="flex-shrink:0;text-align:left;" class="kufi">
                      <b class="text-gold">+${item.total} XP</b>
                      ${item.bonus > 0 ? `<small class="text-ac" style="display:block;font-size:0.72rem;">+${item.bonus} 🔥</small>` : ""}
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>

        </div>
      `;
    }

    // =========================================================================
    // 16. مؤثر الاحتفال البصري (Canvas Confetti — boom بدون مسح الجزيئات النشطة)
    // =========================================================================
    let confettiParticles = [];
    let confettiRunning = false;
    const CONF_COLORS = ["#8fd0a9", "#ebc87e", "#87d2f8", "#f8abc3", "#cabcf9", "#ffffff"];

    function boom(x, y, n) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      let cv = document.getElementById("confetti-cv");
      if (!cv) {
        cv = document.createElement("canvas");
        cv.id = "confetti-cv";
        cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120;";
        document.body.appendChild(cv);
      }
      if (cv.width !== window.innerWidth || cv.height !== window.innerHeight) {
        cv.width = window.innerWidth;
        cv.height = window.innerHeight;
      }
      const cx = x || cv.width / 2;
      const cy = y || cv.height / 2;

      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 3 + Math.random() * 7.5;
        confettiParticles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 4,
          r: 3.5 + Math.random() * 4,
          c: CONF_COLORS[i % CONF_COLORS.length],
          l: 1,
          rot: Math.random() * 6
        });
      }
      if (!confettiRunning) {
        confettiRunning = true;
        tickBoom();
      }
    }

    function tickBoom() {
      const cv = document.getElementById("confetti-cv");
      if (!cv) return;
      const g = cv.getContext("2d");
      g.clearRect(0, 0, cv.width, cv.height);
      confettiParticles = confettiParticles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.vx *= 0.99;
        p.l -= 0.012;
        p.rot += 0.12;
        if (p.l <= 0) return false;
        g.save();
        g.globalAlpha = p.l;
        g.fillStyle = p.c;
        g.translate(p.x, p.y);
        g.rotate(p.rot);
        g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        g.restore();
        return true;
      });
      if (confettiParticles.length) {
        requestAnimationFrame(tickBoom);
      } else {
        confettiRunning = false;
        g.clearRect(0, 0, cv.width, cv.height);
      }
    }

    // إغلاق النوافذ المنبثقة بزر Escape
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeLevelUpModal();
        closeModal();
      }
    });

    // =========================================================================
    // 17. التشغيل التلقائي عند تحميل الصفحة + الحضور اليومي + مزامنة Google Sheets
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      applyTheme();
      rebuildAllFacts();
      ensureDailyQuests();
      checkNewAchievements(true);
      performDailyCheckIn();

      spotlightIdx = ALL_FACTS.some(f => f.fromSheet) ? 0 : Math.floor(Math.random() * ALL_FACTS.length);
      buildDailySession(false);
      updateHeader();
      updateSheetHud();
      renderNav();
      renderView(true);

      // مزامنة تلقائية مع جدول Google Sheets (مع عمل الـ 1,000 معلومة فوراً حتى دون إنترنت)
      syncGoogleSheet({ manual: false });
    });
  </script>
