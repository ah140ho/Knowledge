      ["l", "من مؤلف الموسوعة الأدبية والتاريخية الضخمة «كتاب الأغاني»؟", "أبو الفرج الأصفهاني في القرن الرابع الهجري، ووثّق فيه تراجم الشعراء والمغنين وأخبارهم في أكثر من عشرين مجلداً."],
      ["l", "ما هو شعر «الهايكو» الياباني؟", "شكل شعري شديد الإيجاز يتألف من ثلاثة أسطر تتبع نمط 5 ثم 7 ثم 5 مقاطع صوتية، ويلتقط لحظة طبيعية أو شعورية عابرة."],
      ["l", "من مؤلف رواية «المسخ» (التحول) التي يستيقظ فيها البطل وقد تحوّل إلى حشرة عملاقة؟", "الكاتب التشيكي الألماني اللغة فرانس كافكا، وتُعد من أبرز رموز الأدب الوجودي والعبثي."],
      ["l", "من هو العالِم الذي ألّف «الكتاب»، أول وأعظم مرجع شامل في علم النحو العربي؟", "سيبويه (أبو بشر عمرو بن عثمان)، وهو تلميذ الخليل بن أحمد الفراهيدي."],
      ["l", "ما هو أشهر كتاب عالمي للأديب اللبناني جبران خليل جبران؟", "كتاب «النبي» الصادر عام 1923م، وقد تُرجم إلى أكثر من مئة لغة وتناول فيه قضايا الحب والعمل والحرية بلغة شاعرية."],
      ["l", "ما هو العمل الأدبي الذي يُعد على نطاق واسع أول رواية نفسية طويلة في تاريخ الأدب العالمي؟", "«قصة غينجي» التي كتبتها الأديبة اليابانية موراساكي شيكيبو نحو عام 1008م، وصوّرت فيها حياة البلاط الإمبراطوري ومشاعر الشخصيات ببراعة سبقت الرواية الأوروبية بقرون."],
      ["l", "من هو الأديب العباسي الذي لُقّب بـ«فيلسوف الأدباء وأديب الفلاسفة» وألّف كتاب «الإمتاع والمؤانسة»؟", "أبو حيان التوحيدي، الذي برع في النثر الفلسفي العميق وأحرق كتبه في أواخر حياته حزناً على قلة التقدير لولا أن نجا الكثير منها لدى تلاميذه."],
      ["l", "ما هي «سينية البحتري» الشهيرة في تاريخ الشعر العربي؟", "قصيدة عصماء على قافية السين نظمها الشاعر العباسي البحتري في وصف إيوان كسرى بالمدائن قرب بغداد، وتُعد ذروة شعر الوصف والتأمل في مصير الحضارات."],
      ["l", "ما هي «حماسة أبي تمام» ولماذا نالت شهرة تفوق أحياناً شعره الشخصي؟", "مختارات شعرية منتقاة بذوق نقدي فذّ جمع فيها أبو تمام روائع الشعر العربي القديم في الشجاعة والمروءة والحكمة، حتى قيل «أبو تمام في اختياره أشعر منه في شعره»."],
      ["l", "من هو الشاعر الفارس الجاهلي الذي جمعت معلقته بين الفخر بالشجاعة والغزل العفيف في عبلة؟", "عنترة بن شداد العبسي، الذي انتزع حريته واعتراف قبيلته بسيفه وبيانه، وشكّلت سيرته لاحقاً إحدى أضخم الملاحم الشعبية العربية."],
      ["l", "ما هي «نظرية جبل الجليد» التي ابتكرها الروائي إرنست همنغواي في الكتابة الأدبية؟", "أسلوب سردي يعتمد على الإيجاز وحذف التفاصيل الزائدة بحيث يظهر للقارئ ثُمن المعنى فقط على السطح بينما يبقى العمق العاطفي والدرامي مستتراً تحت السطور، كما في «الشيخ والبحر»."],
      ["l", "من هو مؤلف الرواية الديستوبية الشهيرة «1984» التي أدخلت مصطلح «الأخ الأكبر» للثقافة العالمية؟", "الكاتب البريطاني جورج أورويل، الذي حذّر في روايته من الأنظمة الشمولية والمراقبة المطلقة وتزييف اللغة والتاريخ للسيطرة على العقول."],
      ["l", "من هو الروائي السوداني الذي كتب «موسم الهجرة إلى الشمال» المصنفة ضمن أهم الروايات العربية في القرن العشرين؟", "الطيب صالح، وقد عالج فيها ببراعة صراع الهوية والعلاقة المعقدة بين الشرق والغرب بعد الحقبة الاستعمارية."],
      ["l", "من هو الأديب المصري الذي أسس المسرح الذهني في الأدب العربي وكتب مسرحية «أهل الكهف»؟", "توفيق الحكيم، الذي حوّل النصوص المسرحية إلى فضاء للقراءة الفلسفية والاجتماعية وكتب أيضاً رواية «عودة الروح» و«يوميات نائب في الأرياف»."],
      ["l", "ما هي الملحمة الشعرية الروحية الأشهر التي نظمها الشاعر الصوفي جلال الدين الرومي؟", "«المثنوي المعنوي»، ويتألف من نحو 25 ألف بيت شعري مليء بالحكايات الرمزية والتأملات الإنسانية في المحبة ومعرفة الذات."],
      ["l", "ما هو «الديوان الشرقي للمؤلف الغربي» ومن مؤلفه؟", "مجموعة شعرية شهيرة كتبها عملاق الأدب الألماني يوهان فولفغانغ غوته تأثراً بالشعر الفارسي والعربي وبخاصة الشاعر حافظ الشيرازي، ودعا فيها للحوار الحضاري بين الشرق والغرب."],
      ["l", "من هو الشاعر العراقي الكبير صاحب البيت الشهير «هي الأخلاق تنبت كالنبات» ومن أبرز رواد الشعر الاجتماعي؟", "معروف الرصافي، الذي وظّف شعره الجزل في الدفاع عن التعليم وحقوق المرأة ونقد الفساد والتخلف الاجتماعي مطلع القرن العشرين."],
      ["l", "ما هي القيمة الأدبية والبلاغية لكتاب «نهج البلاغة» الذي جمعه الشريف الرضي؟", "يُعد من أرفع نماذج الفصاحة والبيان في النثر العربي الكلاسيكي، بما يضمه من خطب ورسائل وحكم موجزة ذات إيقاع لغوي وفكري فريد."],
      ["l", "ما الهدف الخفي وراء رواية «رحلات غوليفر» للكاتب الأيرلندي جوناثان سويفت؟", "رغم اشتهارها كقصة مغامرات للأطفال، إلا أنها في الأصل هجاء سياسي وفلسفي لاذع يسخر من غرور البشر والحروب التافهة وفساد السياسيين في عصره."],
      ["l", "ما الفرق بين «السجع» و«القافية» في فنون القول العربية؟", "السجع هو توافق فواصل الجمل في النثر على الحرف الأخير لإضفاء جرس موسيقي، بينما القافية تختص بنهايات الأبيات الموزونة في الشعر."],
      ["l", "كيف أثّر الشاعر السوري نزار قباني في ذائقة الشعر العربي الحديث؟", "قرّب لغة الشعر من الحياة اليومية بأسلوب رشيق وبسيط أطلق عليه النقاد «اللغة الثالثة»، وكرّس أعماله للحب والمرأة والنقد السياسي اللاذع."],
      ["l", "ما المقصود بـ«التطور الدلالي» في علم اللغة؟", "تغيّر معنى الكلمات عبر الزمن بالتوسيع أو التخصيص أو الانتقال المجازي؛ فكلمة «سيارة» مثلاً كانت تعني في العربية القديمة القافلة المسافرة قبل أن تُخصص للمركبة الحديثة."],
      ["l", "ما هي «المعلقات» في الشعر العربي؟", "أشهر وأجود قصائد الشعر الجاهلي الطوال؛ من شعرائها امرؤ القيس وعنترة وزهير بن أبي سلمى وطرفة بن العبد."],
      ["l", "من هو أبو الطيب المتنبي؟", "شاعر عربي عبقري (915–965م) امتاز شعره بالحكمة والفخر وجزالة اللفظ حتى صارت أبياته أمثالاً سائرة عبر العصور."],
      ["l", "من هو الجاحظ وما أبرز مؤلفاته؟", "عميد النثر العباسي (776–868م)؛ جمع بين التحليل العلمي والفكاهة في «البيان والتبيين» و«الحيوان» و«البخلاء»."],
      ["l", "ما هي حكايات «ألف ليلة وليلة»؟", "مجموعة قصصية شرقية خالدة ترويها شهرزاد للملك شهريار وتضم السندباد وعلاء الدين، وألهمت الأدب العالمي قروناً."],
      ["l", "من هو الخليل بن أحمد الفراهيدي؟", "عالم لغوي عبقري من البصرة وضع «علم العروض» لضبط أوزان الشعر العربي، وألّف «كتاب العين» كأول معجم عربي."],
      ["l", "من هو سيبويه وما كتابه الأشهر؟", "إمام النحاة العرب وتلميذ الخليل؛ ألّف أعظم مرجع في النحو العربي واشتهر تقديراً لمكانته باسم «الكتاب»."],
      ["l", "من أول أديب عربي فاز بجائزة نوبل في الأدب؟", "الروائي المصري نجيب محفوظ عام 1988م عن مجمل أعماله كـ«الثلاثية» و«زقاق المدق» و«أولاد حارتنا»."],
      ["l", "من هو جبران خليل جبران وما كتابه العالمي الأشهر؟", "أديب وفنان لبناني من رواد المهجر؛ يُعد كتابه «النبي» من أكثر الكتب ترجمةً وانتشاراً في العالم."],
      ["l", "ما دور بدر شاكر السياب في الشعر الحديث؟", "شاعر عراقي رائد أسهم مع نازك الملائكة في تأسيس «شعر التفعيلة» (الشعر الحر)، ومن أشهر قصائده «أنشودة المطر»."],
      ["l", "ما كتاب «كليلة ودمنة» ومن نقله للعربية؟", "كتاب حِكم وأمثال سياسية وأخلاقية على ألسنة الحيوانات، ترجمه ابن المقفع بأسلوب عربي بليغ فأصبح من روائع النثر."],
      ["l", "من هو ويليام شكسبير؟", "شاعر وكاتب مسرحي إنجليزي (1564–1616) خلّد مآسي وكوميديات عالمية مثل «هاملت» و«ماكبث» و«روميو وجولييت»."],
      ["l", "بماذا اشتهر الروائي الروسي دوستويفسكي؟", "رائد الرواية النفسية والفلسفية؛ سبر صراعات الضمير والذنب والحرية في «الجريمة والعقاب» و«الإخوة كارامازوف»."],
      ["l", "ما هي «الواقعية السحرية» ومن أبرز روادها؟", "أسلوب أدبي يمزج الواقع اليومي بالخيال والأسطورة، وبلغ ذروته في «مئة عام من العزلة» لغابرييل غارسيا ماركيز."],
      ["l", "لماذا تُسمّى اللغة العربية «لغة الضاد»؟", "لأن صوت حرف الضاد بصفته الفصيحة القديمة كان يُعد فريداً في مخارجه بين اللغات الإنسانية المعروفة آنذاك."],
      ["l", "ما هو فن «المقامات» في الأدب العربي؟", "قصص قصيرة مصوغة بنثر مسجوع رفيع تجمع بين الطرافة والبلاغة، ابتكرها بديع الزمان الهمذاني وطورها الحريري."],
      ["l", "من هو «عميد الأدب العربي» وما سيرته الذاتية الأشهر؟", "الأديب المصري طه حسين الذي تحدى فقدان البصر ليقود نهضة التعليم والنقد، وخلّد طفولته في كتابه «الأيام»."],
      ["l", "ما أقدم ملحمة أدبية مكتوبة في تاريخ البشرية؟", "«ملحمة جلجامش» التي دُوّنت بالمسمارية في بلاد الرافدين قبل نحو 4,000 عام وتبحث في الصداقة والسعي للخلود."],
      ["l", "من هو أبو العلاء المعري؟", "شاعر وفيلسوف عربي عُرف بـ«رهين المحبسين»، ومن أبرز أعماله «اللزوميات» و«رسالة الغفران»."],
      ["l", "من مؤلف «الكوميديا الإلهية»؟", "الشاعر الإيطالي دانتي أليغييري في القرن الرابع عشر، وكتبها بالإيطالية الدارجة فأسس للغة الإيطالية الحديثة."],
      ["l", "ما أشهر معجم لغوي تراثي شامل في العربية؟", "معجم «لسان العرب» لابن منظور، الذي جمع خلاصة خمسة معاجم كبرى وضم قرابة 80 ألف مادة لغوية."],
      ["l", "ما فروع علم البلاغة العربية الثلاثة؟", "علم المعاني (مطابقة الكلام لمقتضى الحال)، وعلم البيان (التشبيه والاستعارة والكناية)، وعلم البديع (المحسنات)."],
      ["l", "من هو الشاعر محمود درويش؟", "من أبرز شعراء العربية المعاصرين، ارتبط شعره بفلسطين والهوية والإنسانية بأسلوب جمالي وإيقاع عالمي."],
      ["l", "كم عدد جذور الكلمات التقريبي في العربية؟", "تضم العربية نحو 12 ألف جذر لغوي تولّد بالاشتقاق ملايين المفردات الدقيقة، مما يجعلها من أغنى لغات العالم."],
      ["l", "ما هو «المترادف» وما هو «المشترك اللفظي» في اللغة العربية؟", "المترادف هو دلالة عدة ألفاظ على معنى واحد (كالأسد والغضنفر)، أما المشترك اللفظي فلفظ واحد يحمل عدة معانٍ مختلفة (مثل كلمة «العين»)."],
      ["l", "ما هو «التصحيف» في التراث اللغوي والمخطوطات العربية؟", "خطأ في قراءة الكلمة أو نسخها بسبب تبدّل النقط على الحروف المتشابهة رسماً، مثل الخلط بين «حبر» و«خبر»."],
      ["l", "من هو الشاعر الجاهلي «طرفة بن العبد» وما أبرز سمة لمعلقته؟", "شاعر شاب قُتل في العشرينيات من عمره؛ تميّزت معلقته بالوعي الوجودي المبكر بالموت والزمن ووصف ناقته بدقة مذهلة."],
      ["l", "ما هو كتاب «الأمالي» ومن مؤلفه؟", "موسوعة أدبية ولغوية حافلة بالشعر والنوادر واللغة أملاها أبو علي القالي في قرطبة بالأندلس خلال القرن العاشر الميلادي."],
      ["l", "من هو الشاعر العباسي «أبو نواس» وبماذا جدّد في الشعر العربي؟", "شاعر فذّ تمرّد على الوقوف التقليدي على الأطلال، واشتُهر بخمرياته وطردياته وسلاسة لغته وتصويره الحياة الحضرية في بغداد."],
      ["l", "ما هي «الرواية متعددة الأصوات» (البوليفونية) في النقد الأدبي؟", "أسلوب روائي حلّله الناقد ميخائيل باختين لدى دوستويفسكي، حيث يمتلك كل بطل وعياً وصوتاً مستقلاً دون هيمنة صوت الراوي الواحد."],
      ["l", "ما هو «تيار الوعي» (Stream of Consciousness) في الأدب الحديث؟", "تقنية سردية تنقل تدفق أفكار الشخصية وذكرياتها وتداعياتها الداخلية مباشرةً، ومن أبرز روادها جيمس جويس وفرجينيا وولف."],
      ["l", "من هو مؤلف رواية «البحث عن الزمن المفقود»؟", "الأديب الفرنسي مارسيل بروست؛ عمل ضخم من سبعة أجزاء يتأمل الذاكرة والزمن والفن انطلاقاً من طعم قطعة كعك «مادلين»."],
      ["l", "ما هو «الممنوع من الصرف» في النحو العربي؟", "اسم لا يلحقه التنوين ويُجرّ بالفتحة نيابةً عن الكسرة ما لم يُعرّف بـ«ال» أو يُضَف، مثل «مساجد» و«عمر» و«صحراء»."],
      ["l", "من هو الشاعر العباسي «ابن الرومي» وما أبرز ميزاته الفنية؟", "شاعر بغدادي فائق الحساسية اشتُهر بدقة الوصف التصويري، والهجاء اللاذع، والتشاؤم الحاد، والقدرة على توليد المعاني وتقصّيها."],
      ["l", "ما هي «الرمزية» (Symbolism) في الشعر والأدب؟", "مدرسة أدبية تعتمد الإيحاء والرمز والموسيقى الخفية للتعبير عن المشاعر والأفكار العميقة بدلاً من التصريح المباشر."],
      ["l", "من هو الأديب الأندلسي «ابن زيدون» وما قصيدته الأشهر؟", "شاعر ووزير قرطبي اشتُهر بقصيدته «النونية» التي مطلعها «أضحى التنائي بديلاً من تدانينا» في حب ولّادة بنت المستكفي."],
      ["l", "ما هو «النحت اللغوي» في العربية؟", "توليد كلمة واحدة مختصرة من كلمتين أو جملة لكثرة الاستعمال، مثل «البسملة» من بسم الله، و«الحوقلة» من لا حول ولا قوة إلا بالله."],
      ["l", "من هو الشاعر الفارسي الذي ألّف ملحمة «الشاهنامة» (كتاب الملوك)؟", "أبو القاسم الفردوسي في القرن العاشر الميلادي؛ وتضم نحو ستين ألف بيت تروي أساطير وتاريخ ملوك فارس القدماء."],
      ["l", "ما هو «فن السيرة الذاتية» وأقدم نماذجه الشهيرة في التراث العربي؟", "سرد يكتبه الأديب عن حياته وتجربته؛ ومن أبرز نماذجه التراثية «المنقذ من الضلال» للغزالي و«الاعتبار» لأسامة بن منقذ."],
      ["l", "ما هي «الرسائل الإخوانية» في النثر العربي القديم؟", "مراسلات أدبية رفيعة تُكتب بين الأصدقاء والأدباء في التهنئة والتعزية والشوق والعتاب، وتُبرز براعة الأسلوب والعاطفة الصادقة."],
      ["l", "من هو «أحمد شوقي» ولماذا لُقّب بـ«أمير الشعراء»؟", "شاعر مصري رائد بويع بإمارة الشعر عام 1927م، واشتُهر بغزارة شعره الوطني والتاريخي وبإرساء المسرح الشعري العربي كـ«مجنون ليلى»."],
      ["l", "ما هو «التناصّ» (Intertextuality) في النقد الأدبي المعاصر؟", "تفاعل نص أدبي مع نصوص سابقة بالاقتباس أو التلميح أو إعادة التوظيف، مما يثري دلالته ويصله بذاكرة القارئ الثقافية."],
      ["l", "ما الفرق بين «القصة القصيرة» و«الرواية» من حيث البناء الفني؟", "تركّز القصة القصيرة على لحظة مكثّفة أو حدث واحد بتركيز شديد، بينما تتسع الرواية لعوالم وشخصيات متعددة وامتداد زمني أرحب."],
      ["l", "من هو مؤلف مسرحية «أوديب ملكاً» في الأدب الإغريقي القديم؟", "الكاتب المسرحي سوفوكليس في القرن الخامس ق.م، وتُعد ذروة التراجيديا الكلاسيكية التي استشهد بها أرسطو في كتابه «فن الشعر»."],
      ["l", "ما هو «الالتفات» في علم البلاغة العربية؟", "الانتقال المفاجئ في الكلام من ضمير إلى آخر (مثل التحول من الغائب إلى المخاطب) لشدّ انتباه السامع وإضفاء حيوية على التعبير."],
      ["l", "من هو الشاعر السوداني «محمد الفيتوري» وبماذا عُرف شعره؟", "شاعر بارز عُرف بشعره الإنساني العميق المناهض للعنصرية والاستعمار وتغنّيه بالهوية الإفريقية والعربية كما في «أغاني إفريقيا»."],
      ["l", "ما هو كتاب «الحيوان» للجاحظ من الناحية الأدبية والعلمية؟", "موسوعة عربية فريدة من سبعة أجزاء تمزج بين ملاحظات عن سلوك الحيوانات والبيئة وبين الشعر والنوادر والجدل الفكري."],
      ["l", "من هي الكاتبة الإنجليزية التي ألّفت رواية «كبرياء وتحامل»؟", "جين أوستن عام 1813م؛ رواية ساخرة وذكية تنتقد التقاليد الطبقية والزواج القائم على المصلحة في المجتمع الإنجليزي."],
      ["l", "ما هي «اللغات السامية» وما مكانة العربية فيها؟", "عائلة لغوية عريقة تشمل العربية والآرامية والأكادية والعبرية والأمهرية؛ وتُعد العربية أكثرها احتفاظاً بالخصائص الصوتية والنحوية القديمة."],
      ["l", "من هو الأديب المغربي «محمد شكري» وما أشهر أعماله؟", "كاتب مغربي بارز اشتُهر بروايته السيرية «الخبز الحافي» التي تُرجمت إلى عشرات اللغات وصوّرت بجرأة قسوة الفقر والطفولة."],
      ["l", "ما المقصود بـ«الشعر التعليمي» في التراث العربي؟", "نظم العلوم والقواعد في أبيات شعرية سهلة الحفظ مثل «ألفية ابن مالك» في النحو العربي التي تضم ألف بيت."],
      ["l", "من هو الروائي التشيكي-الفرنسي «ميلان كونديرا» وما أشهر رواياته؟", "كاتب بارز اشتُهر برواية «كائن لا تُحتمل خفته» التي تمزج السرد الروائي بالتأمل الفلسفي والسياسي."],
      ["l", "ما هو «علم الأصوات» (الفوناتكس) في اللسانيات؟", "فرع علم اللغة الذي يدرس مخارج الحروف وصفاتها الفيزيائية وكيفية إنتاج الأصوات البشرية وإدراكها سمعياً."],
      ["l", "من هو الشاعر الجاهلي «زهير بن أبي سلمى» وبماذا اشتُهرت قصائده؟", "أحد أصحاب المعلقات وشاعر الحكمة والسلام، عُرف بـ«الحوليات» لأنه كان ينقّح قصيدته عاماً كاملاً قبل أن يذيعها بين الناس."],
      // ===================== [g] جغرافيا وعجائب (115 معلومة) =====================
      ["g", "ما هي أكبر دولة في العالم من حيث المساحة؟", "روسيا، وتمتد عبر قارتي أوروبا وآسيا بمساحة تتجاوز 17 مليون كيلومتر مربع و11 منطقة زمنية."],
      ["g", "ما هي أصغر دولة مستقلة في العالم من حيث المساحة والسكان؟", "دولة الفاتيكان، وتقع داخل مدينة روما الإيطالية بمساحة تقارب نصف كيلومتر مربع."],
      ["g", "ما هي أعلى قمة جبلية في العالم فوق مستوى سطح البحر؟", "قمة إيفرست في سلسلة جبال الهيمالايا على الحدود بين نيبال والصين، ويبلغ ارتفاعها نحو 8848.86 متراً."],
      ["g", "ما هي أكبر جزيرة في العالم غير قارة أستراليا؟", "جزيرة غرينلاند، وتغطي الصفائح الجليدية نحو 80% من مساحتها الإجمالية."],
      ["g", "أين تقع شلالات أنجل، وهي أعلى شلالات غير منقطعة في العالم؟", "في فنزويلا بأمريكا الجنوبية، ويبلغ ارتفاع سقوط المياه فيها نحو 979 متراً."],
      ["g", "ما هي أعمق بحيرة للمياه العذبة في العالم؟", "بحيرة بايكال في سيبيريا بروسيا، ويصل عمقها إلى 1642 متراً وتحتوي على نحو خُمس المياه العذبة السطحية غير المتجمدة في العالم."],
      ["g", "ما هو المضيق الذي يفصل بين آسيا وأمريكا الشمالية؟", "مضيق بيرينغ، ويبلغ أضيق عرض له نحو 85 كيلومتراً بين روسيا وولاية ألاسكا الأمريكية."],
      ["g", "ما هي الدولة العربية الأكبر مساحة في العالم؟", "الجزائر، وتبلغ مساحتها نحو 2.38 مليون كيلومتر مربع، وهي أيضاً أكبر دولة في قارة إفريقيا."],
      ["g", "أين يلتقي نهرا دجلة والفرات لتكوين شط العرب؟", "في منطقة القرنة بمحافظة البصرة جنوب العراق، ثم يصب شط العرب في الخليج العربي."],
      ["g", "ما هي القارة التي تضم أكبر عدد من الدول المستقلة؟", "قارة إفريقيا، إذ تضم 54 دولة معترفاً بها دولياً."],
      ["g", "ما هي الصحراء الأوسع مساحة بين الصحاري الحارة في العالم؟", "الصحراء الكبرى في شمال إفريقيا، وتمتد عبر 11 دولة بمساحة تفوق 9 ملايين كيلومتر مربع."],
      ["g", "ما هو أطول خط ساحلي لدولة في العالم؟", "ساحل كندا، ويبلغ طوله الإجمالي مع جزرها المتعددة أكثر من 202 ألف كيلومتر."],
      ["g", "ما هما الدولتان اللتان تشتركان في حدود برية مع أكبر عدد من الدول المجاورة؟", "الصين وروسيا، إذ تجاور كل منهما 14 دولة مختلفة على اليابسة."],
      ["g", "ما هو أكبر خليج في العالم؟", "خليج البنغال في شمال شرق المحيط الهندي، وتطل عليه الهند وبنغلاديش وميانمار وسريلانكا."],
      ["g", "ما هي أعلى هضبة في العالم وتُلقّب بـ«سقف العالم»؟", "هضبة التبت في آسيا الوسطى، ويزيد متوسط ارتفاعها على 4500 متر فوق مستوى سطح البحر."],
      ["g", "ما هو النهر الذي يمر بأكبر عدد من الدول في العالم؟", "نهر الدانوب في أوروبا، إذ يمر أو يشكل حدوداً لعشر دول مختلفة قبل أن يصب في البحر الأسود."],
      ["g", "أين تقع أهوار جنوب العراق المدرجة على قائمة التراث العالمي لليونسكو؟", "في محافظات ذي قار وميسان والبصرة، وتُعد من أكبر النظم البيئية للأراضي الرطبة في الشرق الأوسط."],
      ["g", "ما هي الدولة الوحيدة التي تمتد جغرافياً في جميع أنصاف الكرة الأرضية الأربعة؟", "جمهورية كيريباتي في المحيط الهادئ، إذ تتوزع جزرها على جانبي خط الاستواء وخط الطول 180."],
      ["g", "ما هي أطول سلسلة جبال على سطح اليابسة؟", "جبال الأنديز في أمريكا الجنوبية، وتمتد لمسافة تقارب 7000 كيلومتر على طول الساحل الغربي للقارة."],
      ["g", "ما هو البحر الوحيد في العالم الذي ليس له شواطئ برية وتحدّه التيارات المحيطية فقط؟", "بحر سارغاسو في شمال المحيط الأطلسي، ويشتهر بكثافة طحالب السارغاسوم الطافية على سطحه."],
      ["g", "ما هو أكبر وأعمق محيط على كوكب الأرض؟", "المحيط الهادئ، إذ يغطي نحو ثلث مساحة سطح الأرض ويزيد حجمه على مساحة اليابسة كلها مجتمعة."],
      ["g", "ما هي أعمق نقطة معروفة في محيطات العالم؟", "تشالنجر ديب في خندق ماريانا غرب المحيط الهادئ، ويبلغ عمقها قرابة 11 كيلومتراً تحت سطح البحر."],
      ["g", "ما هما الرافدان الرئيسيان اللذان يلتقيان في الخرطوم لتكوين نهر النيل؟", "النيل الأبيض القادم من منطقة البحيرات الكبرى، والنيل الأزرق القادم من هضبة إثيوبيا."],
      ["g", "ما هو أغزر نهر في العالم من حيث حجم تدفق المياه؟", "نهر الأمازون في أمريكا الجنوبية، إذ يصب في المحيط الأطلسي نحو خُمس إجمالي المياه العذبة النهرية في العالم."],
      ["g", "ما هي أخفض نقطة على سطح اليابسة تحت مستوى سطح البحر؟", "شواطئ البحر الميت بين الأردن وفلسطين، وتنخفض بأكثر من 430 متراً دون مستوى سطح البحر."],
      ["g", "بين أي مسطحين مائيين يقع مضيق هرمز؟", "يربط بين الخليج العربي غرباً وخليج عُمان والمحيط الهندي شرقاً، ويُعد من أهم الممرات الملاحية للطاقة في العالم."],
      ["g", "ما هما المسطحان المائيان اللذان يربط بينهما مضيق باب المندب؟", "يربط البحر الأحمر بخليج عدن والمحيط الهندي، ويفصل بين شبه الجزيرة العربية وقارة إفريقيا."],
      ["g", "ما أهمية قناة بنما في الملاحة الدولية؟", "تصل المحيط الأطلسي بالمحيط الهادئ عبر أمريكا الوسطى، وتوفر على السفن الإبحار حول الطرف الجنوبي لأمريكا الجنوبية."],
      ["g", "لماذا تُصنّف القارة القطبية الجنوبية (أنتاركتيكا) أكبر صحراء في العالم؟", "لأن تعريف الصحراء يعتمد على ندرة الهطول المطري وليس الحرارة، وهطولها السنوي ضئيل جداً رغم غطائها الجليدي الذي يختزن نحو 70% من مياه الأرض العذبة."],
      ["g", "ما هي أعلى قمة جبلية في قارة إفريقيا؟", "جبل كليمنجارو في تنزانيا بارتفاع 5895 متراً، وهو أيضاً أعلى جبل منفرد (غير مرتبط بسلسلة) في العالم."],
      ["g", "ما اسم المضيق الذي يقسم مدينة إسطنبول بين قارتي آسيا وأوروبا؟", "مضيق البوسفور، ويربط البحر الأسود ببحر مرمرة."],
      ["g", "ما هي أكبر دولة أرخبيلية (مكوّنة من جزر) في العالم؟", "إندونيسيا، وتضم أكثر من 17 ألف جزيرة تمتد على طول خط الاستواء بين المحيطين الهندي والهادئ."],
      ["g", "ما هي أكثر الصحاري غير القطبية جفافاً على وجه الأرض؟", "صحراء أتاكاما في شمال تشيلي، إذ لم تسجل بعض مناطقها هطول أمطار يذكر لقرون."],
      ["g", "ما هو «خط غرينتش» وما وظيفته الجغرافية؟", "خط الطول المرجعي (درجة صفر) الذي يمر بمرصد غرينتش في لندن، ويُعتمد أساساً لتقسيم المناطق الزمنية العالمية."],
      ["g", "ما هو أكبر مسطح مائي داخلي مغلق (بحيرة) في العالم؟", "بحر قزوين بين أوروبا وآسيا، ويُسمّى بحراً لضخامة مساحته وملوحة مياهه رغم عدم اتصاله بالمحيطات."],
      ["g", "أين يقع مضيق ملقا ولماذا يحظى بأهمية اقتصادية كبرى؟", "بين شبه جزيرة الملايو وجزيرة سومطرة الإندونيسية، ويمثل أقصر ممر بحري رئيسي للتجارة بين المحيطين الهندي والهادئ."],
      ["g", "ما هي أعلى قمة جبلية في العراق؟", "قمة شيخا دار (بارتفاع نحو 3611 متراً) تليها قمة هلكرد (نحو 3607 أمتار) ضمن سلسلة جبال زاغروس في إقليم كردستان العراق."],
      ["g", "ما هو أكبر نظام للشعاب المرجانية في العالم وأين يقع؟", "الحاجز المرجاني العظيم قبالة الساحل الشمالي الشرقي لأستراليا، ويمتد لأكثر من 2300 كيلومتر ويمكن رؤيته من الفضاء."],
      ["g", "ما هي الدول الثلاث الوحيدة في العالم المحاطة بالكامل بأراضي دولة واحدة فقط؟", "ليسوتو داخل جنوب إفريقيا، والفاتيكان وسان مارينو داخل إيطاليا."],
      ["g", "ما هو أعمق نهر في العالم؟", "نهر الكونغو في وسط إفريقيا، حيث يصل عمقه في بعض الأجزاء إلى أكثر من 220 متراً، وهو النهر الرئيسي الوحيد الذي يقطع خط الاستواء مرتين."],
      ["g", "لماذا تُعد جزيرة مدغشقر فريدة من نوعها بيئياً؟", "لانفصالها الجيولوجي المبكر عن إفريقيا والهند، ما أدى إلى تطور نحو 90% من نباتاتها وحيواناتها (مثل الليمور) بشكل لا يوجد في أي مكان آخر."],
      ["g", "ما هي أعلى قمة في سلسلة جبال الألب الأوروبية؟", "قمة «مونت بلانك» (الجبل الأبيض) على الحدود بين فرنسا وإيطاليا، ويبلغ ارتفاعها نحو 4808 أمتار."],
      ["g", "ما هو أصغر وأضحل محيط من محيطات العالم الخمسة؟", "المحيط المتجمد الشمالي، ويقع حول القطب الشمالي وتغطي الجليديات البحرية مساحات واسعة منه."],
      ["g", "بماذا تشتهر جزيرة سقطرى اليمنية الواقعة في المحيط الهندي؟", "بتنوعها الحيوي النادر وأشجارها الفريدة مثل شجرة «دم الأخوين» ذات الشكل المظلي المميز، وهي مدرجة ضمن التراث العالمي."],
      ["g", "ما المقصود بـ«حزام النار» (Ring of Fire) في الجغرافيا والجيولوجيا؟", "قوس جغرافي يحيط بحوض المحيط الهادئ تتركز فيه قرابة 75% من براكين العالم النشطة ونحو 90% من زلازله بسبب التقاء الصفائح التكتونية."],
      ["g", "ما هي «نقطة نيمو» (Point Nemo) في المحيط الهادئ؟", "أبعد نقطة بحرية عن أي يابسة على سطح الأرض (نحو 2688 كم من أقرب جزيرة)، لدرجة أن أقرب البشر إليها غالباً هم رواد محطة الفضاء الدولية عند مرورهم فوقها."],
      ["g", "ما الحقيقة الجغرافية اللافتة حول الجسور على نهر الأمازون؟", "لا يوجد أي جسر واحد يعبر المجرى الرئيسي لنهر الأمازون رغم طوله الذي يتجاوز 6400 كيلومتر، بسبب اتساعه الهائل وتغير ضفافه وتدفق مياهه خلال مواسم الفيضان."],
      ["g", "ما هو «سالار دي أويوني» في بوليفيا ولماذا يُلقّب بـ«مرآة السماء»؟", "أكبر مسطح ملحي في العالم بمساحة تفوق 10 آلاف كيلومتر مربع؛ وعندما تغطيه طبقة رقيقة من مياه الأمطار يتحول إلى مرآة طبيعية عملاقة تعكس السماء بدقة مذهلة."],
      ["g", "ما هي «بحيرة ناترون» في تنزانيا وما سر لونها الأحمر اللافت؟", "بحيرة شديدة القلوية والملوحة تزدهر فيها كائنات دقيقة حمراء اللون، وتؤدي أملاح كربونات الصوديوم فيها إلى تكلّس وتحنيط أجسام الطيور التي تنفق على ضفافها."],
      ["g", "لماذا تُعد قمة «جبل شيمبورازو» في الإكوادور أبعد نقطة على سطح الأرض عن مركزها رغم أن إيفرست أعلى من سطح البحر؟", "لأن الأرض ليست كرة تامة بل مفلطحة وتنتفخ عند خط الاستواء؛ ولوقوع شيمبورازو قرب الاستواء فإن قمته تبعد عن مركز الأرض أكثر من قمة إيفرست بنحو كيلومترين."],
      ["g", "ما هو «أخدود شرق إفريقيا العظيم» وما مستقبله الجيولوجي؟", "صدع تكتوني هائل يمتد لآلاف الكيلومترات حيث تتباعد الصفيحة الصومالية عن الصفيحة النوبية ببطء، ما قد يشطر شرق القارة الإفريقية ويكوّن محيطاً جديداً بعد ملايين السنين."],
      ["g", "ما هي أطول سلسلة جبلية في كوكب الأرض بأكمله (بما فيها قاع البحار)؟", "نظام «حيود منتصف المحيطات» (Mid-Ocean Ridge)، وهو سلسلة جبال بركانية مغمورة تحت الماء تمتد لمسافة تقارب 65 ألف كيلومتر حول الكوكب كدرزات كرة التنس."],
      ["g", "كيف يؤثر «تيار الخليج الدافئ» (Gulf Stream) في مناخ أوروبا؟", "ينقل كميات هائلة من المياه الدافئة من خليج المكسيك عبر الأطلسي نحو شمال غرب أوروبا، فيجعل شتاء بريطانيا والنرويج أدفأ بكثير من مناطق على خط العرض نفسه في كندا."],
      ["g", "ما هي ظاهرة «شمس منتصف الليل» وأين تحدث؟", "ظاهرة طبيعية تبقى فيها الشمس مرئية فوق الأفق طوال 24 ساعة في فصل الصيف داخل الدائرتين القطبيتين الشمالية والجنوبية نتيجة ميل محور دوران الأرض بمقدار 23.5 درجة."],
      ["g", "ما هي «الأنهار الطائرة» فوق حوض الأمازون في أمريكا الجنوبية؟", "تيارات ضخمة من بخار الماء تتصاعد من مليارات أشجار الغابات المطيرة وتنقلها الرياح عبر القارة، وتحمل كمية ماء تفوق تدفق نهر الأمازون نفسه لتسقي الأراضي الزراعية البعيدة."],
      ["g", "لماذا تُعد جزيرة «أيسلندا» مختبراً جيولوجياً فريداً على وجه الأرض؟", "لأنها تقع مباشرة فوق التقاء الصفيحتين التكتونيتين الأوراسية والأمريكية الشمالية، ما يمنحها براكين نشطة وينابيع حارة تغطي معظم احتياجاتها من الكهرباء والتدفئة بطاقة حرارية أرضية نظيفة."],
      ["g", "ما أصل التسمية العلمية المرجّحة لـ«البحر الأحمر»؟", "يرجّح الجغرافيون ارتباطها بالازدهار الموسمي لنوع من البكتيريا الزرقاء الطافية (تريكوديسميوم) تحوّل لون سطحه الأزرق أحياناً إلى البني المحمر، فضلاً عن تسميته التاريخية بلون الاتجاه الجنوبي."],
      ["g", "بماذا تتميّز «الصحراء البيضاء» في مصر عن غيرها من الصحاري؟", "بتشكيلاتها الصخرية الطباشيرية البيضاء النادرة التي نحتتها الرياح على هيئة فطر وأعمدة وتماثيل طبيعية فوق قاع بحر قديم جفّ منذ ملايين السنين."],
      ["g", "ما هي «شلالات فيكتوريا» الواقعة على نهر زامبيزي وما اسمها المحلي؟", "من أضخم شلالات العالم بعرض يتجاوز 1.7 كيلومتر بين زامبيا وزيمبابوي، ويسميها السكان المحليون «موسي أو تونيا» أي «الدخان الذي يرعد» لصوت هديرها ورذاذها المرئي من بعيد."],
      ["g", "لماذا يُعد اتجاه جريان نهر النيل غير مألوف مقارنةً بأغلب أنهار العالم الكبرى؟", "لأنه يتدفق من الجنوب إلى الشمال لمسافة تفوق 6650 كيلومتراً بفضل انحدار التضاريس الطبيعي من المرتفعات الإفريقية الاستوائية نحو البحر المتوسط."],
      ["g", "ما هي أهمية «جزر غالاباغوس» البركانية في المحيط الهادئ؟", "أرخبيل معزول تابع للإكوادور يضم أنواعاً متفردة كالسلاحف العملاقة والإغوانا البحرية، وكانت ملاحظات تشارلز داروين عليها الشرارة الأساسية لصياغة نظرية الانتقاء الطبيعي."],
      ["g", "ما هو مشروع «السور الأخضر العظيم» في قارة إفريقيا؟", "مبادرة بيئية قارية طموحة لاستعادة ملايين الهكتارات من الأراضي المتدهورة وزراعة حزام نباتي يمتد عبر منطقة الساحل من السنغال غرباً إلى جيبوتي شرقاً لمكافحة التصحر."],
      ["g", "ما أطول نهر وأغزر نهر في العالم؟", "نهر النيل في أفريقيا هو الأطول بنحو 6,650 كم، بينما نهر الأمازون في أمريكا الجنوبية هو الأغزر مياهاً والأكبر حوضاً."],
      ["g", "ما أعلى قمة جبلية فوق مستوى سطح البحر؟", "قمة إيفرست في جبال الهيمالايا بارتفاع 8,848.86 متراً، ولا تزال ترتفع بضعة مليمترات سنوياً."],
      ["g", "ما هي صحراء الربع الخالي؟", "أكبر صحراء رملية متصلة في العالم؛ تغطي الثلث الجنوبي من شبه الجزيرة العربية بمساحة تقارب 650 ألف كم²."],
      ["g", "لماذا تطفو الأجسام بسهولة في البحر الميت؟", "لأنه أخفض نقطة يابسة على الأرض (-430 م) وتبلغ ملوحته نحو 34%، ما يرفع كثافة مائه بشكل كبير."],
      ["g", "ما أعلى شلال متواصل في العالم؟", "شلالات «آنجل» في فنزويلا بارتفاع إجمالي يبلغ 979 متراً، حيث تتحول المياه إلى رذاذ قبل بلوغ القاع."],
      ["g", "ما هو الحاجز المرجاني العظيم؟", "أضخم منظومة حية من الشعاب المرجانية على الأرض؛ يمتد لأكثر من 2,300 كم قبالة ساحل أستراليا ويُرى من الفضاء."],
      ["g", "ما سبب ظاهرة الشفق القطبي (Aurora)؟", "تصادم الجسيمات المشحونة القادمة من الرياح الشمسية مع ذرات الأكسجين والنيتروجين في أعالي الغلاف الجوي قرب القطبين."],
      ["g", "ما أطول سلسلة جبلية قارية على اليابسة؟", "جبال الأنديز في غرب أمريكا الجنوبية، وتمتد لمسافة تتجاوز 7,000 كيلومتر عبر سبع دول."],
      ["g", "ما أهمية قناة السويس ومضيق هرمز؟", "تربط قناة السويس البحر المتوسط بالأحمر فتختصر التجارة العالمية، بينما يربط مضيق هرمز الخليج العربي ببحر العرب."],
      ["g", "ما أكبر صحراء على كوكب الأرض مساحةً؟", "القارة القطبية الجنوبية (أنتاركتيكا) كصحراء جليدية باردة بمساحة 14 مليون كم²، تليها الصحراء الكبرى كأكبر صحراء حارة."],
      ["g", "ما العجيبة الوحيدة الباقية من عجائب الدنيا السبع القديمة؟", "الهرم الأكبر في الجيزة بمصر، بينما اندثرت بقية العجائب القديمة كحدائق بابل ومنارة الإسكندرية بفعل الزمن والزلازل."],
      ["g", "ما مكانة مدينة بابل التاريخية في العراق؟", "إحدى أعظم حواضر العالم القديم على ضفاف الفرات؛ اشتهرت ببوابة عشتار وشريعة حمورابي والحدائق المعلقة."],
      ["g", "ما أكثر صحراء غير قطبية جفافاً في العالم؟", "صحراء «أتاكاما» في شمال تشيلي، وتُستخدم تربتها الشبيهة بالمريخ لاختبار مركبات الفضاء."],
      ["g", "ما هي «نقطة نيمو» في المحيط الهادئ؟", "أبعد نقطة بحرية عن أي يابسة على الكوكب، حتى إن رواد محطة الفضاء الدولية يكونون أحياناً أقرب البشر إليها."],
      ["g", "ما هي «حلقة النار» في المحيط الهادئ؟", "حزام جيولوجي نشط يحيط بالمحيط الهادئ وتقع فيه نحو 90% من زلازل العالم و75% من براكينه النشطة."],
      ["g", "ما أعمق نقطة في محيطات العالم؟", "«تشالنجر ديب» في خندق ماريانا بالمحيط الهادئ، بعمق يصل إلى نحو 11 كيلومتراً تحت سطح البحر."],
      ["g", "ما أكبر محيط وأكبر قارة على الأرض؟", "المحيط الهادئ هو الأكبر ويغطي نحو ثلث سطح الكوكب، وآسيا هي أكبر القارات مساحةً وسكاناً."],
      ["g", "بماذا تشتهر جزر غالاباغوس؟", "أرخبيل بركاني معزول في الإكوادور يضم كائنات فريدة ألهمت تشارلز داروين في صياغة نظرية التطور."],
      ["g", "ما هي ظاهرة «شمس منتصف الليل»؟", "ظاهرة تحدث صيفاً قرب القطبين بسبب ميل محور الأرض، حيث لا تغرب الشمس وتبقى مرئية طوال 24 ساعة."],
      ["g", "ما أعمق بحيرة مياه عذبة في العالم؟", "بحيرة بايكال في سيبيريا بعمق 1,642 متراً، وتحتوي وحدها على نحو 20% من المياه العذبة السائلة على الأرض."],
      ["g", "ما أكبر بحيرة (مسطح مائي داخلي) في العالم؟", "بحر قزوين بين آسيا وأوروبا؛ ورغم تسميته بحراً لملوحته ومساحته الهائلة، فهو جغرافياً أكبر بحيرة مغلقة."],
      ["g", "ما هو الأخدود العظيم (غراند كانيون)؟", "وادٍ صخري مهيب في أريزونا بطول 446 كم وعمق 1.8 كم نحته نهر كولورادو عبر ملايين السنين."],
      ["g", "ما أعلى جبل في قارة أفريقيا؟", "جبل كليمنجارو في تنزانيا بارتفاع 5,895 متراً، وهو بركان خامد تكسو الثلوج قمته قرب خط الاستواء."],
      ["g", "ما النهران اللذان أعطيا «بلاد الرافدين» اسمها؟", "دجلة والفرات؛ ينبعان من هضبة الأناضول ويلتقيان في جنوب العراق عند شط العرب، وعلى ضفافهما قامت أعرق الحضارات."],
      ["g", "أي دولة تضم أكبر عدد من الجزر في العالم؟", "السويد بأكثر من 267 ألف جزيرة، تليها النرويج وفنلندا، ومعظمها جزر صغيرة غير مأهولة."],
      ["g", "ما هي «جزر الكناري» وأين تقع جغرافياً؟", "أرخبيل بركاني تابع لإسبانيا يقع في المحيط الأطلسي قبالة الساحل الشمالي الغربي لإفريقيا (قرب المغرب)، ويتميز بمناخ معتدل طوال العام."],
      ["g", "ما هو «خط التاريخ الدولي» (International Date Line)؟", "خط وهمي يمتد تقريباً على خط طول 180 درجة وسط المحيط الهادئ؛ يتغيّر التاريخ يوماً كاملاً عند عبوره شرقاً أو غرباً."],
      ["g", "ما هي «الفيوردات» (Fjords) الشهيرة في النرويج؟", "خلجان بحرية ضيقة وعميقة تحيط بها منحدرات صخرية شاهقة، نحتتها الأنهار الجليدية العملاقة خلال العصور الجليدية."],
      ["g", "ما هو «خط الاستواء» وما عدد الدول التي يمر بها؟", "دائرة العرض صفر التي تقسم الأرض إلى نصفين شمالي وجنوبي، ويمر بـ13 دولة منها الإكوادور وكولومبيا والبرازيل وكينيا وإندونيسيا."],
      ["g", "أين تقع «بحيرة تيتيكاكا» وما الرقم القياسي الذي تحمله؟", "تقع في جبال الأنديز بين بيرو وبوليفيا على ارتفاع 3,812 متراً، وهي أعلى بحيرة صالحة للملاحة التجارية في العالم."],
      ["g", "ما هما «مدار السرطان» و«مدار الجدي» في الجغرافيا الفلكية؟", "خطا عرض عند 23.5 درجة شمال وجنوب خط الاستواء، يمثلان أقصى حد تصل إليه أشعة الشمس عموديةً خلال الانقلابين الصيفي والشتوي."],
      ["g", "ما هي الدولة التي تضم أكبر عدد من البحيرات الطبيعية في العالم؟", "كندا؛ إذ تحتوي وحدها على أكثر من نصف البحيرات الطبيعية في كوكب الأرض بفضل التعرية الجليدية القديمة."],
      ["g", "أين يقع «مضيق جبل طارق» وكم يبلغ أضيق عرض له؟", "يفصل بين إسبانيا في أوروبا والمغرب في إفريقيا ويربط الأطلسي بالمتوسط، ويبلغ أضيق عرض له نحو 14 كيلومتراً فقط."],
      ["g", "ما هي «سهول السافانا» وما أبرز مناطق انتشارها؟", "سهول عشبية شاسعة تتخللها أشجار متفرقة ذات مناخ مداري بموسم مطير وآخر جاف، وتشتهر في شرق ووسط إفريقيا كمحمية سيرينغيتي."],
      ["g", "ما هو «خندق بورتوريكو» وأين يقع؟", "أعمق نقطة في المحيط الأطلسي، يقع شمال جزيرة بورتوريكو ويصل عمقه إلى نحو 8,376 متراً تحت سطح البحر."],
      ["g", "ما هي «مدينة البندقية» (فينيسيا) في إيطاليا وكيف بُنيت؟", "مدينة تاريخية تقوم على أكثر من مئة جزيرة صغيرة داخل بحيرة ضحلة، ترتبط بقنوات مائية ومئات الجسور وتستند مبانيها على ركائز خشبية غارقة."],
      ["g", "ما هي «ظاهرة النينيو» (El Niño) المناخية؟", "احترار دوري غير معتاد لمياه شرق ووسط المحيط الهادئ الاستوائي يؤثر في أنماط الأمطار والجفاف والأعاصير حول العالم."],
      ["g", "ما هي «أعلى عاصمة في العالم» من حيث الارتفاع عن سطح البحر؟", "لاباز (مقر الحكومة في بوليفيا) على ارتفاع يقارب 3,650 متراً، تليها كيتو عاصمة الإكوادور على ارتفاع نحو 2,850 متراً."],
      ["g", "أين يقع «جبل فوجي» وما رمزيته الجغرافية والثقافية؟", "بركان طبقي مخروطي شبه مثالي في جزيرة هونشو باليابان بارتفاع 3,776 متراً، وهو أعلى قمة في البلاد وأيقونة بارزة في فنونها."],
      ["g", "ما هو «مثلث برمودا» وما التفسير العلمي لحوادثه؟", "منطقة في غرب المحيط الأطلسي بين برمودا وفلوريدا وبورتوريكو؛ وتؤكد الدراسات العلمية أن معدل الحوادث فيها لا يفوق غيرها من الممرات المزدحمة والعاصفة."],
      ["g", "ما هي «جزيرة إيستر» (رابا نوي) وبماذا تشتهر؟", "جزيرة نائية في جنوب شرق المحيط الهادئ تابعة لتشيلي، تشتهر بمئات التماثيل الحجرية العملاقة المسماة «مواي» التي نحتها سكانها البولينيزيون."],
      ["g", "ما هو «نهر اليانغتسي» وأين يجري؟", "أطول نهر في قارة آسيا وثالث أطول نهر في العالم (نحو 6,300 كم)، ويجري بالكامل داخل الصين حتى يصب في بحر الصين الشرقي."],
      ["g", "ما هي «الأراضي الرطبة» (Wetlands) ولماذا تُسمّى «كِلى الطبيعة»؟", "بيئات غنية بالمياه كالأهوار والمستنقعات تعمل على تنقية المياه من الملوثات وامتصاص الفيضانات وتوفير موئل حيوي للطيور والأسماك."],
      ["g", "أين تقع «قمة إلبروس» وما أهميتها الجغرافية؟", "تقع في سلسلة جبال القوقاز بروسيا بارتفاع 5,642 متراً، وتُعد أعلى قمة جبلية في قارة أوروبا."],
      ["g", "ما هي «مغارة جعيتا» في لبنان وكيف تكوّنت؟", "كهف كلسي طبيعي بديع قرب بيروت يضم صواعد وهوابط مذهلة ونهراً جوفياً، تشكّل على مدى ملايين السنين بفعل ذوبان الصخور الجيرية بالماء."],
      ["g", "ما هي «منطقة التندرا» (Tundra) في الجغرافيا الحيوية؟", "بيئة قطبية شديدة البرودة ذات تربة متجمدة دائماً تحت السطح، تخلو من الأشجار وتنمو فيها الحزازيات والأشنات والشجيرات القزمية."],
      ["g", "ما الخطر المناخي الأكبر الذي يهدد «جزر المالديف» في المحيط الهندي؟", "جزر المالديف أرخبيل مرجاني منخفض جداً بمتوسط ارتفاع يقارب 1.5 متر فوق سطح البحر، مما يجعلها من أكثر دول العالم عرضة لارتفاع منسوب المحيطات."],
      ["g", "ما هي «دلتا النهر» وكيف تتكوّن جغرافياً؟", "أرض مثلثة خصبة تتشكّل عند مصب النهر في البحر أو المحيط نتيجة تباطؤ جريان الماء وترسّب الطمي والرواسب عبر آلاف السنين."],
      ["g", "ما هو «ممر دريك» (Drake Passage) ولماذا يخشاه البحارة؟", "ممر بحري عريض بين الطرف الجنوبي لأمريكا الجنوبية وأنتاركتيكا، يُعد من أشد مياه العالم عصفاً واضطراباً لغياب اليابسة التي تكبح الرياح والأمواج."],
      ["g", "أين تقع «حديقة يلوستون الوطنية» وما أبرز معالمها الجيولوجية؟", "تقع غرب الولايات المتحدة، وهي أول حديقة وطنية في العالم (1872م)، وتضم أكثر من نصف السخانات الحرارية (الينابيع الفوّارة) على كوكب الأرض."],
      ["g", "ما هي «الدول الحبيسة» (Landlocked Countries) وما أكبرها مساحةً؟", "دول لا تطل على أي بحر مفتوح أو محيط، وأكبرها مساحةً في العالم هي كازاخستان في آسيا الوسطى."],
      ["g", "ما هو «نهر الميكونغ» وما أهميته لجنوب شرق آسيا؟", "نهر عظيم ينبع من هضبة التبت ويمر بست دول في جنوب شرق آسيا، ويُعد شريان الغذاء وزراعة الأرز والثروة السمكية لعشرات الملايين."],
      ["g", "ما هي «الكثبان النجمية» في الصحاري الكبرى؟", "كثبان رملية هرمية شاهقة ذات أذرع متعددة تتكوّن عندما تهب الرياح من عدة اتجاهات مختلفة، ويمكن أن يتجاوز ارتفاعها 300 متر."],
      // ===================== [m] طب وعلم نفس (115 معلومة) =====================
      ["m", "ما هو أكبر عضو في جسم الإنسان من حيث المساحة والوزن؟", "الجلد، إذ يشكل خط الدفاع الأول للجسم وينظم حرارته ويمثل نحو 15% من وزن الجسم."],
      ["m", "كم عدد العظام في جسم الإنسان البالغ؟", "206 عظمات، بينما يولد الطفل بنحو 270 عظمة تندمج بعضها معاً خلال النمو."],
      ["m", "ما هي أصغر عظمة في جسم الإنسان وأين تقع؟", "عظمة الركاب (Stapes)، وتقع في الأذن الوسطى ويبلغ طولها نحو 3 ملليمترات فقط."],
      ["m", "أي عضو في جسم الإنسان يمتلك قدرة استثنائية على تجديد نفسه بعد فقدان جزء كبير منه؟", "الكبد، إذ يمكن لخلاياه التكاثر واستعادة الحجم والوظيفة حتى بعد استئصال جزء كبير منه."],
      ["m", "ما هي فصيلة الدم التي تُعرف بـ«المعطي العام» لكريات الدم الحمراء في حالات الطوارئ؟", "فصيلة الدم (O سالب)، لخلو سطح خلاياها الحمراء من مولدات الضد A وB وعامل ريزوس."],
      ["m", "من هو العالم الذي اكتشف البنسلين عام 1928م فاتحاً عصر المضادات الحيوية؟", "ألكسندر فليمنغ، عندما لاحظ مصادفةً أن فطراً يمنع نمو البكتيريا في طبق مخبري."],
      ["m", "من هو الطبيب المسلم الذي اكتشف الدورة الدموية الصغرى (الرئوية) في القرن الثالث عشر؟", "ابن النفيس، وذلك قبل وصفها في أوروبا بأكثر من ثلاثة قرون."],
      ["m", "ما هو الهرمون الأساسي الذي ينظّم إيقاع النوم واليقظة في الجسم؟", "الميلاتونين، وتفرزه الغدة الصنوبرية في الدماغ استجابةً للظلام."],
      ["m", "ما المقصود بـ«تأثير الهالة» (Halo Effect) في علم النفس؟", "انحياز معرفي يجعل انطباعنا الإيجابي عن صفة واحدة في شخص يؤثر إيجابياً في تقييمنا لبقية صفاته."],
      ["m", "ما هو «الانحياز التأكيدي» (Confirmation Bias)؟", "ميل العقل البشري للبحث عن المعلومات التي تؤيد معتقداته المسبقة وتذكرها بسهولة، مع تجاهل الأدلة المخالفة لها."],
      ["m", "ما هي الوظيفة الرئيسية لخلايا الدم البيضاء؟", "حماية الجسم ومكافحة العدوى والأجسام الغريبة ضمن الجهاز المناعي."],
      ["m", "كم مرة تقريباً ينبض قلب الإنسان البالغ في اليوم الواحد أثناء الراحة؟", "نحو 100 ألف نبضة يومياً، يضخ خلالها قرابة 7 آلاف لتر من الدم عبر الأوعية الدموية."],
      ["m", "ما هو الجزء من العين الذي يحتوي على الخلايا المستقبلة للضوء والألوان؟", "الشبكية، وتضم خلايا عصوية للرؤية الليلية وخلايا مخروطية لتمييز الألوان والتفاصيل الدقيقة."],
      ["m", "ما المقصود بـ«الذاكرة العاملة» (Working Memory) في علم النفس المعرفي؟", "نظام معرفي مؤقت يحتفظ بالمعلومات ويعالجها لحظياً أثناء التفكير أو الحساب الذهني، وتتسع عادةً لعدد محدود من العناصر."],
      ["m", "ما هو الفيتامين الذي يصنّعه الجلد طبيعياً عند التعرض لأشعة الشمس؟", "فيتامين د (Vitamin D)، وهو ضروري لامتصاص الكالسيوم وصحة العظام والمناعة."],
      ["m", "ما هو «تأثير المتفرّج» (Bystander Effect)؟", "ظاهرة نفسية اجتماعية تقل فيها احتمالية تدخل الفرد لمساعدة شخص في مأزق كلما زاد عدد الشهود الحاضرين بسبب تشتت الشعور بالمسؤولية."],
      ["m", "أين تُنتج معظم خلايا الدم الحمراء في جسم الإنسان البالغ؟", "في نخاع العظم الأحمر الموجود داخل العظام المسطحة ونهايات العظام الطويلة."],
      ["m", "ما هي مرحلة «نوم حركة العين السريعة» (REM)؟", "مرحلة من النوم ينشط فيها الدماغ بشدة وتحدث فيها معظم الأحلام الواضحة، وتؤدي دوراً محورياً في ترسيخ الذاكرة وتنظيم المشاعر."],
      ["m", "من هو الطبيب العالم الرازي وما أحد أبرز إنجازاته الطبية؟", "أبو بكر محمد بن زكريا الرازي، وهو أول من فرّق سريرياً بدقة بين مرضي الجدري والحصبة ووضع كتاب «الحاوي في الطب»."],
      ["m", "ما المقصود بـ«مفارقة الاختيار» (Paradox of Choice)؟", "ظاهرة نفسية تشير إلى أن كثرة الخيارات المتاحة أمام الإنسان قد تزيد من توتره وندمه وتصعّب اتخاذ القرار بدلاً من زيادة رضاه."],
      ["m", "من هو الطبيب الفيلسوف الذي ألّف موسوعة «القانون في الطب» التي دُرّست في جامعات أوروبا لقرون؟", "ابن سينا (أبو علي الحسين بن عبد الله)، وجمع فيها الطب التجريبي والتشخيص السريري وعلم الأدوية."],
      ["m", "من هو الطبيب الأندلسي الملقب بـ«أبو الجراحة الحديثة» ومؤلف كتاب «التصريف»؟", "أبو القاسم الزهراوي، الذي ابتكر ووصف أكثر من مئتي أداة جراحية واستخدم خيوط أمعاء القطط في تقطيب الجروح."],
      ["m", "ما هي الوظيفة الحيوية لهرمون الأنسولين في جسم الإنسان؟", "يفرزه البنكرياس ليسمح للخلايا بامتصاص الغلوكوز من الدم وتحويله إلى طاقة، ما يحافظ على توازن سكر الدم."],
      ["m", "ما هو البروتين الموجود في كريات الدم الحمراء الذي يمنح الدم لونه الأحمر وينقل الأكسجين؟", "الهيموغلوبين، ويحتوي على عنصر الحديد القادر على الارتباط بالأكسجين في الرئتين وتوزيعه على أنسجة الجسم."],
      ["m", "كم لتراً من السوائل تُرشّحها كليتا الإنسان البالغ يومياً لتنقية الدم؟", "نحو 180 لتراً يومياً، يُعاد امتصاص معظمها ولا يخرج منها كفضلات سوى نحو لتر ونصف إلى لترين من البول."],
      ["m", "من هو الطبيب الإنجليزي الذي طوّر أول لقاح ناجح في التاريخ ضد مرض الجدري عام 1796م؟", "إدوارد جينر، ووضع بذلك الأساس العلمي لعلم المناعة والتطعيم الحديث."],
      ["m", "ما المقصود بـ«الميكروبيوم المعوي»؟", "مجموعة تريليونات الكائنات الدقيقة النافعة التي تعيش في أمعاء الإنسان وتساعد في الهضم وتصنيع بعض الفيتامينات ودعم المناعة."],
      ["m", "ما هي «المرونة العصبية» (Neuroplasticity) في الدماغ؟", "قدرة الدماغ طوال الحياة على تكوين وصلات عصبية جديدة وإعادة تنظيم نفسه استجابةً للتعلم والخبرة أو التعافي من الإصابات."],
      ["m", "ما الجزء المسؤول في الدماغ عن تحويل الذكريات قصيرة المدى إلى ذكريات طويلة المدى؟", "الحُصين (Hippocampus)، ويؤدي أيضاً دوراً رئيسياً في التوجيه المكاني وتكوين الخرائط الذهنية."],
      ["m", "ما الدور الرئيسي للناقل العصبي «الدوبامين» في الدماغ؟", "يرتبط بنظام التحفيز والمكافأة والتركيز والتعلم الحركي، ويدفع الإنسان للسعي نحو الأهداف."],
      ["m", "ما هو «تأثير الدواء الوهمي» (Placebo Effect)؟", "تحسّن ملموس يشعر به المريض بعد تناول مادة خالية من أي دواء فعّال، نتيجة توقعه الإيجابي وثقته بالعلاج."],
      ["m", "ما المقصود بـ«التنافر المعرفي» (Cognitive Dissonance) في علم النفس؟", "حالة من عدم الارتياح النفسي تنشأ عندما يحمل الإنسان فكرتين متناقضتين أو يتصرف بما يخالف قناعاته، فيحاول تبرير أحدهما."],
      ["m", "ما هو «تأثير دانينغ-كروغر» (Dunning-Kruger Effect)؟", "انحياز معرفي يميل فيه الأشخاص ذوو المعرفة المحدودة في مجال ما إلى المبالغة في تقدير كفاءتهم لجهلهم بمدى تعقيد المجال."],
      ["m", "ما هو «تأثير زيغارنيك» (Zeigarnik Effect) في علم النفس؟", "ميل العقل البشري لتذكّر المهام غير المكتملة أو المتقطعة بوضوح أكبر من المهام التي أُنجزت بالكامل."],
      ["m", "ما الفرق بين الجهاز العصبي الودي ونظير الودي؟", "الجهاز الودي يهيّئ الجسم لحالة الطوارئ والكرّ والفرّ برفع النبض، بينما يعيده الجهاز نظير الودي إلى حالة الهدوء والهضم والاستشفاء."],
      ["m", "ما هي فصيلة الدم التي تُعرف بـ«المستقبل العام» لكريات الدم الحمراء؟", "فصيلة الدم (AB موجب)، لأنها تملك مولدات الضد A وB وعامل ريزوس، فلا يهاجم جهازها المناعي الفصائل الأخرى."],
      ["m", "ما هي العضلة التي تُنتج أكبر قوة ضغط بالنسبة لحجمها في جسم الإنسان؟", "العضلة الماضغة في الفك (Masseter)، إذ يمكنها توليد قوة إطباق عالية جداً على الأضراس."],
      ["m", "ما اسم العضلة الرئيسية التي تفصل تجويف الصدر عن البطن وتقود عملية التنفس؟", "الحجاب الحاجز، إذ ينقبض ويهبط للأسفل عند الشهيق لتوسيع الرئتين وسحب الهواء."],
      ["m", "ما الإنجاز الطبي الشهير للعالم الفرنسي لويس باستور في القرن التاسع عشر؟", "إثبات النظرية الجرثومية للأمراض، وتطوير عملية البسترة لتعقيم الأغذية، وابتكار لقاح داء الكلب."],
      ["m", "ما الوظيفة الأساسية للصفائح الدموية في الجسم؟", "التجمع السريع عند موقع أي جرح لتكوين جلطة دموية تسد الوعاء المصاب وتوقف النزيف."],
      ["m", "ما هو مرض «الإسقربوط» الذي كان يصيب البحارة قديماً وما سببه؟", "مرض يسبب نزيف اللثة وضعف التئام الجروح نتيجة النقص الحاد في فيتامين ج (Vitamin C) بسبب غياب الفواكه والخضروات الطازجة."],
      ["m", "ما هي الوظيفة الرئيسية للغدة الدرقية الموجودة في مقدمة الرقبة؟", "إفراز هرمونات تنظم سرعة الأيض (التمثيل الغذائي) وإنتاج الطاقة وحرارة الجسم ونبض القلب."],
      ["m", "أي جزء من الدماغ البشري يختص بالتخطيط واتخاذ القرار وضبط الانفعالات؟", "القشرة الجبهية الأمامية (Prefrontal Cortex)، وهي آخر مناطق الدماغ اكتمالاً في النضج."],
      ["m", "ما المقصود بـ«إرهاق القرار» (Decision Fatigue)؟", "تراجع جودة قرارات الإنسان وقدرته على ضبط النفس بعد اتخاذه سلسلة طويلة من الاختيارات المتتالية خلال اليوم."],
      ["m", "ما هو الهرمون الرئيسي الذي يفرزه الجسم استجابةً للتوتر والضغط النفسي؟", "هرمون الكورتيزول، وتفرزه الغدة الكظرية لرفع مستوى الطاقة واليقظة في المواقف الضاغطة، لكن ارتفاعه المزمن يضر بالصحة."],
      ["m", "ما هو «الحاجز الدموي الدماغي» (Blood-Brain Barrier) وما وظيفته؟", "غشاء خلوي انتقائي بالغ الدقة يبطّن الأوعية الدموية في الدماغ، يسمح بمرور الأكسجين والغلوكوز ويمنع دخول معظم السموم والميكروبات لحماية الخلايا العصبية."],
      ["m", "ما هي تقنية «كريسبر» (CRISPR-Cas9) التي أحدثت ثورة في علم الوراثة والطب؟", "أداة جزيئية مستوحاة من مناعة البكتيريا تعمل كمقص جيني فائق الدقة يتيح للعلماء تعديل تسلسل الحمض النووي لتصحيح طفرات تسبب أمراضاً وراثية."],
      ["m", "ما هي ظاهرة «الالتهام الذاتي» (Autophagy) في الخلايا التي نال عنها يوشينوري أوسومي جائزة نوبل عام 2016م؟", "آلية طبيعية لإعادة التدوير تقوم فيها الخلية بتفكيك بروتيناتها التالفة وعضياتها الهرمة وإعادة استخدامها كمصدر للطاقة والتجديد، وتنشط بشكل ملحوظ أثناء الصيام."],
      ["m", "ما هي «التيلوميرات» (Telomeres) وما علاقتها بشيخوخة الخلايا؟", "أغطية واقية تقع في نهايات الكروموسومات تحمي الحمض النووي من التلف كأطراف أربطة الحذاء، وتقصر تدريجياً مع كل انقسام خلوي حتى تتوقف الخلية عن الانقسام."],
      ["m", "ما هي «حاسة استقبال الحس العميق» (Proprioception) التي يطلق عليها البعض الحاسة السادسة؟", "قدرة الدماغ على إدراك موقع أطرافك وحركة مفاصلك وقوة عضلاتك بدقة دون النظر إليها، وهي التي تمكّنك من لمس أنفك وأنت مغمض العينين."],
      ["m", "كيف تحمي المعدة جدارها من حمض الهيدروكلوريك القوي الذي تفرزه لهضم الطعام؟", "بإفراز طبقة سميكة ومتجددة من المخاط الغني بالبيكربونات القلوية تعادل الحمض على سطح الجدار، إلى جانب تجدد خلايا بطانة المعدة كل بضعة أيام."],
      ["m", "ما هي «الخلايا العصبية المرآتية» (Mirror Neurons) وما دورها النفسي والاجتماعي؟", "خلايا دماغية تنشط سواء عندما تؤدي فعلاً معيناً بنفسك أو عندما تشاهد شخصاً آخر يؤديه، ويُعتقد أنها تلعب دوراً محورياً في التعلم بالتقليد والتعاطف وفهم مشاعر الآخرين."],
      ["m", "كيف تعمل لقاحات «الحمض النووي الريبوزي المرسال» (mRNA) مقارنةً باللقاحات التقليدية؟", "بدلاً من حقن فيروس مضعّف أو ميت، تزوّد الخلايا بوصفة مؤقتة لإنتاج بروتين غير ضار يشبه جزءاً من الفيروس، فيتدرّب الجهاز المناعي على التعرف إليه ومهاجمته فورياً."],
      ["m", "ما هو دور هرمون «الأوكسيتوسين» في جسم الإنسان وسلوكه؟", "يُفرز من الغدة النخامية ويؤدي دوراً حيوياً في الولادة والرضاعة الطبيعية، كما يعزّز مشاعر الثقة والترابط العاطفي والأبوي والاجتماعي بين البشر."],
      ["m", "ما هي «الخلايا الجذعية» ولماذا تُعلّق عليها آمال كبيرة في الطب التجديدي؟", "خلايا غير متخصصة تمتلك قدرة فريدة على الانقسام والتحول إلى أنواع متعددة من خلايا الجسم (كخلايا القلب أو الأعصاب أو الدم) لإصلاح الأنسجة التالفة."],
      ["m", "ما هو «منحنى النسيان» لإيبنغهاوس وكيف يتغلب عليه التكرار المتباعد؟", "أثبت هيرمان إيبنغهاوس أننا ننسى معظم المعلومات الجديدة خلال أيام قليلة ما لم نراجعها، وأن مراجعتها على فترات زمنية متباعدة ومتزايدة تُبطئ المنحنى وتنقلها للذاكرة طويلة الأمد."],
      ["m", "ما هو «تأثير بجماليون» (تأثير روزنتال) في علم النفس التربوي؟", "ظاهرة نفسية تُظهر أن توقعات المعلم أو القائد الإيجابية المرتفعة تجاه شخص ما تنعكس لاشعورياً في أسلوب تعامله فتدفع ذلك الشخص لتحقيق أداء أعلى فعلاً."],
      ["m", "ما هو «تأثير ستروب» (Stroop Effect) الشهير في علم النفس المعرفي؟", "تأخر الدماغ وزيادة الأخطاء عند محاولة تسمية لون الحبر الذي كُتبت به كلمة تدل على لون مختلف (مثل كلمة «أزرق» مكتوبة باللون الأحمر)، مما يثبت أن القراءة عملية تلقائية أسرع من تمييز اللون."],
      ["m", "ما المقصود بـ«انحياز البقاء» (Survivorship Bias) الذي يوقعنا في استنتاجات مغلوطة؟", "التركيز فقط على الحالات التي نجت أو نجحت وتجاهل الحالات التي فشلت أو اختفت من البيانات، مثل استخلاص قواعد النجاح من قصص مليارديرات قلائل دون دراسة آلاف من فعلوا الشيء نفسه وفشلوا."],
      ["m", "كيف يفسّر علم الأعصاب ظاهرة «ديجا فو» (الشعور بأنك عشت اللحظة سابقاً)؟", "يُرجّح أنها خطأ مؤقت وعابر في دوائر الذاكرة بالفص الصدغي يجعل الدماغ يُعالج تجربة حاضرة جديدة عبر مسار الإحساس بالأُلفة كما لو كانت ذكرى قديمة."],
      ["m", "ما هي «مناعة القطيع» (المناعة الجماعية) في علم الأوبئة؟", "حماية غير مباشرة تتحقق للمجتمع بأسره عندما يكتسب نسبة عالية من أفراده مناعة ضد مرض معدٍ (بالتطعيم أو الإصابة السابقة)، فتنقطع سلاسل العدوى ويُحمى من يتعذر تطعيمهم."],
      ["m", "أين تقع «الساعة البيولوجية» الرئيسية في جسم الإنسان وكيف تضبط نفسها؟", "في منطقة صغيرة بوطاء الدماغ تُسمى «النواة فوق التصالبة»، وتستقبل إشارات الضوء المباشرة من العين لتزامن إفراز الهرمونات وحرارة الجسم والنوم مع دورة الليل والنهار."],
      ["m", "ما هو «تأثير البلاسيبو» (الدواء الوهمي)؟", "تحسّن حقيقي في أعراض المريض عند تناول مادة بلا مكوّن دوائي لمجرد اعتقاده الصادق بأنها علاج فعّال."],
      ["m", "ما هو «منحنى إبنغهاوس للنسيان»؟", "نموذج يوضح سرعة نسيان المعلومات الجديدة دون مراجعة، ويثبت أن «التكرار المتباعد» هو أنجح وسيلة لترسيخها."],
      ["m", "ما هي «متلازمة المحتال»؟", "حالة نفسية يشعر فيها أشخاص أكفاء بأنهم لا يستحقون نجاحهم ويخشون أن يُكتشف أمرهم كـ«محتالين» رغم إنجازاتهم."],
      ["m", "ما المقصود بـ «الانحياز التأكيدي»؟", "ميل العقل اللاواعي للبحث عن الأدلة التي تؤيد معتقداته المسبقة وتفسيرها لصالحها مع تجاهل ما يخالفها."],
      ["m", "ما الفرق بين الدوبامين والسيروتونين؟", "يرتبط الدوبامين بالتحفيز والمكافأة والسعي، بينما ينظّم السيروتونين المزاج والاستقرار النفسي والنوم والشهية."],
      ["m", "ما مرحلة نوم «حركة العين السريعة» (REM)؟", "مرحلة ينشط فيها الدماغ وتحدث فيها معظم الأحلام الواضحة، وتؤدي دوراً حاسماً في تثبيت الذكريات."],
      ["m", "ما هو «هرم ماسلو» للاحتياجات؟", "تدرّج لدوافع الإنسان يبدأ بالحاجات الفسيولوجية، ثم الأمان، فالانتماء، فالتقدير، وينتهي في القمة بـ«تحقيق الذات»."],
      ["m", "ما هو «الذكاء العاطفي»؟", "القدرة على إدراك مشاعرك ومشاعر الآخرين وفهمها وإدارتها بحكمة، وهو عنصر جوهري في النجاح الاجتماعي والقيادي."],
      ["m", "ما هو «تأثير دانينغ-كروغر»؟", "انحياز معرفي يبالغ فيه قليلو الخبرة في تقدير كفاءتهم، بينما يميل الخبراء أحياناً إلى التواضع وتقليل شأن قدراتهم."],
      ["m", "ما هي «الخلايا العصبية المرآتية»؟", "خلايا دماغية تنشط عند أداء فعل ما أو عند مشاهدة آخر يؤديه، وتُسهم في التعاطف والتعلّم بالمحاكاة."],
      ["m", "كم مرة ينبض قلب الإنسان يومياً تقريباً؟", "نحو 100,000 نبضة يومياً ليضخ قرابة 7,200 لتر من الدم عبر شبكة أوعية دموية هائلة الطول."],
      ["m", "كيف تعمل الذاكرة المناعية في الجسم؟", "تحتفظ خلايا المناعة التكيّفية بسجل لمسببات الأمراض أو اللقاحات السابقة، فتواجهها بسرعة فائقة إذا عادت مجدداً."],
      ["m", "ما هي «البصمة الوراثية»؟", "نمط فريد من تسلسلات الحمض النووي (DNA) يميّز كل فرد عن غيره باستثناء التوائم المتطابقة."],
      ["m", "ما هو «تأثير زايغارنيك» في الذاكرة؟", "ميل الدماغ لتذكّر المهام غير المكتملة بوضوح أكبر من المنجزة، ما يفسّر بقاء القصص غير المنتهية عالقة في الذهن."],
      ["m", "ما المقصود بـ «المرونة العصبية» (Neuroplasticity)؟", "قدرة الدماغ المستمرة طوال الحياة على تكوين روابط عصبية جديدة وإعادة تنظيم نفسه استجابةً للتعلم والخبرة."],
      ["m", "ما هو «تأثير الهالة» (Halo Effect)؟", "انحياز يجعل انطباعنا الإيجابي عن سمة ظاهرة في شخص ما ينسحب تلقائياً على تقييمنا لبقية صفاته."],
      ["m", "ما دور هرمون «الكورتيزول»؟", "يُعرف بهرمون التوتر؛ يهيئ الجسم لمواجهة الخطر، لكن ارتفاعه المزمن يضعف المناعة والذاكرة والنوم."],
      ["m", "ما هي «الساعة البيولوجية»؟", "نظام توقيت داخلي بالدماغ ينسّق دورات النوم واليقظة وإفراز الميلاتونين وحرارة الجسم وفق الضوء والظلام."],
      ["m", "أي فصيلة دم تُعرف بـ «المعطي العام» لكريات الدم الحمراء؟", "فصيلة (O سالب) لخلوها من مستضدات A وB وRh، بينما فصيلة (AB موجب) هي «المستقبل العام»."],
      ["m", "ما هو «الميكروبيوم» المعوي؟", "تريليونات البكتيريا النافعة في أمعائنا التي تسهم في الهضم وتصنيع الفيتامينات والمناعة والتأثير في المزاج."],
      ["m", "ما هو «انحياز الارتساء»؟", "اعتماد العقل المفرط على أول رقم أو معلومة يتلقاها عند اتخاذ القرار أو تقدير الأسعار."],
      ["m", "ما هو «تأثير المتفرج» في علم النفس الاجتماعي؟", "انخفاض احتمال تدخّل الفرد لمساعدة شخص في مأزق كلما زاد عدد الحضور حوله بسبب تشتّت المسؤولية."],
      ["m", "ما الفرق بين الذاكرة العاملة والذاكرة طويلة المدى؟", "الذاكرة العاملة تحتفظ بالمعلومات مؤقتاً لثوانٍ أثناء التفكير، بينما تحفظ طويلة المدى المعارف لسنوات أو مدى الحياة."],
      ["m", "ما هي حالة «التدفّق» (Flow) النفسية؟", "حالة اندماج وتركيز عميق في نشاط متقن يتوازن فيه التحدي مع المهارة، فيتلاشى الشعور بمرور الوقت."],
      ["m", "لماذا يُسمّى فيتامين د «فيتامين الشمس»؟", "لأن الجلد يصنّعه طبيعياً عند التعرّض لأشعة الشمس فوق البنفسجية، وهو ضروري لامتصاص الكالسيوم وصحة العظام والمناعة."],
      ["m", "ما هي ظاهرة «الترافق الحسي» (Synesthesia) في علم الأعصاب؟", "حالة عصبية نادرة تتداخل فيها الحواس، فيرى الشخص الأرقام أو الحروف بألوان محددة أو «يتذوّق» نكهات عند سماع أصوات معينة."],
      ["m", "ما هو «المخيخ» (Cerebellum) وما دوره في جسم الإنسان؟", "جزء في مؤخرة الدماغ مسؤول عن تنسيق الحركات الدقيقة وحفظ التوازن وتعلّم المهارات الحركية كركوب الدراجة والكتابة."],
      ["m", "ما الفرق بين «الفيروس» و«البكتيريا» من الناحية الطبية؟", "البكتيريا كائنات حية وحيدة الخلية تعالجها المضادات الحيوية، أما الفيروسات فطفيليات مجهرية تتكاثر داخل خلايا العائل ولا تنفع معها المضادات الحيوية."],
      ["m", "ما هو «الجهاز اللمفاوي» في جسم الإنسان؟", "شبكة من الأوعية والعقد اللمفاوية تصرف السوائل الزائدة من الأنسجة وتنقل خلايا المناعة لمحاربة العدوى وتنقية الجسم."],
      ["m", "ما المقصود بـ«العدوى العاطفية» (Emotional Contagion) في علم النفس؟", "ميل البشر اللاواعي إلى محاكاة تعابير الوجه ونبرة الصوت والحالة المزاجية لمن حولهم، مما ينقل التوتر أو البهجة داخل المجموعات."],
      ["m", "ما هي «ظاهرة التثاؤب المعدي» وما تفسيرها العلمي المرجّح؟", "تثاؤب الشخص تلقائياً عند رؤية أو سماع غيره يتثاءب، ويربطها الباحثون بالتعاطف الاجتماعي ونشاط الشبكات العصبية الاجتماعية في الدماغ."],
      ["m", "ما هو «الأدرينالين» (الإبينفرين) ومتى يفرزه الجسم؟", "هرمون وناقل عصبي تفرزه الغدة الكظرية عند الخطر أو الإثارة، فيرفع نبض القلب وضغط الدم ويهيّئ الجسم لاستجابة «الكرّ أو الفرّ»."],
      ["m", "ما المقصود بـ«مقاومة المضادات الحيوية» ولماذا تُعد تهديداً صحياً عالمياً؟", "تكيّف بعض سلالات البكتيريا لتصمد أمام الأدوية التي كانت تقتلها سابقاً، ويزداد خطرها بسبب الاستخدام العشوائي أو عدم إكمال الجرعات."],
      ["m", "ما هو «تأثير نوسيبو» (Nocebo Effect) في الطب وعلم النفس؟", "ظهور أعراض سلبية حقيقية لدى المريض لمجرد توقّعه أن علاجاً أو مادة ما ستضره، حتى لو كانت المادة خاملة تماماً."],
      ["m", "ما هو «العصب المبهم» (Vagus Nerve) في جسم الإنسان؟", "أطول عصب قحفي يربط الدماغ بالقلب والرئتين والجهاز الهضمي، ويلعب دوراً محورياً في تهدئة الجسم وتنشيط الاسترخاء والهضم."],
      ["m", "ما هو «تأثير التعرّض المجرد» (Mere-Exposure Effect) في علم النفس؟", "ظاهرة نفسية تجعل الإنسان يميل إلى تفضيل الأشياء والوجوه والأفكار المألوفة لمجرد تكرار تعرضه لها."],
      ["m", "ما هي وظيفة «الميلانين» في جسم الإنسان؟", "صبغة طبيعية تنتجها خلايا خاصة تمنح الجلد والشعر والعينين ألوانها، وتحمي الحمض النووي للجلد من أضرار الأشعة فوق البنفسجية."],
      ["m", "ما هو «انحياز الإدراك المتأخر» (Hindsight Bias)؟", "ميل الإنسان بعد وقوع الحدث إلى الاعتقاد بأنه كان يتوقعه بسهولة منذ البداية (ظاهرة «كنت أعرف ذلك طوال الوقت»)."],
      ["m", "ما المقصود بـ«الذكاء السائل» و«الذكاء المتبلور» في علم النفس؟", "الذكاء السائل هو القدرة على حل المشكلات الجديدة والتفكير المرن، بينما الذكاء المتبلور هو حصيلة المعارف والخبرات والمفردات المكتسبة عبر العمر."],
      ["m", "ما هو «النظام الغليمفاوي» (Glymphatic System) في الدماغ؟", "آلية تنظيف دقيقة تنشط بقوة أثناء النوم العميق لغسل الدماغ من الفضلات البروتينية المتراكمة خلال ساعات اليقظة."],
      ["m", "ما هي «اللوزة الدماغية» (Amygdala) وما وظيفتها؟", "بنية صغيرة على شكل لوزة في عمق الدماغ تختص بمعالجة المشاعر القوية خاصةً الخوف والقلق وتنبيه الجسم للأخطار."],
      ["m", "ما هو «تأثير بارنوم» (تأثير فورير) الذي تستغله الأبراج؟", "ميل الناس لتصديق أوصاف شخصية عامة وغامضة جداً على أنها صُمّمت لهم وحدهم بدقة، رغم أنها تنطبق على معظم البشر."],
      ["m", "ما الفرق بين «الفيتامينات الذائبة في الماء» و«الذائبة في الدهون»؟", "الذائبة في الماء (مثل C ومجموعة B) يطرح الجسم فائضها يومياً في البول، بينما الذائبة في الدهون (A وD وE وK) تُخزَّن في الكبد والأنسجة الدهنية."],
      ["m", "ما هي «متلازمة الاحتراق الوظيفي» (Burnout)؟", "حالة إرهاق جسدي وعاطفي وذهني مزمن ناتجة عن ضغط العمل المستمر دون تعافٍ كافٍ، تؤدي إلى الفتور وتراجع الشعور بالإنجاز."],
      ["m", "ما هي وظيفة «البنكرياس» المزدوجة في الجسم؟", "يؤدي دوراً هضمياً بإفراز إنزيمات تفكك الطعام في الأمعاء، ودوراً هرمونياً بإفراز الأنسولين والغلوكاغون لضبط سكر الدم."],
      ["m", "ما هو «تأثير التأطير» (Framing Effect) في اتخاذ القرار؟", "تغيّر قرار الإنسان تبعاً لطريقة عرض المعلومة نفسها؛ كقبول علاج «نسبة نجاحه 90%» بسهولة أكبر من علاج «نسبة فشله 10%»."],
      ["m", "ما هي «البلازما» في دم الإنسان وما نسبتها؟", "السائل الأصفر الذي يشكّل نحو 55% من حجم الدم، ويتكوّن معظمه من الماء ويحمل الخلايا الدموية والبروتينات والهرمونات والمغذيات."],
      ["m", "ما هو «النوم متعدد الأطوار» مقارنةً بالنوم أحادي الطور؟", "توزيع ساعات النوم على فترات قصيرة متفرقة خلال اليوم بدلاً من نوم متصل ليلاً؛ وتُظهر الأبحاث أن النوم الليلي المتصل أصح لمعظم البشر."],
      ["m", "ما هي «ظاهرة الطرف الشبح» (Phantom Limb)؟", "إحساس مؤلم أو حسي يشعر به الشخص في طرف مبتور كأنه ما زال موجوداً، بسبب استمرار خرائط الدماغ الحسية في إرسال إشارات عصبية."],
      ["m", "ما هو «التكيّف الحسي» (Sensory Adaptation)؟", "تراجع استجابة الحواس لمؤثر ثابت ومتكرر مع مرور الوقت، مثل عدم ملاحظتك ملمس ملابسك أو رائحة غرفة بعد دقائق من دخولها."],
      ["m", "ما الفرق بين «الأشعة المقطعية» (CT) و«الرنين المغناطيسي» (MRI)؟", "التصوير المقطعي يستخدم الأشعة السينية لإنتاج صور سريعة دقيقة للعظام والنزيف، بينما يستخدم الرنين المغناطيسي حقلاً مغناطيسياً قوياً بلا إشعاع لتصوير الأنسجة الرخوة والدماغ."],
      ["m", "ما هو «الانحياز للوضع الراهن» (Status Quo Bias)؟", "تفضيل الإنسان اللاواعي لبقاء الأمور على حالها ومقاومة التغيير حتى عندما تكون البدائل الجديدة أفضل موضوعياً."],
      ["m", "ما هي «الأنيميا» (فقر الدم) وما أكثر أسبابها شيوعاً؟", "انخفاض عدد كريات الدم الحمراء أو تركيز الهيموغلوبين مما يقلل نقل الأكسجين للأنسجة، وأكثر أسبابها شيوعاً نقص الحديد."],
      // ===================== [t] تكنولوجيا واختراعات (115 معلومة) =====================
      ["t", "ما هو النظام العددي الذي تعتمد عليه جميع الحواسيب الرقمية في معالجة البيانات؟", "النظام الثنائي (Binary)، ويستخدم رقمين فقط هما الصفر (0) والواحد (1) لتمثيل حالتي إيقاف وتشغيل الإشارة الكهربائية."],
      ["t", "ما المقصود بالـ«بت» (Bit) والـ«بايت» (Byte)؟", "البت هو أصغر وحدة بيانات في الحاسوب (0 أو 1)، بينما يتكوّن البايت الواحد من 8 بتات ويكفي لتمثيل حرف أساسي واحد."],
      ["t", "كيف تعمل كابلات الألياف الضوئية في نقل الإنترنت فائق السرعة؟", "تنقل البيانات على شكل نبضات ضوئية عبر شعيرات زجاجية فائقة النقاء بفضل ظاهرة الانعكاس الداخلي الكلي."],
      ["t", "ما وظيفة بروتوكول HTTPS مقارنةً بـ HTTP عند تصفح المواقع؟", "يضيف طبقة تشفير (TLS/SSL) تحمي البيانات المتبادلة بين متصفحك والخادم من التنصّت أو التعديل أثناء النقل."],
      ["t", "من هو المخترع الذي طوّر المطبعة ذات الحروف المعدنية المتحركة في أوروبا عام 1440م؟", "يوهانس غوتنبرغ، وأحدث اختراعه ثورة تاريخية في نشر الكتب والمعرفة."],
      ["t", "ما هو نظام التموضع العالمي (GPS) وكيف يحدد موقعك بدقة؟", "شبكة أقمار صناعية تبث إشارات زمنية دقيقة؛ ويحسب هاتفك المسافة إلى أربعة أقمار على الأقل عبر فرق زمن وصول الإشارات لتحديد موقعك بدقة."],

      ["a", "من هو الموسيقار الألماني الذي ألّف السيمفونية التاسعة الشهيرة رغم إصابته بالصمم التام؟", "لودفيغ فان بيتهوفن، الذي مثّلت أعماله الجسر بين الحقبتين الكلاسيكية والرومانسية في الموسيقى."],
      ["a", "ما هي الآلة الوترية العربية التي تُلقّب بسلطان الآلات وأثرت في تطور آلة اللوت الأوروبية؟", "العود، وقد طوّر أوتاره وأصوله الموسيقية فنانون وعلماء كبار منهم زرياب في الأندلس."],
      ["a", "ما هو النصب التاريخي الشهير في بغداد الذي صممه النحات جواد سليم؟", "نصب الحرية في ساحة التحرير ببغداد، وهو جدارية برونزية سردية توثق تاريخ العراق الحديث بروح مستلهمة من النحت الرافديني."],
      ["a", "ما اسم المعمارية العراقية البريطانية التي أصبحت أول امرأة تفوز بجائزة بريتزكر العالمية للعمارة؟", "زها حديد، واشتهرت بتصاميمها الانسيابية الجريئة مثل مركز حيدر علييف ومبنى البنك المركزي العراقي."],
      ["a", "ما هو فن «الأوريغامي» (Origami) وأين نشأ وتطوّر؟", "فن طيّ الورق لتحويل ورقة مسطحة إلى مجسمات هندسية وفنية دون قص أو لصق، وازدهر بشكل خاص في اليابان."],
      ["a", "ما هي «المقامات الموسيقية» في الموسيقى الشرقية والعراقية؟", "سلالم ونماذج لحنية تقليدية تتضمن أرباع الأصوات وتمنح كل مقام طابعاً عاطفياً خاصاً، ومن أشهرها البيات والرست والحجاز والصبا."],
      ["a", "ما هو طراز العمارة القوطية الذي ميّز كاتدرائيات أوروبا في العصور الوسطى؟", "طراز يعتمد على الأقواس المدببة والأكتاف الطائرة والنوافذ الزجاجية الملونة الضخمة لإدخال أكبر قدر من الضوء."],
      ["a", "من هو الفنان الهولندي الذي رسم لوحة «ليلة النجوم» الشهيرة عام 1889م؟", "فنسنت فان غوخ، أحد أبرز رموز ما بعد الانطباعية في تاريخ الفن الحديث."],

      ["a", "بماذا تميزت المدرسة «الانطباعية» في الرسم خلال القرن التاسع عشر؟", "بالرسم في الهواء الطلق لالتقاط تأثير الضوء المتغير واللحظات العابرة بضربات فرشاة سريعة وواضحة، ومن أبرز روادها كلود مونيه."],

      ["a", "ما المقصود بتقنية «الكياروسكورو» (Chiaroscuro) في فن التصوير؟", "توظيف التباين القوي بين الضوء الساطع والظل الداكن لإبراز التجسيم الثلاثي وإضفاء عمق درامي على اللوحة، كما أبدع فيها كارافاجيو ورامبرانت."],
      ["a", "من هو الفنان التشكيلي العراقي الذي أسس «جماعة الرواد» وترك بصمة كبرى في الرسم العراقي المعاصر؟", "فائق حسن، واشتهر بتمكنه الاستثنائي في رسم الخيل العربية والبيئة الشعبية العراقية بتعبيرية لونية حيّة."],

      ["a", "ما هو «البريق المعدني» في فن الخزف الإسلامي الذي ابتُكر في العراق خلال القرن التاسع الميلادي؟", "تقنية طلاء خزفي تُكسب الأواني لمعاناً ذهنياً يشبه الذهب والفضة، وازدهرت في سامراء والبصرة وانتقلت منها إلى مصر والأندلس وأوروبا."],

      ["a", "ما هي الخدعة البصرية الهندسية المذهلة في تصميم «معبد البارثينون» الإغريقي؟", "صممه المعماريون بخطوط منحنية برقة وأعمدة منتفخة قليلاً في الوسط ومائلة للداخل بملليمترات محسوبة، لتعويض تشوّه العين البشرية وجعل المبنى يبدو مستقيماً ومتناغماً تماماً."],
      ["a", "ما أهمية «قصر الأخيضر» الأثري في محافظة كربلاء بالعراق في تاريخ العمارة؟", "تحفة نادرة من العمارة العباسية المبكرة في القرن الثامن الميلادي، تضم من أقدم النماذج الموثقة للأقواس المدببة والأسوار المحصنة والقباب التي أثّرت لاحقاً في العمارة الإسلامية والأوروبية."],
      ["a", "ما هو «تأثير كوليشوف» في فن المونتاج السينمائي؟", "تجربة أثبتت أن المشاهد يقرأ تعبير وجه الممثل الحيادي الواحد بحزن أو جوع أو حنان اعتماداً فقط على اللقطة التي تسبقه (تابوت، حساء، أو طفل)، مما أثبت قوة المونتاج في صناعة المعنى."],
      ["a", "ما هي أشهر لوحة مطبوعة في الفن الياباني «أوكييو-إه» ومن أبدعها؟", "«الموجة العظيمة قبالة كاناغاوا» للفنان كاتسوشيكا هوكوساي نحو عام 1831م، وتمزج ببراعة بين حركة البحر العارمة وسكون جبل فوجي في الخلفية بألوان النيلة البروسية."],
      ["a", "ما هي «السيمفونية» في الموسيقى الكلاسيكية وكم حركة تتألف منها تقليدياً؟", "عمل موسيقي ضخم يُؤلَّف لأوركسترا كاملة، ويتكوّن في صيغته الكلاسيكية من أربع حركات متباينة الإيقاع والمزاج (سريعة، ثم بطيئة، ثم راقصة، ثم ختامية حيوية)."],

      ["a", "ما هو «الكولوسيوم» في روما وما الابتكار المعماري الذي مكّن من بنائه؟", "أضخم مدرج روماني مفتوح في العالم (اكتمل عام 80م) ويتسع لنحو 50 ألف متفرج، واعتمد على الخرسانة الرومانية وشبكة متقنة من الأقواس والقباب والأبواب المرقّمة لتسهيل الدخول والخروج."],
      ["a", "ما هي أبرز سمات طراز «آرت ديكو» (Art Deco) الذي ساد التصميم والعمارة في عشرينيات وثلاثينيات القرن العشرين؟", "الخطوط الهندسية الجريئة والمتناظرة، والأشكال المتدرجة، واستخدام المعادن اللامعة كالكروم والزجاج لإبراز روح الحداثة والسرعة، كما في مبنى كرايسلر في نيويورك."],

    function esc(str) {
      return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    /**
     * تطبيع النصوص العربية للمقارنة ومنع التكرار الدقيق
     */
    function normalizeArabic(str) {
      return String(str || "")
        .trim()
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/[؟?!.،,:;؛«»"']/g, "")
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    function copyToClipboard(text, successMsg = "📋 تم النسخ إلى الحافظة!") {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg))
          .catch(() => fallbackCopy(text, successMsg));
        return;
      }
      fallbackCopy(text, successMsg);
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successMsg);
      } catch (e) {
        showToast("تعذر النسخ التلقائي");
      }
      document.body.removeChild(ta);
    }

    function getStreak() {

      return (state.lastStreakDay === t || state.lastStreakDay === t - 1) ? (state.streak || 0) : 0;

    // =========================================================================
    // 6. محرك المستويات التصاعدي، الرتب، السلسلة، المهام، الأوسمة، والاحتفال
    // =========================================================================
    function xpRequiredForLevel(level) {
      return Math.round((100 * Math.pow(Math.max(1, level), 1.5)) / 10) * 10;
    }

    function getRankForLevel(level) {
      return RANKS.find(r => level >= r.minLvl && level <= r.maxLvl) || RANKS[RANKS.length - 1];
    }

    function getLevelInfo(totalXp) {
      let xp = Math.max(0, Math.floor(Number(totalXp) || 0));
      let level = 1;
      let needed = xpRequiredForLevel(level);
      while (xp >= needed) {
        xp -= needed;
        level++;
        needed = xpRequiredForLevel(level);
      }
      const remaining = Math.max(0, needed - xp);
      const pct = Math.min(100, Math.round((xp / needed) * 100));
      return {
        level,
        currentLevelXp: xp,
        neededForNext: needed,
        remainingXp: remaining,
        pct,
        totalXp: Math.max(0, Math.floor(Number(totalXp) || 0)),
        rank: getRankForLevel(level)
      };
    }

    function getStreakMultiplier() {
      const st = getStreak();
      if (st >= 30) return { mult: 1.5, bonusPct: 50, label: "+50% XP", nextAt: null };
      if (st >= 14) return { mult: 1.3, bonusPct: 30, label: "+30% XP", nextAt: 30, nextPct: 50 };
      if (st >= 7)  return { mult: 1.2, bonusPct: 20, label: "+20% XP", nextAt: 14, nextPct: 30 };
      if (st >= 3)  return { mult: 1.1, bonusPct: 10, label: "+10% XP", nextAt: 7,  nextPct: 20 };
      return { mult: 1.0, bonusPct: 0, label: "", nextAt: 3, nextPct: 10 };
    }

    function touchDailyStreak() {
      const t = todayNum();
      if (state.lastStreakDay !== t) {
        state.streak = (state.lastStreakDay === t - 1) ? (state.streak || 0) + 1 : 1;
        state.lastStreakDay = t;
        if (state.streak > (state.bestStreak || 0)) {
          state.bestStreak = state.streak;
        }
      }
    }

    function playLevelUpChime() {
      if (!state.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          const start = ctx.currentTime + i * 0.09;
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.exponentialRampToValueAtTime(0.11, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.34);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.36);
        });
      } catch (e) {}
    }

    /**
     * الدالة المركزية لمنح نقاط الخبرة (تطبّق مضاعف السلسلة، وتسجل النشاط، وتطلق الترقية)
     */
    function awardXP(baseAmount, reason, { icon = "⭐", applyMultiplier = true, countActivity = true, touchStreak = true } = {}) {
      const base = Math.max(0, Math.round(baseAmount));
      if (base <= 0) return { base: 0, bonus: 0, total: 0, leveledUp: false };

      if (touchStreak) touchDailyStreak();

      const multInfo = applyMultiplier ? getStreakMultiplier() : { mult: 1, bonusPct: 0 };
      const total = Math.round(base * multInfo.mult);
      const bonus = total - base;

      const before = getLevelInfo(state.xp);
      state.xp += total;
      if (countActivity) state.totalActivities = (state.totalActivities || 0) + 1;

      // تسجيل النشاط في السجل (أحدث 40 نشاطاً)
      state.activityLog.unshift({
        ts: new Date().toISOString(),
        icon,
        reason,
        base,
        bonus,
        total
      });
      if (state.activityLog.length > 40) state.activityLog.length = 40;

      const after = getLevelInfo(state.xp);
      const leveledUp = after.level > before.level;

      checkNewAchievements(false);

      if (leveledUp) {
        showLevelUpModal(before.level, after.level);
      }

      return { base, bonus, total, leveledUp, newLevel: after.level };
    }

    function formatXpGainText(res) {
      if (!res || !res.total) return "";
      return res.bonus > 0 ? `+${res.total} XP (مضاعف السلسلة +${res.bonus})` : `+${res.total} XP`;
    }

    function closeLevelUpModal() {

    function showLevelUpModal(oldLvl, newLvl) {
      const root = document.getElementById("levelup-root");
      if (!root) return;

      const oldRank = getRankForLevel(oldLvl);
      const newRank = getRankForLevel(newLvl);

      const newAvatars = AVATARS.filter(a => a.reqLvl > oldLvl && a.reqLvl <= newLvl);

      let unlocksHtml = "";
      if (newSkins.length || newAvatars.length) {
        unlocksHtml = `

            ${newSkins.map(s => `<div style="font-size:0.86rem;margin-bottom:4px;">🎨 ثيم لوني جديد: <b>${s.icon} ${s.name}</b></div>`).join("")}
            ${newAvatars.map(a => `<div style="font-size:0.86rem;margin-bottom:4px;">🎭 أيقونة شخصية جديدة: <b>${a.icon} ${a.name}</b></div>`).join("")}
          </div>
        `;

    // =========================================================================
    // 6.ب نظام المهام اليومية (Daily Quests — 3 مهام تتجدد يومياً)
    // =========================================================================
    function ensureDailyQuests() {
      const t = todayNum();
      if (state.dailyQuests && state.dailyQuests.date === t && state.dailyQuests.items.length === 3) {
        return;
      }
      // اختيار 3 مهام متنوعة يومياً بشكل حتمي متجدد حسب اليوم
      const pool = QUEST_POOL.slice();
      const chosen = [];
      let seed = Math.abs(t * 2654435761) % 100000;
      while (chosen.length < 3 && pool.length) {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        const idx = seed % pool.length;
        const q = pool.splice(idx, 1)[0];
        chosen.push({ id: q.id, progress: 0, claimed: false });
      }
      state.dailyQuests = {
        date: t,
        items: chosen,
        bonusClaimed: false,
        viewedKeys: []
      };
      saveState();
    }

    function advanceQuest(questId, amount = 1) {
      ensureDailyQuests();
      const item = state.dailyQuests.items.find(q => q.id === questId);
      if (!item || item.claimed) return;
      const def = QUEST_POOL.find(d => d.id === questId);
      if (!def) return;
      const wasDone = item.progress >= def.target;
      item.progress = Math.min(def.target, item.progress + amount);
      if (!wasDone && item.progress >= def.target) {
        setTimeout(() => showToast(`🎯 أنجزت مهمة يومية: «${def.title}» — استلم مكافأتك من ملفي!`), 450);
      }
    }

    function getQuestsSummary() {
      ensureDailyQuests();
      let claimedCount = 0;
      let readyCount = 0;
      const enriched = state.dailyQuests.items.map(item => {
        const def = QUEST_POOL.find(d => d.id === item.id) || QUEST_POOL[0];
        const ready = !item.claimed && item.progress >= def.target;
        if (item.claimed) claimedCount++;
        if (ready) readyCount++;
        return { ...def, progress: item.progress, claimed: item.claimed, ready };
      });
      const bonusReady = claimedCount === 3 && !state.dailyQuests.bonusClaimed;
      return { items: enriched, claimedCount, readyCount, bonusReady, bonusClaimed: !!state.dailyQuests.bonusClaimed };
    }
