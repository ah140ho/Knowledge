      ["s", "ما الدليل الفلكي الأبرز على أن الكون في حالة توسع مستمر؟", "ظاهرة «الانزياح نحو الأحمر» لأطياف المجرات البعيدة، والتي رصدها إدوين هابل وأثبتت ابتعاد المجرات عن بعضها."],
      ["s", "لماذا تُعد البكتيريا المثبّتة للنيتروجين حيويةً لاستمرار الحياة والزراعة؟", "لأنها تحوّل غاز النيتروجين الجوي الخامل إلى مركبات قابلة للامتصاص تستفيد منها النباتات لبناء بروتيناتها."],
      ["s", "كيف يختلف الغرافيت الطري في قلم الرصاص عن الألماس الصلب رغم أنهما من الكربون النقي؟", "بسبب اختلاف الترتيب الهندسي لذرات الكربون (ظاهرة التآصل)؛ ففي الغرافيت تترتب في طبقات منزلقة، بينما تشكّل في الألماس شبكة ثلاثية الأبعاد متماسكة."],
      ["s", "ما الظاهرة التي تمكّن بعض الحشرات الخفيفة من المشي فوق سطح الماء دون أن تغرق؟", "التوتر السطحي، وهو تماسك جزيئات الماء على السطح بقوى تجاذب تكوّن ما يشبه غشاءً مرناً رقيقاً."],
      ["s", "ما السبب الرئيسي لحدوث ظاهرتي المدّ والجزر في البحار والمحيطات؟", "قوى الجاذبية التي يؤثر بها القمر (وبدرجة أقل الشمس) على الكتلة المائية للأرض أثناء دورانها."],
      ["s", "ما هي «سحابة أورت» في علم الفلك؟", "غلاف كروي نظري ضخم من الأجرام الجليدية يحيط بأطراف المجموعة الشمسية، ويُعتقد أنه المصدر الرئيسي للمذنبات طويلة الدورة."],
      ["s", "ما هو «قانون القصور الذاتي» (قانون نيوتن الأول)؟", "ينص على أن الجسم الساكن يبقى ساكناً والمتحرك بسرعة ثابتة في خط مستقيم يبقى كذلك ما لم تؤثر فيه قوة محصلة خارجية تغيّر حالته الحركية."],
      ["s", "كيف يفسّر «مبدأ برنولي» جانباً أساسياً من تحليق الطائرات؟", "كلما زادت سرعة تدفق المائع (كالهواء فوق السطح العلوي المقوّس لجناح الطائرة) انخفض ضغطه، فينشأ فرق ضغط بين أسفل الجناح وأعلاه يسهم في توليد قوة الرفع."],
      ["s", "ما هي «قوة كوريوليس» وكيف تؤثر في الأعاصير؟", "قوة ظاهرية تنشأ بسبب دوران الأرض حول محورها وتُحرّف مسار الرياح والتيارات البحرية؛ فتجعل الأعاصير تدور عكس عقارب الساعة في النصف الشمالي ومعها في الجنوبي."],
      ["s", "ما ظاهرة «الرنين الميكانيكي» التي أدت إلى انهيار جسر تاكوما الشهير عام 1940م؟", "تضخّم هائل في سعة اهتزاز جسم ما عندما يتطابق تردد القوة الخارجية المؤثرة فيه (مثل الرياح) مع التردد الطبيعي لاهتزازه."],
      ["s", "لماذا تزداد سرعة دوران المتزلج على الجليد عندما يضم ذراعيه إلى جسده؟", "بسبب قانون حفظ الزخم الزاوي؛ فتقليص المسافة بين الكتلة ومحور الدوران يقلل عزم القصور الذاتي، مما يُجبر سرعة الدوران على الازدياد تعويضاً لذلك."],
      ["s", "ما هي «سرعة الإفلات» من جاذبية كوكب الأرض؟", "الحد الأدنى للسرعة اللازمة لجسم كي يفلت نهائياً من مجال الجاذبية الأرضية دون دفع إضافي، وتبلغ نحو 11.2 كيلومتراً في الثانية."],
      ["s", "ما هو «تأثير ماغنوس» الذي يجعل كرة القدم تنحني في الهواء؟", "قوة جانبية تؤثر في كرة دوّارة أثناء طيرانها بسبب اختلاف سرعة الهواء وضغطه على جانبيها المتقابلين، مما يدفعها للانحراف عن مسارها المستقيم."],
      ["s", "كيف أثبتت تجربة «بندول فوكو» عام 1851م دوران الأرض حول نفسها؟", "أظهر البندول الطويل الثقيل أن مستوى تأرجحه يبدو وكأنه يدور ببطء على مدار اليوم، بينما الحقيقة أن البندول يحافظ على مستواه والأرض هي التي تدور تحته."],
      ["s", "ما المقصود بـ«السوائل غير النيوتونية» مثل مزيج النشاء والماء؟", "سوائل تتغير لزوجتها حسب مقدار القوة المسلطة عليها؛ فتتصرف كسائل عند اللمس اللطيف وتتصلب لحظياً كجسم صلب عند الصدم السريع."],
      ["s", "كيف يتيح «مبدأ باسكال» رفع سيارة ثقيلة بضغطة يد واحدة في المكبس الهيدروليكي؟", "لأن الضغط المسلّط على سائل محصور ينتقل بالتساوي إلى جميع أجزائه، فإذا انتقل من مكبس ضيق إلى مكبس أعرض تضاعفت القوة الخارجة بنسبة مساحة المكبسين."],
      ["s", "ما هي «نقاط لاغرانج» في الفيزياء الفلكية؟", "خمس نقاط توازن جاذبي في الفضاء بين جرمين كبيرين (كالشمس والأرض) يمكن لمركبة فضائية كـ«تلسكوب جيمس ويب» البقاء عندها بأقل استهلاك للوقود."],
      ["s", "ما هو «مبدأ الفعل الأقل» في الفيزياء النظرية؟", "مبدأ جوهري ينص على أن الطبيعة تختار دائماً المسار الذي يجعل كمية فيزيائية تُسمى «الفعل» في قيمتها الحرجة، ومنه تُشتق معظم قوانين الميكانيكا والكهرومغناطيسية والكم."],
      ["s", "ما الذي ينص عليه القانون الثاني للديناميكا الحرارية وما علاقته بـ«الإنتروبيا»؟", "ينص على أن الإنتروبيا (مقياس الفوضى أو تشتت الطاقة) في أي نظام معزول لا تنقص أبداً مع الزمن، وهو ما يحدد «سهم الزمن» ويفسر لماذا لا يعود الكوب المكسور سليماً تلقائياً."],
      ["s", "ما هي الطرق الثلاث لانتقال الحرارة في الفيزياء؟", "التوصيل (عبر تلامس المواد الصلبة)، والحمل الحراري (عبر حركة السوائل والغازات)، والإشعاع الكهرومغناطيسي (الطريقة الوحيدة التي تنتقل بها حرارة الشمس عبر فراغ الفضاء)."],
      ["s", "ما هي ظاهرة «الميوعة الفائقة» (Superfluidity)؟", "حالة كمومية غريبة للسوائل مثل الهيليوم-4 قرب الصفر المطلق تفقد فيها لزوجتها تماماً، فتتدفق دون احتكاك وتستطيع تسلق جدران الوعاء الذي يحتويها."],
      ["s", "ما هي «البلازما» التي تُعد الحالة الرابعة للمادة؟", "غاز شديد التأين تتحرر فيه الإلكترونات من ذراتها، وتمتاز بتوصيلها للكهرباء وتأثرها بالمجالات المغناطيسية، وتشكّل أكثر من 99% من المادة المرئية في الكون كالنجوم والبرق."],
      ["s", "ما هو «تكاثف بوز-أينشتاين» (الحالة الخامسة للمادة)؟", "حالة تنشأ عند تبريد سحابة من الذرات البوزونية لدرجة تقارب الصفر المطلق، فتفقد الذرات هويتها الفردية وتتصرف جميعها كموجة كمومية عملاقة واحدة."],
      ["s", "ما أهمية «دورة كارنو» في الديناميكا الحرارية؟", "تحدد الحد النظري الأقصى لكفاءة أي محرك حراري يعمل بين درجتي حرارة، وتثبت استحالة بناء محرك يحوّل الحرارة إلى شغل ميكانيكي بكفاءة 100%."],
      ["s", "ما هو «تأثير لايدنفروست» الذي يجعل قطرة الماء تنزلق وترقص على مقلاة شديدة السخونة؟", "عندما تتجاوز حرارة السطح نقطة الغليان بكثير، يتبخر أسفل القطرة فوراً مكوّناً وسادة بخار عازلة ترفع القطرة وتبطئ تبخرها الكامل."],
      ["s", "لماذا تُعد «السعة الحرارية النوعية» العالية للماء نعمة فيزيائية لمناخ الأرض؟", "لأن الماء يمتص ويخزّن كميات ضخمة من الحرارة دون أن ترتفع حرارته بسرعة، فتعمل المحيطات كمنظّم حراري يمنع التقلبات القاسية بين الليل والنهار والصيف والشتاء."],
      ["s", "ما المقصود بـ«النقطة الثلاثية» للماء في الفيزياء؟", "درجة الحرارة والضغط الفريدان (0.01 درجة مئوية وضغط 611.6 باسكال) اللذان يمكن للماء عندهما الوجود في الحالات الصلبة والسائلة والغازية في آنٍ واحد بتوازن تام."],
      ["s", "ما هو «تأثير مبيمبا» المثير للفضول في الفيزياء الحرارية؟", "ملاحظة تجريبية تُظهر أن الماء الساخن قد يتجمد أحياناً أسرع من الماء البارد تحت ظروف محددة نتيجة عوامل متداخلة مثل التبخر وتيارات الحمل وفوق التبريد."],
      ["s", "ما هو «الحث الكهرومغناطيسي» الذي اكتشفه مايكل فاراداي عام 1831م؟", "توليد تيار كهربائي في موصل نتيجة تغيّر المجال المغناطيسي المار عبره، وهو المبدأ الفيزيائي الذي تقوم عليه المولدات الكهربائية ومحطات الطاقة والمحولات."],
      ["s", "ما الإنجاز الثوري الذي حققته «معادلات ماكسويل» الأربع في القرن التاسع عشر؟", "وحّدت الكهرباء والمغناطيسية في نظرية واحدة وأثبتت أن الضوء نفسه ليس إلا موجة كهرومغناطيسية تسير بسرعة ثابتة في الفراغ."],
      ["s", "كيف يحمي «قفص فاراداي» ركاب السيارة أو الطائرة عند تعرضها لصاعقة برق؟", "لأن الهيكل المعدني الموصل يوزّع الشحنات الكهربائية على سطحه الخارجي فقط ويلغي المجال الكهربائي في الداخل، فتمر الصاعقة حول الركاب دون أن تصيبهم."],
      ["s", "ما هو «استقطاب الضوء» وكيف تستفيد منه النظارات الشمسية؟", "توجيه اهتزاز موجات الضوء المستعرضة في مستوى واحد فقط؛ فتحجب النظارات المستقطبة الوهج المنعكس أفقياً عن الطرق والمياه بينما تسمح للضوء المفيد بالمرور."],
      ["s", "ما ظاهرة «التداخل الضوئي» التي تمنح فقاعات الصابون وريش الطاووس ألوانها القزحية؟", "تراكب موجات الضوء المنعكسة عن السطحين الخارجي والداخلي لطبقة رقيقة جداً؛ فيتقوّى بعض الأطوال الموجية ويلغي بعضها الآخر لتظهر ألوان متغيرة حسب زاوية النظر."],
      ["s", "ما الذي كشفته «تجربة الشق المزدوج» الشهيرة في فيزياء الكم؟", "أثبتت أن الجسيمات كالفوتونات والإلكترونات تسلك سلوك الموجات وتنتج نمط تداخل عندما لا تُراقَب، لكنها تتصرف كجسيمات محددة بمجرد قياس أي شق عبرت منه."],
      ["s", "ما هو «التأثير الكهروضوئي» الذي نال عنه ألبرت أينشتاين جائزة نوبل في الفيزياء عام 1921م؟", "انبعاث إلكترونات من سطح معدن عند سقوط ضوء بتردد كافٍ عليه، وقد فسّره أينشتاين بأن الضوء يتألف من حزم طاقة كمومية (فوتونات) لا مجرد موجة مستمرة."],
      ["s", "كيف يختلف ضوء «الليزر» عن ضوء المصباح العادي فيزيائياً؟", "ضوء الليزر مترابط الطور وأحادي اللون وعالي الاتجاهية وينتج عبر «الانبعاث المحفّز»، بينما ضوء المصباح عشوائي الاتجاه ويتكوّن من أطوال موجية متفرقة."],
      ["s", "ما هي «الموجات الموقوفة» وكيف تصدر الأوتار الموسيقية نغماتها؟", "موجات تنشأ من تداخل موجتين متماثلتين تسيران باتجاهين متعاكسين على وتر مشدود، فتتشكل عقد ساكنة وبطون مهتزة تحدد التردد الأساسي للنغمة وتوافقياتها."],
      ["s", "ما هو «التأثير الكهروضغطي» (البيزوكهربائي) المستخدم في ساعات الكوارتز والقداحات؟", "قدرة بعض البلورات مثل الكوارتز على توليد شحنة كهربائية عند ضغطها ميكانيكياً، وبالعكس تهتز بدقة فائقة عند تطبيق جهد كهربائي عليها."],
      ["s", "كيف يتشكّل «قوس قزح» فيزيائياً في السماء بعد المطر؟", "ينكسر ضوء الشمس عند دخوله قطرة المطر فيتشتت لألوان الطيف، ثم ينعكس داخلياً عن جدارها الخلفي وينكسر مجدداً عند خروجه بزاوية تقارب 42 درجة للضوء الأحمر."],
      ["s", "ما هو «تأثير هول» (Hall Effect) في الفيزياء الكهربائية؟", "نشوء فرق جهد كهربائي عرضي عبر موصل يسري فيه تيار عند وضعه داخل مجال مغناطيسي عمودي، ويُستخدم لقياس شدة المجالات المغناطيسية ونوع حاملات الشحنة."],
      ["s", "لماذا تتطلب أقمار نظام الملاحة (GPS) تصحيحات يومية من نظريتي النسبية الخاصة والعامة؟", "لأن ساعاتها الذرية تبطئ بسبب سرعتها المدارية (النسبية الخاصة) وتسرع بسبب ضعف الجاذبية في الفضاء (النسبية العامة)، وبمحصلة 38 ميكروثانية يومياً كان سيحدث خطأ بنحو 11 كم كل يوم لولا التصحيح."],
      ["s", "ما المقصود بـ«تمدد الزمن» في النظرية النسبية الخاصة؟", "أن الزمن ليس مطلقاً بل يتباطأ بالنسبة لمراقب يتحرك بسرعة عالية تقترب من سرعة الضوء مقارنةً بمراقب ساكن، وقد أُثبت ذلك تجريبياً بالساعات الذرية وجسيمات الميون."],
      ["s", "ماذا تعني معادلة أينشتاين الشهيرة E = mc²؟", "أن الكتلة والطاقة وجهان لعملة واحدة ويمكن تحول إحداهما إلى الأخرى؛ وبسبب ضخامة مربع سرعة الضوء فإن كتلة ضئيلة جداً تكافئ طاقة هائلة."],
      ["s", "كيف فسّرت النسبية العامة الجاذبية بشكل يختلف جذرياً عن تصور نيوتن؟", "اعتبرت الجاذبية ليست قوة شد خفية عن بُعد، بل نتيجة هندسية لانحناء نسيج الزمكان بسبب وجود الكتلة والطاقة، فالأجرام تتبع أقصر مسار ممكن في هذا النسيج المنحني."],
      ["s", "ما هي ظاهرة «عدسة الجاذبية» في علم الفلك؟", "انحناء مسار الضوء القادم من مجرات بعيدة عند مروره قرب كتلة هائلة (كعنقود مجري)، فتعمل الجاذبية كعدسة كونية تكبّر وتشوّه صورة المجرة الخلفية."],
      ["s", "ما هي «موجات الجاذبية» التي رصدها مرصد «ليغو» (LIGO) لأول مرة عام 2015م؟", "تموجات دقيقة في نسيج الزمكان نفسه تنتشر بسرعة الضوء نتيجة أحداث كونية عنيفة كاندماج ثقبين أسودين أو نجمين نيوترونيين."],
      ["s", "ما هو «إشعاع هوكينغ» المرتبط بالثقوب السوداء؟", "إشعاع حراري كمومي تنبأ ستيفن هوكينغ بانبعاثه عند أفق حدث الثقب الأسود نتيجة التقلبات الكمومية للفراغ، مما يؤدي إلى تبخر الثقوب السوداء ببطء شديد عبر أزمنة هائلة."],
      ["s", "ما هو «إشعاع الخلفية الكونية الميكروي» (CMB)؟", "أقدم ضوء في الكون انبعث بعد نحو 380 ألف سنة من الانفجار العظيم، وتمدد طوله الموجي مع توسع الكون ليصبح إشعاعاً ميكروياً بارداً يملأ الفضاء ويُعد أقوى دليل على الانفجار العظيم."],
      ["s", "ما الفرق بين «المادة المظلمة» و«الطاقة المظلمة» في علم الكونيات؟", "المادة المظلمة (نحو 27% من الكون) تمارس جاذبية تمسك المجرات معاً دون أن تبعث ضوءاً، بينما الطاقة المظلمة (نحو 68%) قوة غامضة تدفع الكون للتوسع المتسارع."],
      ["s", "ما هو «حد تشاندراسيخار» في الفيزياء الفلكية؟", "الكتلة القصوى التي يمكن لنجم قزم أبيض أن يتحملها دون الانهيار تحت جاذبيته (نحو 1.4 ضعف كتلة الشمس)، وإذا تجاوزها ينفجر كمستعر أعظم أو ينهار لنجم نيوتروني."],
      ["s", "ما هي «النجوم النابضة» (Pulsars) ولماذا تُشبّه بمنارات الفضاء؟", "نجوم نيوترونية شديدة المغناطيسية تدور حول نفسها بسرعة مذهلة مطلقةً حزماً إشعاعية من قطبيها تمر بالأرض بنبضات منتظمة بدقة تنافس الساعات الذرية."],
      ["s", "ما هي «الكوازارات» (أشباه النجوم)؟", "أنوية مجرات نشطة وبعيدة للغاية تغذّيها ثقوب سوداء فائقة الكتلة، فتسخن المادة المتساقطة نحوها لتصبح ألمع الأجرام المستمرة في الكون وتفوق سطوع مجرة كاملة."],
      ["s", "ما هي «مفارقة أولبرز» ولماذا تبدو سماء الليل مظلمة رغم وجود تريليونات النجوم؟", "لو كان الكون لانهائياً في العمر والحجم وساكناً لكانت السماء مضيئة بالكامل؛ لكن ظلمة الليل تثبت أن للكون عمراً محدوداً وأنه يتوسع فيُزاح ضوء المجرات البعيدة خارج الطيف المرئي."],
      ["s", "من أين نشأت معظم العناصر الثقيلة كالذهب والبلاتين الموجودة على الأرض؟", "من تصادمات عنيفة بين النجوم النيوترونية تُعرف بانفجارات «الكيلونوفا»، إذ لا تكفي حرارة النجوم العادية لتخليق هذه العناصر الثقيلة."],
      ["s", "ما هو «إشعاع شيرينكوف» الذي يُكسب قلب المفاعلات النووية المغمورة بالماء توهجاً أزرق؟", "ضوء أزرق ينبعث عندما يتحرك جسيم مشحون (كالإلكترون) داخل وسط شفاف كالماء بسرعة أكبر من سرعة الضوء داخل ذلك الوسط، وهو النظير الضوئي لحاجز الصوت."],
      ["s", "ما هي ظاهرة «التشابك الكمومي» التي وصفها أينشتاين بالفعل الشبحي عن بُعد؟", "ارتباط كمومي بين جسيمين بحيث تتحدد حالة أحدهما فورياً بمجرد قياس حالة الآخر مهما بلغت المسافة الفاصلة بينهما، وقد أُثبتت تجريبياً وأسّست لتقنيات التشفير الكمومي."],
      ["s", "ما هي ظاهرة «النفق الكمومي» (Quantum Tunneling) وكيف تضيء بها الشمس؟", "قدرة الجسيمات دون الذرية على اختراق حاجز طاقة لا تستطيع تجاوزه وفق الفيزياء الكلاسيكية؛ ولولاها لما اندمجت البروتونات في نواة الشمس ولما عملت ذاكرة الفلاش في هاتفك."],
      ["s", "ما هو «مبدأ باولي للاستبعاد» ولماذا يمنعنا من الاختراق عبر الأرض الصلبة؟", "مبدأ كمومي ينص على استحالة وجود إلكترونين متماثلين في الحالة الكمومية نفسها داخل الذرة؛ وهو ما يمنح الذرات حجمها وبنيتها الكيميائية ويمنع المادة من الانهيار."],
      ["s", "ما المغزى الحقيقي من تجربة «قطة شرودنغر» الفكرية في فيزياء الكم؟", "صاغها إرفين شرودنغر لإبراز غرابة تعميم «التراكب الكمومي» من العالم الذري إلى الأجسام اليومية، حيث تبدو القطة نظرياً حية وميتة معاً حتى لحظة الرصد والقياس."],
      ["s", "ما أهمية اكتشاف «بوزون هيغز» في مصادم الهادرونات الكبير عام 2012م؟", "أثبت وجود «مجال هيغز» الذي يملأ الكون بأسره؛ ومن خلال تفاعل الجسيمات الأولية مع هذا المجال تكتسب كتلتها، ولولاه لبقيت الجسيمات تتحرك بسرعة الضوء دون تكوين ذرات."],
      ["s", "ما هي القوى الأساسية الأربع التي تحكم جميع الظواهر في الكون؟", "القوة النووية القوية (تربط النواة)، والقوة الكهرومغناطيسية، والقوة النووية الضعيفة (مسؤولة عن التحلل الإشعاعي)، والجاذبية (الأضعف على المستوى الذري لكنها تحكم الكون الكبير)."],
      ["s", "ممّ يتكوّن البروتون والنيوترون في داخل نواة الذرة؟", "يتكوّن كل منهما من ثلاثة جسيمات أولية تُسمى «الكواركات» تربطها معاً بقوة هائلة جسيمات ناقلة للقوة النووية القوية تُدعى «الغلوونات»."],
      ["s", "ما هي «المادة المضادة» وماذا يحدث عند التقائها بالمادة العادية؟", "جسيمات لها نفس كتلة جسيمات المادة العادية لكن بشحنة كهربائية معاكسة (كالبوزيترون المضاد للإلكترون)، وعند التقائهما يفنيان بعضهما تماماً متحولَين إلى طاقة إشعاعية خالصة."],
      ["s", "ما هي «النيوترينوات» ولماذا تُلقّب بالجسيمات الشبحية؟", "جسيمات أولية متعادلة الشحنة وشديدة الضآلة في الكتلة، تمر تريليونات منها عبر جسمك كل ثانية قادمة من الشمس وتخترق كوكب الأرض بأكمله دون أن تتصادم مع ذراته غالباً."],
      ["s", "ما الفرق بين «الفيرميونات» و«البوزونات» في فيزياء الجسيمات؟", "الفيرميونات (كالإلكترونات والكواركات) هي لبنات المادة وتخضع لمبدأ الاستبعاد، أما البوزونات (كالفوتونات والغلوونات) فهي ناقلات القوى ويمكن تكديس أي عدد منها في الحالة الكمومية نفسها."],
      ["s", "ما هو «تأثير كازيمير» الذي يثبت أن الفراغ الكوني ليس خالياً تماماً؟", "قوة تجاذب ضئيلة تنشأ بين لوحين معدنيين متقاربين جداً في الفراغ التام بسبب التقلبات الكمومية للمجال الكهرومغناطيسي في الفراغ."],
      ["s", "ما هو «عمر النصف» الإشعاعي وكيف يُستخدم في التأريخ بالكربون-14؟", "الزمن اللازم لتحلل نصف عدد الذرات المشعة في عينة ما؛ وبقياس ما تبقى من الكربون-14 (عمر نصفه 5730 عاماً) في البقايا العضوية يحدد العلماء عمر الآثار بدقة."],
      ["s", "ما الفرق بين «الانشطار النووي» و«الاندماج النووي»؟", "الانشطار هو تقسيم نواة ذرية ثقيلة كاليورانيوم إلى نواتين أخف مع إطلاق طاقة (كما في المفاعلات الحالية)، أما الاندماج فهو دمج نواتين خفيفتين كالهيدروجين لإطلاق طاقة أكبر بكثير ونفايات أقل."],
      ["s", "ما هي «مبرهنة نويثر» التي تُعد من أجمل النظريات في تاريخ الفيزياء؟", "أثبتت عالمة الرياضيات إيمي نويثر أن كل تناظر مستمر في قوانين الطبيعة يقابله قانون حفظ؛ فتناظر الزمن يفرض حفظ الطاقة، وتناظر المكان يفرض حفظ الزخم."],
      ["s", "ما المقصود بـ«اللف المغزلي» (Spin) للإلكترون في فيزياء الكم؟", "خاصية كمومية جوهرية للجسيمات تشبه الزخم الزاوي الذاتي دون أن تعني دوراناً ميكانيكياً فعلياً كالكرة، وهي المسؤولة عن الخواص المغناطيسية للمواد وتقنية الرنين المغناطيسي."],
      ["s", "ما هي «نظرية الفوضى» (Chaos Theory) في الفيزياء؟", "دراسة الأنظمة الحتمية الحساسة جداً لشروطها الابتدائية (مثل الطقس والبندول المزدوج)، حيث يؤدي تغيّر ضئيل جداً في البداية إلى نتائج مختلفة جذرياً يصعب التنبؤ بها طويل الأمد."],
      ["s", "ما هي «كارثة الأشعة فوق البنفسجية» التي أطلقت ثورة فيزياء الكم عام 1900م؟", "فشل الفيزياء الكلاسيكية في تفسير إشعاع الأجسام الساخنة (إشعاع الجسم الأسود)، فحلّها ماكس بلانك بافتراض أن الطاقة تنبعث وتمتص في حزم منفصلة تُسمى «الكمّات»."],
      ["s", "ما هي «ظاهرة كومبتون» ولماذا كانت حاسمة في فهم طبيعة الضوء؟", "تشتت الأشعة السينية عند اصطدامها بالإلكترونات مع زيادة طولها الموجي، ما أثبت تجريبياً أن الفوتون يمتلك زخماً حركياً مثل الجسيمات رغم أن كتلته السكونية صفر."],
      ["s", "كيف تستطيع تقنية «التبريد بالليزر» تبريد الذرات إلى أجزاء من المليون من الدرجة فوق الصفر المطلق؟", "بتوجيه حزم ليزر مضبوطة التردد تصطدم بالذرات المتحركة نحوها فتبطئ سرعتها تدريجياً بفضل تأثير دوبلر وتخفض طاقتها الحرارية إلى أدنى حد ممكن."],
      ["s", "ما هي «القوة النابذة» (الطاردة عن المركز) ولماذا يسميها الفيزيائيون قوةً وهمية؟", "إحساس بالدفع نحو الخارج عند الانعطاف السريع؛ وهي في الحقيقة ليست قوة مستقلة بل نتيجة قصور جسمك الذاتي الذي يميل لمواصلة الحركة في خط مستقيم بينما تدور المركبة تحته."],
      ["s", "لماذا ينفجر بالون مملوء بالهواء عند ارتفاعه الشديد في الغلاف الجوي؟", "بسبب «قانون بويل»؛ فمع انخفاض الضغط الجوي الخارجي كلما ارتفعنا، يتمدد الغاز المحصور داخل البالون ويزداد حجمه حتى يتجاوز قدرة المطاط على التحمل."],
      ["s", "ما الفرق الفيزيائي الدقيق بين «الكتلة» و«الوزن»؟", "الكتلة هي مقدار ما يحويه الجسم من مادة وتبقى ثابتة في أي مكان في الكون وتُقاس بالكيلوغرام، بينما الوزن هو قوة جذب الجاذبية لهذه الكتلة ويُقاس بالنيوتن ويتغير بين الأرض والقمر."],
      ["s", "ما الذي يسبب «الحاجز الصوتي» والدوي الانفجاري للطائرات الأسرع من الصوت؟", "عندما تتجاوز الطائرة سرعة الصوت تتراكم موجات الضغط أمامها وتندمج في موجة صدمة مخروطية حادة تُسمع على الأرض كدويّ انفجار عند مرورها."],
      ["s", "ما هو «تأثير مايسنر» الذي يتيح للقطارات المغناطيسية الطفو في الهواء؟", "خاصية للموصلات الفائقة تجعلها تطرد المجالات المغناطيسية تماماً من داخلها، ما يولّد قوة تنافر مستقرة تجعل المغناطيس يطفو معلقاً فوقها دون تلامس."],
      ["s", "لماذا نرى البرق قبل أن نسمع صوت الرعد رغم حدوثهما معاً؟", "لأن سرعة الضوء (نحو 300 ألف كم/ث) تفوق سرعة الصوت في الهواء (نحو 343 م/ث) بقرابة مليون مرة؛ وكل 3 ثوانٍ فاصلة بينهما تعني أن العاصفة تبعد قرابة كيلومتر واحد."],
      ["s", "ما هي «مفارقة التوأم» الشهيرة في النسبية الخاصة؟", "لو سافر أحد توأمين في مركبة فضائية بسرعة قريبة من سرعة الضوء ثم عاد إلى الأرض، سيجد نفسه أصغر سناً من توأمه الذي بقي على الأرض لأن التسارع والانقلاب في رحلته يكسران التماثل بينهما."],
      ["s", "كيف تحفظ الدراجة الهوائية توازنها عند السير أسهل بكثير من وقوفها؟", "بفضل مزيج من «الأثر الجيروسكوبي» لدوران العجلات، وهندسة المقود (تأثير الكاستر) التي تجعل العجلة الأمامية تميل تلقائياً نحو جهة السقوط لتصحيح المسار."],
      ["s", "ما هو «الزخم» (كمية الحركة) في الفيزياء ولماذا يصعب إيقاف شاحنة بطيئة أكثر من دراجة سريعة؟", "الزخم هو حاصل ضرب كتلة الجسم في سرعته؛ ولأن كتلة الشاحنة هائلة فإن زخمها كبير جداً ويتطلب قوة كبح أكبر أو زمناً أطول لتغييره."],
      ["s", "ما ظاهرة «الانكسار الضوئي» ولماذا تبدو الملعقة مكسورة داخل كوب ماء؟", "تغيّر اتجاه شعاع الضوء عند انتقاله مائلاً بين وسطين مختلفين في الكثافة الضوئية (كالهواء والماء) بسبب تغيّر سرعة الضوء داخل كل وسط."],
      ["s", "ما هو «قانون كولوم» في الكهرباء الساكنة؟", "ينص على أن القوة الكهربائية (التجاذب أو التنافر) بين شحنتين تتناسب طردياً مع حاصل ضربهما وعكسياً مع مربع المسافة الفاصلة بينهما، بصيغة تشبه قانون الجذب العام لنيوتن."],
      ["s", "ما المقصود بـ«الحيود» (Diffraction) في الفيزياء الموجية ولماذا نسمع صوت شخص خلف جدار دون أن نراه؟", "انحناء الموجات والتفافها حول الحواف والعوائق؛ وبما أن الطول الموجي للصوت مقارب لحجم الأبواب والجدران فإنه يحيد حولها بسهولة، بخلاف الضوء ذي الطول الموجي بالغ الصغر."],
      ["s", "كم تستغرق أشعة الشمس لتصل إلى الأرض؟", "تستغرق نحو 8 دقائق و20 ثانية لتقطع مسافة 150 مليون كيلومتر بسرعة الضوء، مما يعني أننا نرى الشمس كما كانت قبل 8 دقائق."],
      ["s", "لماذا تبدو السماء زرقاء في النهار؟", "بسبب ظاهرة «تشتت رايلي»؛ إذ يشتّت الغلاف الجوي الضوء الأزرق الأقصر موجةً في كل الاتجاهات أكثر من بقية الألوان."],
      ["s", "ما أكثر الغازات وفرة في الغلاف الجوي للأرض؟", "النيتروجين بنسبة تقارب 78%، يليه الأكسجين بنسبة 21%، وتشكل غازات مثل الأرغون وثاني أكسيد الكربون النسبة المتبقية."],
      ["s", "كم قلباً للأخطبوط وكيف تعمل؟", "يمتلك الأخطبوط ثلاثة قلوب: قلبان يضخّان الدم إلى الخياشيم لامتصاص الأكسجين، وقلب ثالث يضخّه لبقية الجسم ويتوقف مؤقتاً أثناء السباحة."],
      ["s", "ما أكبر كوكب في المجموعة الشمسية؟", "المشتري؛ وهو عملاق غازي يتسع حجمه لأكثر من 1,300 كوكب بحجم الأرض، وتفوق كتلته ضعف كتلة جميع الكواكب الأخرى مجتمعة."],
      ["s", "لماذا يظهر القمر لنا بالوجه نفسه دائماً؟", "بسبب التقييد المدي؛ حيث يتساوى زمن دوران القمر حول نفسه مع زمن دورانه حول الأرض (نحو 27.3 يوماً)."],
      ["s", "ما أصلب مادة طبيعية معروفة على الأرض؟", "الألماس؛ وهو شكل نقي من الكربون تترتب ذراته في شبكة بلورية رباعية بالغة التماسك تحت ضغط وحرارة هائلين."],
      ["s", "كم عظمة في جسم الإنسان البالغ مقارنةً بالرضيع؟", "يمتلك البالغ 206 عظمات، بينما يولد الطفل بنحو 270 عظمة تلتحم تدريجياً مع النمو لتكوين هيكل عظمي متين."],
      ["s", "ما الرمز الكيميائي للذهب ومن أين جاء؟", "رمزه Au، مشتق من الكلمة اللاتينية «Aurum» التي تعني الفجر المشرق، ويتميز بندرته ومقاومته للتآكل والصدأ."],
      ["s", "ما هو الحمض النووي (DNA)؟", "جزيء حيوي يحمل التعليمات الوراثية الكاملة للكائن الحي، ويتخذ تركيبه شكل حلزون مزدوج يحفظ الشيفرة الجينية."],
      ["s", "من وضع قوانين الحركة والجاذبية الكونية؟", "العالم الإنجليزي إسحاق نيوتن في كتابه «المبادئ الرياضية» عام 1687م، ليؤسس الفيزياء الكلاسيكية."],
      ["s", "ما أسرع شيء في الكون؟", "الضوء في الفراغ بسرعة تقارب 299,792 كيلومتراً في الثانية، وهو الحد الأقصى للسرعة وفقاً للنظرية النسبية."],
      ["s", "كيف تصنع النباتات غذاءها؟", "بالبناء الضوئي؛ إذ تمتص مادة الكلوروفيل طاقة الشمس لتحويل الماء وثاني أكسيد الكربون إلى سكر الجلوكوز وتطلق الأكسجين."],
      ["s", "لماذا نرى البرق قبل أن نسمع الرعد؟", "لأن سرعة الضوء تفوق سرعة الصوت بنحو مليون مرة؛ فكل 3 ثوانٍ بينهما تعني أن العاصفة تبعد قرابة كيلومتر واحد."],
      ["s", "ما أقرب نجم إلى الأرض بعد الشمس؟", "نجم «بروكسيما قنطورس» (قنطورس الأقرب)، وهو قزم أحمر يبعد عنا نحو 4.24 سنة ضوئية."],
      ["s", "ما أكبر عضو في جسم الإنسان؟", "الجلد؛ يشكّل نحو 15% من وزن الجسم وتبلغ مساحته قرابة مترين مربعين، ويحمي الجسم وينظّم حرارته."],
      ["s", "كم كوكباً في المجموعة الشمسية وماذا حدث لبلوتو؟", "ثمانية كواكب رسمية؛ وقد أُعيد تصنيف بلوتو كوكباً قزماً عام 2006م لأنه لا يُخلي مداره من الأجرام المجاورة."],
      ["s", "ما الذي يسبب ظاهرتَي المدّ والجزر؟", "قوة جاذبية القمر التي تجذب مياه المحيطات نحوها، وبدرجة أقل جاذبية الشمس."],
      ["s", "ما أسرع حيوان بري على وجه الأرض؟", "الفهد الصياد (الشيتا)؛ ينطلق من السكون إلى أكثر من 100 كم/ساعة خلال ثلاث ثوانٍ لمسافات قصيرة."],
      ["s", "كم عدد أسنان الإنسان البالغ؟", "32 سناً دائماً (بما فيها أضراس العقل الأربعة)، مقابل 20 سناً لبنياً في مرحلة الطفولة."],
      ["s", "ما أطول أجزاء الجهاز الهضمي في الإنسان؟", "الأمعاء الدقيقة؛ يبلغ طولها نحو 6 أمتار، وتتم فيها معظم عملية هضم الطعام وامتصاص العناصر الغذائية."],
      ["s", "لماذا نشعر بالدوار بعد الدوران السريع؟", "لأن السائل داخل الأذن الداخلية يستمر في الحركة بفعل القصور الذاتي بعد توقفنا، فيرسل إشارات حركة خاطئة للدماغ."],
      ["s", "ما درجة غليان الماء عند مستوى سطح البحر؟", "100 درجة مئوية عند الضغط الجوي القياسي، وتنخفض هذه الدرجة فوق قمم الجبال العالية لانخفاض الضغط."],
      ["s", "ما أخف وأبسط عنصر في الجدول الدوري؟", "الهيدروجين (H)؛ تتكون ذرته من بروتون واحد وإلكترون واحد، وهو الوقود الأساسي للنجوم وأكثر العناصر وفرة في الكون."],
      ["s", "ما أصل الكهرباء الساكنة؟", "تراكم غير متوازن للشحنات الكهربائية على سطح مادة نتيجة الاحتكاك، كما يحدث عند فرك بالون بالشعر."],
      ["s", "ما الحمض القوي الموجود في المعدة؟", "حمض الهيدروكلوريك (HCl)؛ يساعد في تفكيك الطعام وقتل الجراثيم، وتحمي المعدة نفسها منه بغشاء مخاطي متجدد."],
      ["s", "كم يستغرق ضوء القمر ليصل إلى الأرض؟", "نحو 1.3 ثانية فقط، لكون متوسط المسافة بين الأرض والقمر يقارب 384,400 كيلومتر."],
      ["s", "ما الكواكب العملاقة الغازية والجليدية في مجموعتنا الشمسية؟", "أربعة كواكب خارجية: المشتري وزحل (غازيان)، وأورانوس ونبتون (جليديان غنيان بالماء والميثان)."],
      ["s", "ما التركيب الكيميائي لملح الطعام؟", "كلوريد الصوديوم (NaCl)، وهو مركب أيوني يتكوّن من اتحاد عنصر الصوديوم مع غاز الكلور."],
      ["s", "ما السبب الحقيقي لتعاقب الفصول الأربعة؟", "ميل محور دوران الأرض بزاوية 23.5 درجة أثناء دورانها حول الشمس، وليس قربها أو بُعدها عن الشمس."],
      ["s", "كم عدد الكروموسومات في الخلية البشرية الطبيعية؟", "46 كروموسوماً مرتبة في 23 زوجاً، يرث الإنسان نصفها من الأم والنصف الآخر من الأب."],
      ["s", "ما أبرد درجة حرارة ممكنة في الفيزياء؟", "الصفر المطلق، ويعادل −273.15 درجة مئوية (صفر كلفن)، حيث تبلغ الطاقة الحرارية للذرات أدنى حد نظري."],
      ["s", "ما المجرة التي تقع فيها مجموعتنا الشمسية؟", "مجرة «درب التبانة»؛ وهي مجرة حلزونية ضلعية يقدّر قطرها بنحو 100 ألف سنة ضوئية وتضم مئات المليارات من النجوم."],
      ["s", "ما أكبر حيوان عاش على الأرض على الإطلاق؟", "الحوت الأزرق؛ قد يصل طوله إلى 30 متراً ووزنه إلى 180 طناً، ويزن قلبه وحده قرابة سيارة صغيرة."],
      ["s", "ما العنصران الأكثر وفرة في القشرة الأرضية؟", "الأكسجين (نحو 46%) يليه السيليكون (نحو 28%)، ويشكّلان معاً معادن السيليكات التي تبني معظم صخور الأرض."],
      ["s", "ما أصغر وحدة في العنصر تحتفظ بخصائصه الكيميائية؟", "الذرة؛ وتتكون من نواة بها بروتونات ونيوترونات وتدور حولها سحابة من الإلكترونات."],
      ["s", "ما الذي يجعل الدم أحمر اللون؟", "بروتين الهيموغلوبين في كريات الدم الحمراء لاحتوائه على ذرات الحديد التي ترتبط بالأكسجين."],
      ["s", "كم يبلغ عمر كوكب الأرض تقريباً؟", "نحو 4.54 مليار سنة، وفقاً للتأريخ الإشعاعي لأقدم النيازك والصخور الأرضية والقمرية."],
      ["s", "ما هو الكوكب الأحمر؟", "المريخ؛ وسُمّي بذلك بسبب الانتشار الواسع لغبار أكسيد الحديد (الصدأ) على سطحه وفي غلافه الجوي الرقيق."],
      ["s", "ما أقرب كوكب إلى الشمس؟", "عطارد؛ يُتم دورته حول الشمس في 88 يوماً أرضياً فقط، لكن الزهرة أشد منه حرارةً لغلافه الجوي الكثيف."],
      ["s", "من اكتشف البنسلين وكيف غيّر الطب؟", "ألكسندر فليمنغ عام 1928م حين لاحظ أن فطراً يمنع نمو البكتيريا، ففتح عصر المضادات الحيوية وأنقذ مئات الملايين."],
      ["s", "ما سبب ظاهرة الاحتباس الحراري؟", "تراكم غازات دفيئة مثل ثاني أكسيد الكربون والميثان في الغلاف الجوي مما يحبس جزءاً من حرارة الشمس."],
      ["s", "من هو ألبرت أينشتاين وما أبرز إنجازاته؟", "عالم فيزياء صاغ النظريتين النسبيتين ومعادلة (E=mc²)، ونال جائزة نوبل عام 1921م عن تفسير التأثير الكهروضوئي."],
      ["s", "لماذا يطفو الجليد فوق الماء السائل؟", "لأن جزيئات الماء عند التجمّد تنتظم في شبكة بلورية مفتوحة أقل كثافة من الماء السائل بنحو 9%، مما يحمي الحياة البحرية."],
      ["s", "ما هي السنة الضوئية؟", "وحدة قياس للمسافة تساوي المسافة التي يقطعها الضوء خلال سنة كاملة، أي نحو 9.46 تريليون كيلومتر."],
      ["s", "ما هو «التلألؤ الحيوي» (Bioluminescence) في الكائنات البحرية؟", "قدرة بعض الكائنات مثل قناديل البحر واليراع على إنتاج الضوء كيميائياً عبر تفاعل مادة اللوسيفيرين مع الأكسجين بمساعدة إنزيم اللوسيفراز."],
      ["s", "ما هي ظاهرة «الأسموزية» (التناضح) في الكيمياء والأحياء؟", "انتقال جزيئات المذيب كالماء عبر غشاء شبه منفذ من الوسط الأقل تركيزاً بالأملاح إلى الوسط الأعلى تركيزاً لتحقيق التوازن."],
      ["s", "ما المقصود بـ«التطور المتقارب» (Convergent Evolution) في علم الأحياء؟", "تطوّر صفات متشابهة لدى كائنات غير متقاربة وراثياً نتيجة تكيّفها مع بيئات متماثلة، مثل أجنحة الطيور والخفافيش."],
      ["s", "ما هي «دورة الكربون» في الطبيعة؟", "العملية المستمرة التي ينتقل فيها الكربون بين الغلاف الجوي والمحيطات والتربة والكائنات الحية عبر البناء الضوئي والتنفس والتحلل."],
      ["s", "لماذا لا تتجمد مياه البحيرات العميقة بالكامل في الشتاء القارس؟", "لأن كثافة الماء تبلغ أقصاها عند 4 درجات مئوية فيغوص الماء الأدفأ نسبياً إلى القاع، بينما يطفو الجليد فوق السطح كطبقة عازلة تحمي الكائنات المائية."],
      ["s", "ما هو «الزئبق الأحمر» من الناحية العلمية؟", "مادة خرافية لا وجود لها في الكيمياء الحقيقية؛ شاعت في القصص والأساطير الشعبية كذريعة للاحتيال دون أي سند علمي."],
      ["s", "ما هي «البكتيريا المحبّة للظروف القاسية» (Extremophiles)؟", "كائنات مجهرية تزدهر في بيئات قاتلة لمعظم الكائنات كالفوهات الحرارية في قاع المحيطات والبحيرات عالية الملوحة والحموضة."],
      ["s", "ما وظيفة «المجال المغناطيسي للأرض» في حماية الحياة؟", "يعمل درعاً غير مرئي يحرف الرياح الشمسية والجسيمات المشحونة عالية الطاقة بعيداً عن الغلاف الجوي فيمنع تآكله."],
      ["s", "ما هو «حزام كويبر» (Kuiper Belt) في المجموعة الشمسية؟", "منطقة شاسعة مليئة بالأجسام الجليدية والكواكب القزمة مثل بلوتو، تمتد خلف مدار كوكب نبتون في أطراف مجموعتنا الشمسية."],
      ["s", "ما هو «قمر تيتان» التابع لكوكب زحل وما الذي يميّزه؟", "أكبر أقمار زحل، والقمر الوحيد في المجموعة الشمسية الذي يمتلك غلافاً جوياً كثيفاً وبحيرات وأنهاراً من الميثان والإيثان السائلين."],
      ["s", "ما هي «الإنزيمات» في الكيمياء الحيوية؟", "بروتينات تعمل كمحفزات حيوية تسرّع التفاعلات الكيميائية داخل الخلايا ملايين المرات دون أن تُستهلك في التفاعل."],
      ["s", "ما الفرق بين «الأحماض» و«القواعد» على مقياس الرقم الهيدروجيني (pH)؟", "يمتد المقياس من 0 إلى 14؛ فالقيم الأقل من 7 حمضية، والقيمة 7 متعادلة كالماء النقي، والقيم الأكبر من 7 قاعدية (قلوية)."],
      ["s", "ما هي ظاهرة «التأصل» (Allotropy) في الكيمياء؟", "وجود العنصر الكيميائي نفسه في أكثر من صورة بلورية أو جزيئية مختلفة الخواص، مثل الأكسجين (O2) والأوزون (O3)."],
      ["s", "كيف يتنقل الخفاش ويصطاد فرائسه في الظلام الدامس؟", "عبر تقنية «تحديد الموقع بالصدى»؛ إذ يطلق موجات فوق صوتية عالية التردد ويحلل انعكاس صداها ليرسم خريطة دقيقة لمحيطه."],
      ["s", "ما هو «النيزك» وما الفرق بينه وبين «الشهاب»؟", "الشهاب وميض ضوئي ناتج عن احتراق صخرة فضائية بالكامل في الغلاف الجوي، أما النيزك فهو الجزء الذي ينجو من الاحتراق ويصل إلى سطح الأرض."],
      // ===================== [h] تاريخ وحضارات (125 معلومة) =====================
      ["h", "ما اسم المدينة القديمة في العراق التي اشتُهرت بزقورتها العظيمة وكانت عاصمة السلالة السومرية الثالثة؟", "مدينة أور في محافظة ذي قار جنوب العراق، وتُعد زقورتها من أفضل الزقورات المحفوظة في العالم."],
      ["h", "من هو الخليفة العباسي الذي أسس مدينة بغداد المدورة عام 762م؟", "أبو جعفر المنصور، وسماها «مدينة السلام» لتكون عاصمة الدولة العباسية."],
      ["h", "من هو القائد الذي فتح الأندلس عام 711م وسُمّي باسمه مضيق بحري شهير؟", "طارق بن زياد، ويُعرف المضيق الفاصل بين إسبانيا والمغرب بمضيق جبل طارق."],
      ["h", "ما هو الحجر الذي ساعد العالم شامبليون في فك رموز الكتابة الهيروغليفية عام 1822م؟", "حجر رشيد، لأنه نُقش عليه مرسوم واحد بثلاث كتابات: الهيروغليفية والديموطيقية واليونانية القديمة."],
      ["h", "ما اسم الطريق التجاري التاريخي الذي ربط الصين بالبحر المتوسط عبر آسيا والشرق الأوسط؟", "طريق الحرير، وقد أسهم لقرون في تبادل السلع والأفكار والعلوم والديانات بين الشرق والغرب."],
      ["h", "من هو الرحالة المغربي الذي جاب العالم الإسلامي وآسيا وإفريقيا لقرابة ثلاثين عاماً في القرن الرابع عشر؟", "ابن بطوطة، وقد وثّق مشاهداته في كتابه الشهير «تحفة النظار في غرائب الأمصار وعجائب الأسفار»."],
      ["h", "ما هي الحضارة التي شيّدت مدينة البتراء الوردية المنحوتة في الصخر؟", "حضارة الأنباط العرب، وجعلوها عاصمة مزدهرة على طرق تجارة البخور والتوابل في جنوب الأردن."],
      ["h", "في أي عام افتُتحت قناة السويس للملاحة العالمية؟", "في 17 نوفمبر عام 1869م، لتربط البحر المتوسط بالبحر الأحمر وتختصر طريق التجارة بين أوروبا وآسيا."],
      ["h", "من هي الملكة التي حكمت تدمر في القرن الثالث الميلادي وتوسعت بسلطانها في الشام ومصر؟", "الملكة زنوبيا، التي جعلت من تدمر مركزاً سياسياً وثقافياً بارزاً قبل سقوطها بيد الإمبراطور الروماني أورليان."],
      ["h", "ما هي أقدم معركة مسجّلة بتفاصيل تكتيكية في التاريخ القديم (حوالي 1457 ق.م)؟", "معركة مجدو، التي قادها الفرعون المصري تحتمس الثالث ضد تحالف من أمراء الشام."],
      ["h", "من هو المؤرخ والعالم المغاربي الذي يُعد مؤسس علم الاجتماع الحديث؟", "ابن خلدون، الذي وضع أسس علم العمران البشري وفلسفة التاريخ في «مقدمته» الشهيرة."],
      ["h", "ما الاسم التاريخي لبلاد ما بين النهرين الذي أطلقه عليها الإغريق؟", "ميزوبوتاميا (Mesopotamia)، وتعني حرفياً «الأرض الواقعة بين النهرين» في إشارة إلى دجلة والفرات."],
      ["h", "من هو القائد الأيوبي الذي استعاد القدس عام 1187م بعد معركة حطين؟", "صلاح الدين الأيوبي، الذي اشتُهر أيضاً بفروسيته وتسامحه مع سكان المدينة بعد فتحها."],
      ["h", "ما هي الإمبراطورية التي حكمت جبال الأنديز في أمريكا الجنوبية وبنت مدينة ماتشو بيتشو؟", "إمبراطورية الإنكا، وامتدت عبر بيرو والإكوادور وبوليفيا وتشيلي قبل الغزو الإسباني في القرن السادس عشر."],
      ["h", "من هو الملك البابلي الذي أعاد بناء بابل وشيد بوابة عشتار الشهيرة في القرن السادس قبل الميلاد؟", "نبوخذ نصر الثاني، الذي جعل بابل أعظم حواضر العالم القديم في عصره."],
      ["h", "ما هو النظام البريدي الشهير الذي نظّمه الأمويون ثم العباسيون لنقل الرسائل والأخبار بسرعة؟", "ديوان البريد، الذي اعتمد على محطات متتابعة تُبدّل فيها الخيول والرسل لتسريع إيصال أخبار الأقاليم."],
      ["h", "ما اسم المدرسة التاريخية الشهيرة التي أُسست في بغداد عام 1233م على ضفة دجلة؟", "المدرسة المستنصرية، التي بناها الخليفة العباسي المستنصر بالله وجمعت تدريس المذاهب الفقهية والطب والرياضيات."],
      ["h", "في أي عام سقطت القسطنطينية بيد السلطان العثماني محمد الفاتح؟", "عام 1453م، ويُعد هذا الحدث لدى كثير من المؤرخين علامةً فاصلة بين العصور الوسطى وبداية العصر الحديث."],
      ["h", "من هو العالِم المسلم الذي وضع أسس علم الجبر في كتابه «المختصر في حساب الجبر والمقابلة»؟", "محمد بن موسى الخوارزمي، واشتُق من اسمه لاحقاً مصطلح «الخوارزمية» (Algorithm)."],
      ["h", "ما هي الوثيقة الإنجليزية الشهيرة الموقعة عام 1215م التي قيّدت سلطة الملك لأول مرة قانونياً؟", "الماغنا كارتا (العهد الأعظم)، وتُعد من الركائز المبكرة لمفهوم سيادة القانون والدستور الحديث."],
      ["h", "ما هي «شريعة حمورابي» وأين وُضعت؟", "إحدى أقدم وأكمل مجموعات القوانين المدوّنة في التاريخ، أصدرها الملك البابلي حمورابي في العراق القديم نحو عام 1754 ق.م ونُقشت على مسلة من البازلت."],
      ["h", "أين نشأت الكتابة المسمارية ومتى تقريباً؟", "نشأت لدى السومريين في جنوب العراق القديم نحو عام 3200 ق.م، وتُعد أقدم نظام كتابة معروف في تاريخ البشرية."],
      ["h", "ما هو «بيت الحكمة» في بغداد العباسية؟", "أعظم مركز علمي ومكتبة ودار للترجمة في العصر الذهبي الإسلامي، بلغ ذروته في عهد الخليفة المأمون وجذب علماء من مختلف الأقطار."],
      ["h", "ما هي أشهر مكتبة في العالم القديم التي أسسها البطالمة في مصر؟", "مكتبة الإسكندرية القديمة، وكانت تضم مئات الآلاف من اللفائف البردية وتستقطب كبار الفلاسفة والعلماء مثل إراتوستينس وأقليدس."],
      ["h", "من أسس جامعة القرويين في مدينة فاس المغربية عام 859م؟", "فاطمة الفهرية، وتصنفها اليونسكو وموسوعة غينيس أقدم مؤسسة تعليمية جامعية مستمرة في العالم."],
      ["h", "من هو القائد القرطاجي الذي اشتهر بعبور جبال الألب بالفيلة لمواجهة روما؟", "هانيبال برقة، خلال الحرب البونيقية الثانية في القرن الثالث قبل الميلاد، ويُعد من أبرع العباقرة العسكريين في التاريخ."],
      ["h", "في أي عام وقعت معركة القادسية ومن كان قائد المسلمين فيها؟", "وقعت نحو عام 636م (15هـ) في العراق بقيادة الصحابي سعد بن أبي وقاص، وفتحت الطريق أمام فتح المدائن وبلاد فارس."],
      ["h", "من هو الحاكم الإفريقي في القرن الرابع عشر الذي اشتُهر بثروته الأسطورية وازدهار مدينة تمبكتو في عهده؟", "منسا موسى إمبراطور مالي، الذي حوّل تمبكتو إلى مركز عالمي بارز للعلم والمخطوطات والتجارة."],
      ["h", "بماذا اشتهرت حضارة المايا في أمريكا الوسطى قبل وصول الأوروبيين؟", "بابتكار نظام عددي يشمل مفهوم الصفر، وبناء الأهرامات المدرجة، ووضع تقويم فلكي بالغ الدقة."],
      ["h", "ما الهدف الأصلي من بناء سور الصين العظيم؟", "حماية الحدود الشمالية للإمبراطوريات الصينية المتعاقبة من غزوات القبائل البدوية وتنظيم التجارة على طريق الحرير."],
      ["h", "أين بدأت الثورة الصناعية في القرن الثامن عشر وما المحرك الذي أطلقها؟", "انطلقت في بريطانيا بفضل تطوير المحرك البخاري وآلات الغزل والنسيج، ما غيّر الاقتصاد والمجتمع البشري جذرياً."],
      ["h", "ما هي أكبر إمبراطورية برية متصلة جغرافياً في تاريخ البشرية؟", "الإمبراطورية المغولية التي أسسها جنكيز خان مطلع القرن الثالث عشر، وامتدت من بحر اليابان شرقاً حتى وسط أوروبا غرباً."],
      ["h", "ما هي أقدم معاهدة سلام مكتوبة ومعروفة في التاريخ؟", "معاهدة قادش (نحو 1259 ق.م) بين الفرعون المصري رمسيس الثاني وملك الحثيين حاتوسيلي الثالث، وتُعرض نسخة منها في مقر الأمم المتحدة."],
      ["h", "من أسس مدينة واسط التاريخية في العراق ولماذا سُمّيت بهذا الاسم؟", "أسسها الحجاج بن يوسف الثقفي عام 702م، وسُمّيت واسطاً لتوسط موقعها بين الكوفة والبصرة والأهواز والمدائن."],
      ["h", "ما هو الإنجاز الثقافي الأبرز الذي قدّمه الفينيقيون للبشرية؟", "تطوير الأبجدية الفينيقية الصوتية المكوّنة من 22 حرفاً ساكناً، والتي تفرّعت منها لاحقاً الأبجديات اليونانية واللاتينية والآرامية والعربية."],
      ["h", "في أي عام سقطت غرناطة، آخر معاقل المسلمين في الأندلس؟", "عام 1492م، بعد قرابة ثمانية قرون من الحضور الحضاري والعلمي الإسلامي في شبه الجزيرة الإيبيرية."],
      ["h", "ما أهمية معركة عين جالوت التي وقعت عام 1260م في فلسطين؟", "أوقفت الزحف المغولي غرباً للمرة الأولى بقيادة السلطان المملوكي سيف الدين قطز والقائد الظاهر بيبرس."],
      ["h", "من هو البحار الصيني المسلم الذي قاد أساطيل استكشافية ضخمة عبر المحيط الهندي في القرن الخامس عشر؟", "تشنغ خه، وقد وصلت سفنه العملاقة إلى الجزيرة العربية والخليج وشرق إفريقيا قبل رحلات الأوروبيين بعقود."],
      ["h", "ما أبرز إنجازين للإمبراطور البيزنطي جستنيان الأول في القرن السادس الميلادي؟", "تدوين «قانون جستنيان» الذي أثّر في التشريعات الأوروبية، وبناء كاتدرائية «آيا صوفيا» في القسطنطينية."],
      ["h", "بماذا تميزت مدن حضارة وادي السند القديمة مثل موهينجو دارو؟", "بتخطيط عمراني شبكي منظم ونظام صرف صحي وحمامات عامة متقدمة قبل أكثر من أربعة آلاف عام."],
      ["h", "أين اختُرع الورق لأول مرة وكيف انتقل إلى أوروبا؟", "اختُرع في الصين (ونُسب تطويره لتساي لون عام 105م)، ثم انتقل إلى سمرقند وبغداد ودمشق والأندلس ومنها إلى أوروبا."],
      ["h", "ما هو أعظم مشروع هندسي زراعي اشتهرت به مملكة سبأ في اليمن القديم؟", "سد مأرب، الذي نظّم مياه السيول وحوّل المنطقة إلى واحات زراعية مزدهرة لقرون طويلة."],
      ["h", "ما هو الدور التاريخي ليوليوس قيصر في روما القديمة؟", "قائد وسياسي عسكري مهّد لتحول روما من جمهورية إلى إمبراطورية، وأدخل التقويم اليولياني الذي بُني عليه التقويم الميلادي الحديث."],
      ["h", "ما المقصود بـ«رحلة الشتاء والصيف» في تاريخ الجزيرة العربية قبل الإسلام؟", "القوافل التجارية الموسمية التي كانت تنظمها قريش شتاءً نحو اليمن الدافئة وصيفاً نحو بلاد الشام المعتدلة."],
      ["h", "أين وقعت معركة «بلاط الشهداء» (بواتييه) عام 732م؟", "في فرنسا الحالية بين الجيش الأموي بقيادة عبد الرحمن الغافقي وقوات الفرنجة بقيادة شارل مارتل، ومثّلت أقصى امتداد للفتوحات الإسلامية في غرب أوروبا."],
      ["h", "ما هي أقدم مكتبة ملكية منظّمة ومفهرسة اكتُشفت في التاريخ القديم؟", "مكتبة الملك الآشوري آشوربانيبال في نينوى (الموصل حالياً) في القرن السابع قبل الميلاد، وضمت أكثر من 30 ألف لوح طيني مسماري منها ملحمة جلجامش."],
      ["h", "ما هي «الإمبراطورية الأكادية» التي تُعد أول إمبراطورية متعددة الشعوب في التاريخ؟", "أسسها سرجون الأكدي في بلاد الرافدين نحو عام 2334 ق.م، ووحّد فيها المدن السومرية والأكادية تحت إدارة مركزية واحدة وشبكة طرق وبريد."],
      ["h", "بماذا اشتُهرت مملكة «الحَضَر» الأثرية في شمال العراق؟", "كانت مملكة عربية محصّنة تُعرف بـ«مدينة الشمس» في القرون الأولى للميلاد، ونجحت أسوارها الدائرية المزدوجة في صدّ حملات الأباطرة الرومان تراجان وسبتيميوس سيفيروس."],
      ["h", "كيف قاس العالِم أبو الريحان البيروني محيط الأرض في القرن الحادي عشر الميلادي؟", "استخدم علم المثلثات وقياس زاوية انخفاض الأفق من قمة جبل في الهند، فتوصل إلى قيمة لمحيط الأرض تقارب القياس الحديث بنسبة خطأ لا تتجاوز 1%."],
      ["h", "ما اسم الكتاب والخريطة الجغرافية الأشهر التي وضعها الشريف الإدريسي في القرن الثاني عشر؟", "«نزهة المشتاق في اختراق الآفاق» (كتاب روجر)، وضمّ أدق خريطة للعالم المعروف في العصور الوسطى صُنعت للملك روجر الثاني في صقلية."],
      ["h", "ما هو «انهيار العصر البرونزي المتأخر» نحو عام 1200 قبل الميلاد؟", "أزمة تاريخية كبرى شهدت سقوطاً متزامناً لإمبراطوريات عظمى كالحثيين والموكينيين وأوغاريت نتيجة تضافر الجفاف والزلازل وغزوات «شعوب البحر» واضطراب التجارة."],
      ["h", "ما أهمية «معركة ذي قار» التي وقعت في جنوب العراق مطلع القرن السابع الميلادي؟", "كانت أول انتصار عسكري حاسم للقبائل العربية (بقيادة بني شيبان) على جيش الإمبراطورية الساسانية النظامي، وعدّها المؤرخون نقطة تحول نفسية مهدت للفتوحات لاحقاً."],
      ["h", "بماذا تميّزت مدينة قرطبة الأندلسية في القرن العاشر الميلادي مقارنةً بمدن أوروبا آنذاك؟", "كانت أكبر حواضر أوروبا بشوارع مرصوفة ومضاءة ليلاً وشبكات مياه جارية، وضمت مكتبة الخليفة الحكم الثاني التي حوت مئات الآلاف من المخطوطات."],
      ["h", "ما هي «قلعة أربيل» في العراق وما مكانتها التاريخية؟", "تلة أثرية مرتفعة تتوسط مدينة أربيل وتُصنّفها اليونسكو ضمن أقدم المواقع المأهولة بالسكان باستمرار في العالم منذ ما يزيد على ستة آلاف عام."],
      ["h", "ما هو «طريق البخور» التاريخي في شبه الجزيرة العربية؟", "شبكة قوافل تجارية عريقة نقلت اللبان والمرّ والتوابل من ظفار (عُمان) وحضرموت (اليمن) شمالاً عبر الحجاز والبتراء إلى أسواق البحر المتوسط."],
      ["h", "ما هو نظام «الأفلاج» (القنوات الكاريزية) الهندسي القديم؟", "أنفاق مائية محفورة تحت الأرض بانحدار هندسي دقيق لنقل المياه الجوفية لمسافات طويلة بالجاذبية دون تبخر، وازدهر منذ آلاف السنين في عُمان وفارس والعراق."],
      ["h", "من قاد أول رحلة بحرية دارت دورة كاملة حول الكرة الأرضية (1519–1522م)؟", "انطلقت بقيادة المستكشف البرتغالي فرديناند ماجلان، وبعد مقتله في الفلبين أتمّها الملاح الإسباني خوان سيباستيان إلكانو مثبتاً عملياً كروية الأرض."],
      ["h", "ما أهمية «صلح وستفاليا» الموقّع في أوروبا عام 1648م؟", "أنهى حرب الثلاثين عاماً ورسّخ المبدأ الحديث لسيادة الدول القومية وعدم التدخل في الشؤون الداخلية، ما شكّل أساس النظام الدولي المعاصر."],
      ["h", "من هو الإمبراطور الهندي «أشوكا» في القرن الثالث قبل الميلاد ولماذا تغيّر مسار حكمه؟", "حاكم إمبراطورية ماوريا الذي صُدم بدموية حرب كالينغا، فتخلّى عن التوسع العسكري ونقش مراسيم تدعو للتسامح الديني وحماية البيئة والرفق بالإنسان والحيوان."],
      ["h", "ما هو «جيش التيراكوتا» المكتشف في الصين عام 1974م؟", "أكثر من ثمانية آلاف تمثال فخاري بالحجم الطبيعي لجنود وخيول بملامح وجوه فريدة لكل جندي، دُفنت لحراسة مقبرة أول إمبراطور موحّد للصين «تشين شي هوانغ» عام 210 ق.م."],
      ["h", "كيف أسهمت «مدرسة طليطلة للترجمة» في إطلاق عصر النهضة الأوروبية؟", "نقلت في القرنين الثاني عشر والثالث عشر مئات المؤلفات العلمية والفلسفية والطبية العربية (كأعمال ابن سينا والخوارزمي وابن رشد) إلى اللاتينية فأحدثت نهضة معرفية في جامعات أوروبا."],
      ["h", "بماذا اشتهرت «مملكة كوش» القديمة في السودان؟", "حضارة إفريقية عريقة حكمت النوبة ومصر (الأسرة الخامسة والعشرون)، وخلّفت في مدينة «مروي» عدداً من الأهرامات يزيد على عدد أهرامات مصر نفسها."],
      ["h", "متى أُسست منظمة الأمم المتحدة وما الهدف الأساسي من إنشائها؟", "تأسست رسمياً في 24 أكتوبر عام 1945م عقب الحرب العالمية الثانية لتحل محل عصبة الأمم بهدف حفظ السلم والأمن الدوليين وتعزيز التعاون الإنساني بين الشعوب."],
      ["h", "من هو الخوارزمي وما أثره في العلوم؟", "عالم رياضيات في بيت الحكمة ببغداد في القرن التاسع الميلادي؛ من اسمه جاءت كلمة «خوارزمية»، وكتابه «الجبر والمقابلة» أسس علم الجبر."],
      ["h", "متى سقطت القسطنطينية وعلى يد من؟", "عام 1453م على يد السلطان العثماني محمد الفاتح وعمره 21 عاماً، لتنتهي بذلك الإمبراطورية البيزنطية."],
      ["h", "ما هو حجر رشيد؟", "لوح بازلتي كُتب عليه نص بثلاث كتابات (الهيروغليفية والديموطيقية واليونانية) ومكّن شامبليون من فك رموز الهيروغليفية عام 1822م."],
      ["h", "أين نشأت أولى المدن الكبرى في التاريخ؟", "في بلاد سومر ببلاد الرافدين (جنوب العراق)، ومن أقدمها مدينة أوروك نحو 4000 ق.م حيث ابتُكرت الكتابة المسمارية والعجلة."],

      ["h", "ما هو بيت الحكمة في بغداد؟", "أعظم مكتبة ومركز للترجمة والبحث العلمي في العصر العباسي، ازدهر في عهد هارون الرشيد والمأمون وجمع علماء الحضارات."],
      ["h", "من هو الحسن بن الهيثم؟", "عالم بصريات ورياضيات (965–1040م) يُعد رائد المنهج التجريبي الحديث، وأثبت في كتابه «المناظر» أن الرؤية تحدث بانعكاس الضوء إلى العين."],
      ["h", "متى وأين بدأت الثورة الصناعية؟", "في بريطانيا خلال القرن الثامن عشر مع تطوير الآلة البخارية وانتشار المصانع والسكك الحديدية."],
      ["h", "متى كانت الحرب العالمية الأولى؟", "بين عامي 1914 و1918م، وأدت إلى سقوط أربع إمبراطوريات كبرى وتغيير خريطة العالم."],
      ["h", "من بنى مدينة بغداد ومتى؟", "الخليفة العباسي أبو جعفر المنصور عام 762م بتصميم دائري فريد وسماها «مدينة السلام»."],
      ["h", "من هو الرحالة ابن بطوطة؟", "رحالة مغربي من طنجة (1304–1369م) قطع أكثر من 120 ألف كيلومتر عبر آسيا وأفريقيا وأوروبا خلال 29 عاماً."],
      ["h", "ما هي مكتبة الإسكندرية القديمة؟", "من أعظم مكتبات العالم القديم ومراكز أبحاثه، أُسست في عهد البطالمة بمصر في القرن الثالث قبل الميلاد."],
      ["h", "متى وصل كولومبوس إلى الأمريكتين؟", "عام 1492م في رحلته الغربية للبحث عن طريق بحري إلى الهند، مما فتح عصر الاستكشافات الأوروبية."],
      ["h", "من هو ابن خلدون وبماذا اشتهر؟", "مؤرخ ومفكر عربي (1332–1406م) يُعد مؤسس علم الاجتماع الحديث من خلال كتابه الشهير «المقدمة» وعلم العمران البشري."],
      ["h", "ما الحضارة التي بنت مدينة البتراء؟", "الأنباط العرب في جنوب الأردن، الذين نحتوا واجهاتها المهيبة في الصخر الوردي وأبدعوا في هندسة المياه."],
      ["h", "متى فُتحت الأندلس ومن قاد الحملة؟", "عام 711م بقيادة طارق بن زياد ثم موسى بن نصير، لتبدأ حقبة حضارية امتدت قرابة ثمانية قرون."],
      ["h", "ما الإمبراطورية التي أسسها جنكيز خان؟", "الإمبراطورية المغولية في القرن الثالث عشر، وأصبحت أكبر إمبراطورية برية متصلة في تاريخ البشرية."],
      ["h", "من أول بعثة طافت حول الأرض بسفينة؟", "بعثة ماجلان (1519–1522م) التي أثبتت كروية الأرض عملياً، وأكملها إلكانو بعد مقتل ماجلان في الفلبين."],
      ["h", "متى بدأت الحروب الصليبية وكم استمرت؟", "نحو عام 1096م واستمرت حملاتها قرابة قرنين حتى تحرير عكا عام 1291م."],
      ["h", "من هي الملكة زنوبيا؟", "ملكة تدمر في بادية الشام بالقرن الثالث الميلادي، تحدّت الإمبراطورية الرومانية ووسّعت مملكتها لتشمل الشام ومصر."],
      ["h", "ما هي جامعة القرويين وأين تقع؟", "أقدم جامعة مستمرة في العالم؛ أسّستها فاطمة الفهرية في مدينة فاس المغربية عام 859م."],
      ["h", "من هو صلاح الدين الأيوبي؟", "قائد ومؤسس الدولة الأيوبية؛ وحّد مصر والشام وحرّر القدس عام 1187م بعد انتصاره في معركة حطين."],
      ["h", "ما هو سور الصين العظيم؟", "سلسلة تحصينات وأبراج دفاعية بُنيت عبر عدة سلالات صينية على مدار قرون لحماية الحدود الشمالية وتنظيم التجارة."],
      ["h", "متى ظهرت المطبعة الحديثة في أوروبا؟", "نحو عام 1450م على يد يوهان غوتنبرغ بالحروف المعدنية المتحركة، فأحدثت ثورة في نشر الكتب والمعرفة."],
      ["h", "من هو هيرودوت؟", "مؤرخ يوناني من القرن الخامس قبل الميلاد يُلقّب بـ«أبي التاريخ» لتدوينه المنهجي لأحداث الحروب اليونانية الفارسية."],
      ["h", "من اخترع الأبجدية الصوتية الأولى الشهيرة؟", "الفينيقيون على سواحل الشام، ومن أبجديتهم المكونة من 22 حرفاً تفرعت الأبجديات اليونانية واللاتينية والعربية."],
      ["h", "متى سقطت الدولة الأموية في المشرق؟", "عام 750م لتقوم بعدها الدولة العباسية، بينما أسس عبد الرحمن الداخل الإمارة الأموية في الأندلس."],
      ["h", "من هو ليوناردو دا فنشي؟", "فنان وعالم ومخترع إيطالي من عصر النهضة، رسم الموناليزا وصمّم مخططات لطائرات وغواصات سبقت عصره."],
      ["h", "من بنى مدينة ماتشو بيتشو؟", "حضارة الإنكا في جبال الأنديز ببيرو في القرن الخامس عشر بحجارة متعشّقة بدقة مذهلة دون ملاط."],
      ["h", "متى اندلعت الحرب العالمية الثانية ومتى انتهت؟", "اندلعت عام 1939م وانتهت عام 1945م، وأسفرت عن تأسيس الأمم المتحدة وبداية عصر الحرب الباردة."],
      ["h", "ما أصل الأرقام المستخدمة عالمياً اليوم؟", "نشأت أصولها في الهند وطوّرها العلماء العرب كالخوارزمي مع مفهوم الصفر، وانتقلت عبر الأندلس إلى أوروبا."],
      ["h", "من هو الرحالة ابن جبير؟", "أديب ورحالة أندلسي (1145–1217م) دوّن رحلته الشهيرة إلى المشرق والحجاز ومصر والشام وصقلية."],
      ["h", "ما هي الثورة الفرنسية ومتى اندلعت؟", "ثورة عام 1789م أنهت الحكم الملكي المطلق ورفعت شعار «الحرية والمساواة والإخاء» وأصدرت إعلان حقوق الإنسان."],
      ["h", "ما الاسم الحديث للقسطنطينية؟", "إسطنبول؛ وهي المدينة الكبرى الوحيدة الممتدة على قارتين (آسيا وأوروبا) عبر مضيق البوسفور."],
      ["h", "من هو الإسكندر الأكبر؟", "ملك مقدوني (356–323 ق.م) تتلمذ على يد أرسطو وأسس إمبراطورية شاسعة امتدت من اليونان حتى حدود الهند."],
      ["h", "من هو ماركو بولو؟", "تاجر ورحالة من البندقية سافر عبر طريق الحرير إلى الصين في القرن الثالث عشر ودوّن مشاهداته في كتاب ألهم أوروبا."],
      ["h", "من بنى قصر الحمراء في غرناطة؟", "ملوك بني نصر (النصريون) في القرنين الثالث عشر والرابع عشر، ويُعد درّة العمارة الإسلامية الأندلسية."],
      ["h", "من هو الإمام الشافعي وما إنجازه العلمي؟", "فقيه عربي (767–820م) وأول من دوّن علم «أصول الفقه» بصورة منهجية متكاملة في كتابه «الرسالة»."],
      ["h", "متى انتهت الخلافة العثمانية رسمياً؟", "عام 1924م مع قيام الجمهورية التركية الحديثة بعد أكثر من ستة قرون من الحكم العثماني."],
      ["h", "ما المقصود بالعصر الذهبي الإسلامي؟", "حقبة ازدهار علمي وثقافي امتدت تقريباً من القرن الثامن إلى الثالث عشر وشهدت طفرات في الطب والرياضيات والفلك."],
      ["h", "من هو أبو بكر الرازي؟", "طبيب وكيميائي (865–925م) ألّف «الحاوي في الطب» وكان أول من فرّق سريرياً بين الجدري والحصبة."],
      ["h", "متى أعلنت المستعمرات الأمريكية استقلالها؟", "في 4 يوليو 1776م بصدور إعلان الاستقلال عن التاج البريطاني لتنشأ الولايات المتحدة الأمريكية."],
      ["h", "ما مكانة قرطبة في عهد الأمويين؟", "أصبحت في القرن العاشر أكبر وأرقى حواضر أوروبا بشوارعها المضاءة ومكتبتها التي ضمّت مئات الآلاف من المجلدات."],
      ["h", "من هو الجغرافي الشريف الإدريسي؟", "جغرافي عربي (1100–1165م) رسم لملك صقلية أدق خريطة للعالم في العصور الوسطى ودوّن «نزهة المشتاق»."],
      ["h", "ما أهمية طريق الحرير تاريخياً؟", "شبكة تجارة برية وبحرية ربطت الصين بالشرق الأوسط وأوروبا، ونقلت السلع والورق والعلوم والأفكار بين الحضارات."],
      ["h", "ما هي «مملكة تدمر» وما سبب ازدهارها التجاري في العصور القديمة؟", "مملكة عربية قديمة في بادية الشام ازدهرت كمحطة رئيسية لقوافل التجارة بين بلاد الرافدين والخليج والبحر المتوسط."],
      ["h", "ما هو «ميثاق المدينة» الذي وُضع بعد الهجرة النبوية عام 622م؟", "وثيقة دستورية مبكرة نظّمت العلاقات والحقوق والواجبات بين سكان يثرب من المهاجرين والأنصار والقبائل المختلفة على أساس المواطنة والدفاع المشترك."],
      ["h", "من هو العالم الفلكي المسلم «البَتّاني» وما أبرز إسهاماته؟", "عالم فلك ورياضيات من القرن التاسع الميلادي حسب طول السنة الشمسية بدقة مذهلة وأصلح جداول بطليموس، فاستشهد به كوبرنيكوس مراراً."],
      ["h", "ما هي «الدولة الإخشيدية» و«الدولة الطولونية» في تاريخ مصر الإسلامية؟", "دولتان مستقلتان نسبياً عن الخلافة العباسية حكمتا مصر والشام في القرنين التاسع والعاشر الميلاديين وازدهرت فيهما العمارة كجامع ابن طولون."],
      ["h", "ما هو «طريق العنبر» في التاريخ الأوروبي القديم؟", "شبكة تجارية قديمة نقلت حجر العنبر الثمين من سواحل بحر البلطيق في شمال أوروبا إلى البحر المتوسط ومصر القديمة."],
      ["h", "من هو «جابر بن حيان» ولماذا يُعد من رواد الكيمياء؟", "عالِم كوفي من القرن الثامن الميلادي أدخل المنهج التجريبي المنظّم إلى الكيمياء، ووصف عمليات التقطير والتبلور والتسامي وتحضير الأحماض."],
      ["h", "ما هي «حضارة دلمون» القديمة وأين كان مركزها؟", "حضارة تجارية مزدهرة نشأت في البحرين وشرق الجزيرة العربية منذ الألفية الثالثة ق.م، وذكرتها نصوص سومر بوصفها أرض الخلود واللؤلؤ."],
      ["h", "ما هي «حرب المئة عام» بين إنجلترا وفرنسا (1337–1453م)؟", "سلسلة نزاعات طويلة على العرش الفرنسي والأراضي، شهدت ظهور جان دارك وأسهمت في تشكيل الهوية الوطنية الحديثة لكلا البلدين."],
      ["h", "ما هو «عصر ميجي» في تاريخ اليابان (1868–1912م)؟", "حقبة إصلاح جذري أنهت الإقطاع وحوّلت اليابان خلال عقود قليلة من دولة منعزلة إلى قوة صناعية وعلمية حديثة."],
      ["h", "ما هي «قرطاج» القديمة ومن أسّسها؟", "مدينة وإمبراطورية بحرية كبرى أسسها الفينيقيون في تونس الحالية نحو عام 814 ق.م، ونافست روما على السيادة في البحر المتوسط."],
      ["h", "ما هو «مشروع مارشال» الذي أُطلق عام 1947م؟", "خطة مساعدات اقتصادية أمريكية ضخمة لإعادة إعمار دول أوروبا الغربية بعد الدمار الذي خلّفته الحرب العالمية الثانية."],
      ["h", "من هو «المسعودي» الملقب بـ«هيرودوت العرب»؟", "مؤرخ وجغرافي ورحالة بغدادي من القرن العاشر الميلادي ألّف موسوعة «مروج الذهب ومعادن الجوهر» التي جمعت بين التاريخ والجغرافيا وعادات الشعوب."],
      ["h", "ما هي «حضارة الأولمك» في أمريكا الوسطى؟", "أقدم حضارة كبرى معروفة في المكسيك القديمة (نحو 1200 ق.م)، اشتهرت بنحت رؤوس حجرية بازلتية عملاقة وأرست أسس حضارتي المايا والأزتك."],
      ["h", "ما هي «المكتبة النورية» و«البيمارستان النوري» في دمشق؟", "مؤسستان علمية وطبية بارزتان أنشأهما نور الدين زنكي في القرن الثاني عشر الميلادي، وكان البيمارستان مستشفى تعليمياً مجانياً متقدماً."],
      ["h", "ما هي «ثورة الزنج» في جنوب العراق خلال القرن التاسع الميلادي؟", "انتفاضة اجتماعية كبرى اندلعت في أهوار البصرة عام 869م ضد قسوة ظروف العمل في استصلاح الأراضي المالحة واستمرت أربعة عشر عاماً."],
      ["h", "ما هو «تقويم مايا الطويل» ولماذا أثار جدلاً عام 2012م؟", "نظام تقويم فلكي دقيق لحساب الدورات الزمنية الطويلة، وانتهت إحدى دوراته الكبرى عام 2012م ففُهِم خطأً في الثقافة الشعبية كنهاية للعالم."],
      ["h", "ما أهمية «مؤتمر باندونغ» عام 1955م في التاريخ المعاصر؟", "اجتماع تاريخي في إندونيسيا لـ29 دولة آسيوية وإفريقية مهّد لتأسيس «حركة عدم الانحياز» ومناهضة الاستعمار خلال الحرب الباردة."],
      // ===================== [p] فلسفة وفكر (115 معلومة) =====================
      ["p", "ما هو «المنهج السقراطي» في الحوار والتفكير؟", "أسلوب فلسفي يعتمد على طرح أسئلة متتابعة ودقيقة لكشف التناقضات في الافتراضات المسبقة والوصول إلى فهم أعمق للحقيقة."],
      ["p", "ما هو «القياس المنطقي» الذي وضع قواعده أرسطو؟", "استدلال عقلي يُستخلص فيه استنتاج ضروري من مقدمتين، مثل: كل إنسان فانٍ، وسقراط إنسان، إذن سقراط فانٍ."],
      ["p", "ما جوهر الفلسفة «الرواقية» (Stoicism)؟", "التركيز على التمييز بين ما يقع ضمن سيطرتنا وما هو خارج سيطرتنا، والسعي للفضيلة وهدوء النفس أمام تقلبات الحياة."],
      ["p", "ما هي «مغالطة رجل القش» (Straw Man Fallacy)؟", "مغالطة منطقية يشوّه فيها المحاور حجة خصمه أو يبالغ فيها ليصبح مهاجمتها سهلاً بدلاً من الرد على الحجة الأصلية."],
      ["p", "ما هي «مغالطة الشخصنة» (Ad Hominem)؟", "مهاجمة الشخص نفسه أو صفاته الشخصية لتقويض كلامه بدلاً من مناقشة الدليل أو الحجة التي يقدمها."],
      ["p", "ما المقصود بـ«مبدأ القابلية للتكذيب» عند الفيلسوف كارل بوبر؟", "معيار يميّز النظريات العلمية؛ فالنظرية تكون علمية فقط إذا كان من الممكن تصور تجربة أو ملاحظة قد تثبت خطأها."],
      ["p", "ما هي الفكرة المركزية في فلسفة «العقد الاجتماعي» عند لوك وروسو؟", "أن شرعية السلطة السياسية تنبع من اتفاق ضمني بين أفراد المجتمع لحماية حقوقهم وتنظيم شؤونهم لا من الحق الإلهي المطلق للحكام."],
      ["p", "من هو الفيلسوف المسلم المعروف بـ«الشارح الأكبر» لأرسطو والذي دافع عن التوفيق بين العقل والنقل؟", "ابن رشد الأندلسي، صاحب كتاب «فصل المقال فيما بين الحكمة والشريعة من الاتصال»."],
      ["p", "ما هو «مبدأ المنفعة» في الفلسفة النفعية (Utilitarianism)؟", "مذهب أخلاقي يقيم صواب الفعل بمدى ما يحققه من أكبر قدر من السعادة أو المنفعة لأكبر عدد ممكن من الناس."],
      ["p", "ما الفرق بين «الاستنباط» (Deduction) و«الاستقراء» (Induction)؟", "الاستنباط ينتقل من قاعدة عامة إلى نتيجة خاصة حتمية، بينما ينتقل الاستقراء من ملاحظات جزئية متكررة إلى تعميم احتمالي."],
      ["p", "ما هي «معضلة القطار» (Trolley Problem) في الأخلاق الفلسفية؟", "تجربة فكرية شهيرة تختبر الصراع بين الأخلاق النفعية (إنقاذ العدد الأكبر) والأخلاق الواجبية (رفض الإيذاء المتعمد حتى لإنقاذ آخرين)."],
      ["p", "ما هو مفهوم «حجاب الجهل» عند الفيلسوف جون رولز؟", "تجربة فكرية لتصميم مجتمع عادل يفترض فيها أننا نضع القوانين دون أن نعرف موقعنا المستقبلي فيه من حيث الثروة أو القوة."],
      ["p", "ما هي «مغالطة التوسّل بالسلطة»؟", "الاستدلال بصحة فكرة لمجرد أن شخصاً مشهوراً أو ذا منصب قالها، دون تقديم دليل موضوعي أو تخصص حقيقي في الموضوع."],
      ["p", "ما المقصود بـ«الشك المنهجي» عند الإمام الغزالي ورينيه ديكارت؟", "توقّف مؤقت ومتعمد عن تصديق الموروثات والحواس لفحص المعرفة من جذورها وبناء اليقين على أسس متينة."],
      ["p", "ما هي «المفارقة» (Paradox) في الفلسفة والمنطق؟", "عبارة أو موقف يبدو متناقضاً مع نفسه أو مع البديهة رغم قيامه على مقدمات تبدو سليمة، مما يدفع لإعادة فحص مفاهيمنا."],
      ["p", "من هو الفيلسوف الإسلامي الأول الذي لُقّب بـ«فيلسوف العرب» في القرن التاسع الميلادي؟", "أبو يوسف يعقوب بن إسحاق الكندي، الذي أسهم في تأسيس المصطلح الفلسفي العربي والعمل في التشفير والرياضيات."],
      ["p", "ما هو مبدأ «نصل أوكام» (Occam's Razor) في التفكير والمنهج العلمي؟", "مبدأ ينص على أنه عند تساوي التفسيرات المتنافسة لظاهرة ما، فإن التفسير الأبسط ذا الافتراضات الأقل هو الأرجح للصواب."],
      ["p", "ما الفكرة الرمزية في «أسطورة الكهف» للفيلسوف أفلاطون؟", "تصف أسرى لا يرون إلا ظلال الأشياء على جدار كهف فيظنونها الحقيقة الكاملة، لترمز إلى الفرق بين المعرفة الحسية السطحية والحقيقة العقلية العميقة."],
      ["p", "من هو الفيلسوف المسلم الملقب بـ«المعلم الثاني» وصاحب كتاب «آراء أهل المدينة الفاضلة»؟", "أبو نصر الفارابي، وسُمّي بالمعلم الثاني لشرحه العميق لمنطق أرسطو (المعلم الأول) وإسهاماته في الفلسفة السياسية والموسيقى."],
      ["p", "ما هي «مغالطة المنحدر الزلق» (Slippery Slope)؟", "الزعم بأن اتخاذ خطوة أولى بسيطة سيؤدي حتماً إلى سلسلة متتابعة من النتائج الكارثية دون تقديم دليل منطقي على حتمية هذا التسلسل."],
      ["p", "ما هي «مغالطة المعضلة الكاذبة» (False Dilemma)؟", "حصر النقاش في خيارين متطرفين فقط («إما معنا أو ضدنا») مع إخفاء أو تجاهل وجود خيارات وسطى وبدائل أخرى ممكنة."],
      ["p", "ما المقصود بـ«مغالطة الاحتكام إلى الجهل»؟", "الادعاء بأن فكرة ما صحيحة فقط لأنه لم يثبت خطؤها، أو أنها خاطئة لمجرد عدم إثبات صحتها بعد."],
      ["p", "ما هي «مغالطة التعميم المتسرّع»؟", "إصدار حكم عام وشامل على فئة كاملة انطلاقاً من تجربة فردية أو عينة صغيرة غير ممثلة."],
      ["p", "ما هي «مغالطة المصادرة على المطلوب» (الاستدلال الدائري)؟", "تقديم النتيجة المراد إثباتها نفسها كمقدمة في الدليل، كالقول إن هذا الكتاب صادق لأنه يقول إنه لا يكذب."],
      ["p", "ما هي «مغالطة الخلط بين الارتباط والسببية»؟", "افتراض أن وقوع حدثين معاً أو تعاقبهما زمنياً يعني بالضرورة أن أحدهما هو السبب المباشر في حدوث الآخر."],
      ["p", "ما الخلاف الجوهري بين الفلسفة «العقلانية» والفلسفة «التجريبية»؟", "العقلانية (مثل ديكارت) ترى أن العقل يمتلك مبادئ فطرية أساسية للمعرفة، بينما ترى التجريبية (مثل جون لوك) أن المعرفة تنشأ من التجربة الحسية."],
      ["p", "ما هو «الأمر القطعي» في فلسفة الأخلاق لدى إيمانويل كانط؟", "معيار أخلاقي يوجب أن تتصرف فقط وفق قاعدة تقبل عقلياً أن تصبح قانوناً كونياً يلتزم به جميع البشر، وأن تعامل الإنسان كغاية لا كوسيلة."],
      ["p", "ما هي «مفارقة سفينة ثيسيوس» الفلسفية؟", "تساؤل حول الهوية: إذا استبدلنا كل ألواح سفينة قديمة بأخرى جديدة تدريجياً، فهل تظل هي السفينة نفسها أم أصبحت شيئاً جديداً؟"],
      ["p", "ما هو جوهر الفلسفة «البراغماتية» (الذرائعية)؟", "اتجاه فلسفي يقيم صدق الأفكار والنظريات بناءً على نتائجها العملية وفائدتها الملموسة في حل المشكلات الواقعية."],
      ["p", "ما الفكرة الأساسية التي تقوم عليها الفلسفة «الوجودية»؟", "أن الإنسان يمتلك حرية الاختيار الكاملة ومسؤول عن صناعة معنى حياته وقيمه عبر أفعاله وقراراته الواعية."],
      ["p", "ما هو علم «الأبستمولوجيا» (نظرية المعرفة)؟", "فرع من الفلسفة يدرس طبيعة المعرفة البشرية ومصادرها وحدودها والمعايير التي تميّز الاعتقاد المبرّر عن مجرد الرأي."],
      ["p", "ما المقصود بـ«الأنطولوجيا» في الفلسفة؟", "علم الوجود؛ وهو فرع يبحث في طبيعة الكينونة وماهية الموجودات وتصنيفاتها الأساسية وعلاقاتها."],
      ["p", "كيف يعرّف أرسطو «الفضيلة الأخلاقية» في مذهبه؟", "بأنها «الوسط الذهبي» بين رذيلتين؛ فالشجاعة مثلاً هي الوسط العقلاني بين الجبن (التفريط) والتهوّر (الإفراط)."],
      ["p", "على ماذا ركزت فلسفة المفكر الصيني كونفوشيوس؟", "على الأخلاق الاجتماعية والبر والعدالة والانسجام الأسري وتهذيب النفس عبر التعليم المستمر وبناء مجتمع فاضل."],
      ["p", "ما مفهوم «النموذج الإرشادي» (Paradigm) عند فيلسوف العلوم توماس كون؟", "الإطار النظري والمنهجي السائد الذي يعمل ضمنه العلماء في حقبة ما، حتى تتراكم شواهد جديدة فتحدث «ثورة علمية» تستبدله بإطار جديد."],
      ["p", "ما هي مغالطة «أنت أيضاً» (Tu Quoque)؟", "رد الاتهام أو النقد بالإشارة إلى أن المنتقد نفسه يرتكب خطأً مشابهاً، بدلاً من الرد الموضوعي على صحة النقد ذاته."],
      ["p", "ما هي «مفارقة التسامح» التي صاغها كارل بوبر؟", "فكرة تشير إلى أن التسامح غير المشروط مع الأفكار والسلوكيات المتعصبة يؤدي في النهاية إلى القضاء على التسامح والمتسامحين أنفسهم."],
      ["p", "ما هي «مشكلة العقل والجسد» في فلسفة الذهن؟", "التساؤل العميق حول كيفية ارتباط الوعي والتجربة الشعورية الذاتية بالعمليات الفيزيائية والكيميائية المادية داخل الدماغ."],
      ["p", "ما هي تجربة «الغرفة الصينية» للفيلسوف جون سيرل؟", "تجربة فكرية تنتقد فكرة وعي الحاسوب، وتبيّن أن اتباع الآلة لقواعد رمزية لإنتاج إجابات صحيحة لا يعني أنها «تفهم» معناها فعلاً."],
      ["p", "ما جوهر الفلسفة «الإبيقورية» الحقيقي خلافاً للشائع عنها؟", "ليست دعوة للإفراط في الملذات، بل فلسفة تدعو إلى الاعتدال وتجنّب الألم النفسي والجسدي وتقدير الصداقة والبساطة لبلوغ طمأنينة النفس."],
      ["p", "من هو الفيلسوف والمؤرخ المسلم الذي ألّف كتاب «تهذيب الأخلاق وتطهير الأعراق»؟", "أحمد بن محمد المعروف بابن مسكويه في القرن العاشر الميلادي، ويُعد من أبرز مؤسسي علم الأخلاق الفلسفي في التراث الإسلامي."],
      ["p", "ما هي «معضلة السجين» (Prisoner's Dilemma) في الفلسفة ونظرية الألعاب؟", "نموذج يوضح كيف يمكن لقرارين فرديين يبدوان عقلانيين ومنطقيين لكل طرف على حدة أن يؤديا إلى نتيجة أسوأ للطرفين معاً مقارنةً بما لو اختارا التعاون والثقة."],
      ["p", "ما هو «قانون هيوم» (مشكلة الكائن والواجب) في فلسفة الأخلاق؟", "ملاحظة الفيلسوف ديفيد هيوم أنه لا يمكن منطقياً استنتاج حكم أخلاقي حول «ما ينبغي أن يكون» لمجرد وصف حقيقة واقعية حول «ما هو كائن» في الطبيعة دون إضافة قيمة أخلاقية مسبقة."],
      ["p", "ما هي «مفارقة أخيل والسلحفاة» التي طرحها الفيلسوف الإغريقي زينون الإيلي؟", "حجة فلسفية تتساءل كيف يلحق العداء السريع بسلحفاة سبقته، لأنه كلما وصل لمكانها السابق تكون قد تقدمت قليلاً؛ وقد حُلّت لاحقاً عبر رياضيات المتسلسلات اللانهائية المتقاربة."],
      ["p", "ما هو مفهوم «الإيكيجاي» (Ikigai) في الفلسفة اليابانية للحياة؟", "سبب الاستيقاظ كل صباح؛ وهو نقطة التوازن والتقاطع بين ما تحبه، وما تجيده، وما يحتاجه العالم، وما يمكنك كسب رزقك منه."],
      ["p", "ما المقصود بـ«التفكير من المبادئ الأولى» (First Principles Thinking)؟", "منهج فلسفي وعلمي استلهمه أرسطو يقوم على تفكيك أي مشكلة معقدة إلى حقائقها الأساسية التي لا تقبل الشك، ثم إعادة بناء الحل من الصفر بدلاً من تقليد الحلول الشائعة."],
      ["p", "ما هو «مبدأ هانلون» (Hanlon's Razor) في التفكير النقدي؟", "قاعدة عملية تنص على: «لا تنسب أبداً إلى سوء النية والخبث ما يمكن تفسيره ببساطة بالخطأ البشري أو الإهمال أو نقص المعلومات»."],
      ["p", "ما هي «مغالطة التكلفة الغارقة» (Sunk Cost Fallacy)؟", "الاستمرار في مشروع أو قرار خاسر لمجرد أنك استثمرت فيه وقتاً أو مالاً أو جهداً سابقاً لا يمكن استرداده، بدلاً من تقييم القرار بناءً على فوائده المستقبلية فقط."],
      ["p", "ما هي «مغالطة الرنجة الحمراء» (Red Herring) في الجدل والحوار؟", "إدخال موضوع جانبي مثير للانتباه لكنه غير ذي صلة بالمناقشة الأصلية بهدف تشتيت المحاور والجمهور وصرف النظر عن القضية الأساسية."],
      ["p", "ما هي «مشكلة الاستقراء» التي أثارها ديفيد هيوم وضرب لها برتراند راسل مثال الديك؟", "أن تكرار حدوث أمر في الماضي (كإطعام المزارع للديك كل صباح أو شروق الشمس) لا يضمن بحتمية منطقية خالصة استمراره للأبد؛ فقد يكون اليوم التالي مختلفاً."],
      ["p", "ما هي تجربة «الدماغ في وعاء» (Brain in a Vat) في نظرية المعرفة؟", "نسخة معاصرة من شك ديكارت تتساءل: كيف يمكنك إثبات أنك لا تعيش داخل محاكاة حسية متقنة تغذي دماغك بإشارات كهربائية تحاكي العالم الخارجي؟"],
      ["p", "ما هي الفكرة المركزية لكتاب «تأملات» للإمبراطور الفيلسوف ماركوس أوريليوس؟", "مذكرات شخصية لم تُكتب للنشر تجسّد الرواقية العملية: ضبط النفس، وتقبل ما لا يُردّ، وأداء الواجب بنزاهة وتواضع رغم امتلاك أقصى درجات السلطة."],
      ["p", "ماذا قصد الفيلسوف لودفيغ فيتغنشتاين بقوله «حدود لغتي تعني حدود عالمي»؟", "أن اللغة ليست مجرد أداة لوصف الأفكار، بل هي الإطار الذي يشكّل وعينا وإدراكنا للواقع، فكلما اتسعت مفاهيمنا اللغوية تعمّقت قدرتنا على التفكير والفهم."],
      ["p", "ما الفرق بين «النسبية الأخلاقية» و«الموضوعية الأخلاقية»؟", "ترى النسبية أن الصواب والخطأ يتغيران بالكامل تبعاً للثقافة أو الفرد، بينما ترى الموضوعية وجود مبادئ أخلاقية إنسانية أساسية صحيحة بصرف النظر عن الأعراف المتغيرة."],
      ["p", "ما هو سؤال «الحتمية مقابل الإرادة الحرة» في الفلسفة؟", "جدل فلسفي عميق: إذا كان كل حدث في الكون ناتجاً عن أسباب فيزيائية سابقة، فهل نختار قراراتنا بحرية حقيقية أم أن شعورنا بالاختيار مجرد نتيجة حتمية لعمليات سابقة؟"],
      ["p", "ما هي «الظاهراتية» (الفينومينولوجيا) التي أسسها إدموند هوسرل؟", "منهج فلسفي يدرس بنية الوعي والتجربة الإنسانية المعاشة كما تظهر لنا مباشرةً من منظور الشخص الأول، قبل فرض التفسيرات والنظريات المسبقة عليها."],
      ["p", "كيف قسّم أرسطو «العدالة» في فلسفته الأخلاقية والسياسية؟", "ميّز بين «العدالة التوزيعية» (توزيع المنافع والمناصب وفق الاستحقاق والكفاءة) و«العدالة التصحيحية» (تعويض الأضرار وإعادة التوازن عند وقوع ظلم في المعاملات)."],
      ["p", "ما هو «الخطأ التكويني» (Genetic Fallacy) في المنطق النقدي؟", "الحكم على فكرة بالصحة أو البطلان بناءً على أصلها أو مصدرها أو تاريخ نشأتها فقط، مع إغفال فحص أدلتها وقيمتها الذاتية في الحاضر."],
      ["p", "ما فكرة سقراط الأشهر عن المعرفة؟", "أن الحكمة تبدأ بإدراك حدود ما نعرف، ويُنسب إليه القول الشهير: «أعرف شيئاً واحداً وهو أنني لا أعرف شيئاً»."],
      ["p", "ماذا قصد ديكارت بـ «أنا أفكر إذن أنا موجود»؟", "أن الشك نفسه فعل تفكير، وهو الدليل اليقيني القاطع على وجود ذاتٍ تفكر لا يمكن الشك في وجودها."],
      ["p", "ما رمز «كهف أفلاطون»؟", "تمثيل لأناس يظنون الظلال على الجدار حقيقةً، ويرمز لرحلة العقل من أسر الجهل والوهم إلى نور المعرفة."],
      ["p", "من هو ابن رشد وما أبرز أطروحته؟", "فيلسوف وقاضٍ أندلسي (1126–1198م) شرح أرسطو ودافع في «فصل المقال» عن العقل والتوافق التام بينه وبين الشريعة."],
      ["p", "من تلميذ سقراط ومعلم أرسطو؟", "أفلاطون؛ مؤسس «الأكاديمية» في أثينا وصاحب نظرية «عالم المُثُل» وكتاب «الجمهورية»."],
      ["p", "ما المذهب «الإمبريقي» (التجريبي) في الفلسفة؟", "مذهب يرى أن الحواس والخبرة هما المصدر الأساسي للمعرفة، ومن أبرز أعلامه جون لوك وديفيد هيوم."],
      ["p", "ما «الأمر المطلق» عند إيمانويل كانط؟", "مبدأ أخلاقي ينص على: افعل فقط وفق القاعدة التي تريد أن تصبح قانوناً عاماً للجميع، معاملةً للإنسان كغاية لا كوسيلة."],
      ["p", "ما هي «الأخلاق النفعية»؟", "مذهب أخلاقي يرى أن الفعل الصحيح هو الذي يحقق أكبر سعادة ومنفعة لأكبر عدد من الناس، ومن رواده بنثام وميل."],
      ["p", "ماذا تعني الفلسفة «الوجودية»؟", "فلسفة ترى أن الإنسان حر ومسؤول عن صناعة معنى لحياته عبر اختياراته، ومن أبرز أعلامها جان بول سارتر."],
      ["p", "ماذا فعل الغزالي في «تهافت الفلاسفة»؟", "انتقد فيه آراء بعض الفلاسفة بأدوات المنطق نفسها، وروى رحلته من الشك إلى اليقين في «المنقذ من الضلال»."],
      ["p", "ما المقصود بـ «السفسطة»؟", "حجاج لفظي خادع هدفه الإقناع والغلبة في الجدال لا الوصول إلى الحقيقة، وقد تصدّى لها سقراط وأفلاطون."],
      ["p", "من هو ابن سينا وما مكانته؟", "طبيب وفيلسوف موسوعي (980–1037م) لُقّب بالشيخ الرئيس؛ ألّف «القانون في الطب» الذي دُرّس في أوروبا قروناً."],
      ["p", "من هو أرسطو وبماذا لُقّب؟", "فيلسوف يوناني (384–322 ق.م) يُلقّب بـ«المعلم الأول»، أسس علم المنطق وكان معلماً للإسكندر الأكبر."],
      ["p", "ما هو «المنطق» عند أرسطو؟", "أداة لتمييز الاستدلال الصحيح من الخاطئ، وأشهر صوره القياس: كل إنسان فانٍ، وسقراط إنسان، إذن سقراط فانٍ."],
      ["p", "ما فكرة الفارابي عن «المدينة الفاضلة»؟", "مجتمع متعاون يحكمه رئيس حكيم، يتكامل أفراده لتحقيق السعادة والفضيلة كأعضاء الجسد الواحد."],
      ["p", "كيف يعرّف أرسطو «الفضيلة»؟", "بأنها «الوسط الذهبي» بين رذيلتين؛ فالشجاعة وسط بين التهور والجبن، والكرم وسط بين التبذير والبخل."],
      ["p", "ما «الشك المنهجي» عند ديكارت؟", "أسلوب عقلي يشك به الإنسان مؤقتاً في كل معرفة قابلة للريب حتى يصل إلى يقين صلب لا يتزعزع."],
      ["p", "ما هو «الجدل السقراطي»؟", "أسلوب حوار يعتمد على الأسئلة المتسلسلة لكشف تناقض أفكار المحاور وقيادته لاكتشاف الحقيقة بنفسه."],
      ["p", "ما نظرية «العقد الاجتماعي»؟", "فكرة أن الأفراد يتنازلون طوعاً عن جزء من حرياتهم للدولة مقابل الأمن والنظام والعدالة، وتناولها هوبز ولوك وروسو."],
      ["p", "ما «الحتمية» في الفلسفة؟", "رأي يذهب إلى أن كل حدث له سبب سابق يحدده بالضرورة، مما يطرح تساؤلاً عميقاً حول حرية الإرادة."],
      ["p", "من هو فريدريك نيتشه؟", "فيلسوف ألماني (1844–1900) اشتهر بنقد الأخلاق التقليدية وبمفاهيم «الإنسان الأعلى» و«إرادة القوة»."],
      ["p", "ما معنى مقولة سارتر «الإنسان محكوم بالحرية»؟", "أن الإنسان لا يستطيع الهروب من الاختيار، فهو مسؤول بالكامل عن قراراته وما يصنعه من نفسه."],
      ["p", "ما هي «النسبية الأخلاقية»؟", "موقف يرى أن معايير الصواب والخطأ ليست مطلقة بل تختلف باختلاف الثقافات والأزمنة والأفراد."],
      ["p", "من هو إيمانويل كانط وما ثورته الفلسفية؟", "فيلسوف ألماني (1724–1804) وفّق بين العقلانية والتجريبية في «نقد العقل الخالص»، مؤكداً دور العقل في تنظيم التجربة."],
      ["p", "من هو باروخ سبينوزا؟", "فيلسوف هولندي (1632–1677) تبنّى مذهب «وحدة الوجود» معتبراً أن الطبيعة والوجود جوهر واحد محكوم بنظام عقلي."],
      ["p", "ما هي «العدمية»؟", "موقف فلسفي يرى أن الحياة والوجود يفتقران إلى معنى جوهري أو قيمة موضوعية مسبقة."],
      ["p", "ما علم «الإبستمولوجيا»؟", "فرع الفلسفة الذي يدرس نظرية المعرفة: طبيعتها ومصادرها وحدودها ومعايير صدقها."],
      ["p", "ما هي «الميتافيزيقا»؟", "فرع الفلسفة الذي يبحث في طبيعة الوجود والواقع والزمان والمكان والمبادئ الأولى لما وراء المحسوسات."],
      ["p", "ما المقصود بـ «الحدس» عند هنري برجسون؟", "إدراك مباشر ومتعاطف مع الزمن وتدفق الحياة يرى برجسون أنه يتجاوز حدود التحليل العقلي المجزَّأ."],
      ["p", "من هو ابن طفيل وما قصته الفلسفية الشهيرة؟", "فيلسوف أندلسي كتب «حي بن يقظان»، قصة طفل نشأ وحيداً في جزيرة واهتدى بعقله وتأمله إلى الحقائق الكبرى."],
      ["p", "بماذا وصف جون لوك العقل البشري عند الولادة؟", "بأنه «صفحة بيضاء» خالية من الأفكار الفطرية، وتملؤها الخبرة والحواس تدريجياً بالتعلم."],
      ["p", "ما الفرق بين «المثالية» و«المادية» في الفلسفة؟", "المثالية تعطي الأولوية للعقل والأفكار والوعي، بينما ترى المادية أن المادة والطاقة هما أساس كل ما هو موجود."],
      ["p", "من هي حنة أرندت وما مفهوم «تفاهة الشر»؟", "فيلسوفة سياسية درست الشمولية، وبيّنت أن الفظائع الكبرى قد يرتكبها أناس عاديون يتوقفون عن التفكير النقدي."],
      ["p", "ما هي «البراغماتية»؟", "مدرسة فلسفية تقيس صحة الفكرة بجدواها العملية ونتائجها الملموسة في الواقع."],
      ["p", "ما جوهر المدرسة «الرواقية» (Stoicism)؟", "فلسفة تدعو لضبط الانفعالات والتحلي بالسكينة والتركيز فقط على ما نملك السيطرة عليه وقبول ما لا نستطيع تغييره."],
      ["p", "من هو كونفوشيوس؟", "فيلسوف صيني (551–479 ق.م) ركّزت تعاليمه على الأخلاق وبناء العلاقات الاجتماعية المتناغمة واحترام الوالدين."],
      ["p", "ما هي الفلسفة «الطاوية»؟", "فلسفة صينية تدعو إلى العيش ببساطة وتناغم عفوي مع الطبيعة وتجنّب التكلّف والصراع غير الضروري."],
      ["p", "ما هي المدرسة «الأبيقورية»؟", "فلسفة يونانية ترى أن السعادة الحقيقية تكمن في الطمأنينة واللذة الهادئة وغياب الألم الجسدي والاضطراب النفسي."],
      ["p", "من هو محيي الدين بن عربي؟", "متصوف وفيلسوف أندلسي (1165–1240م) لُقّب بالشيخ الأكبر واشتهر بكتابه «الفتوحات المكية»."],
      ["p", "كيف تعمل «الجدلية» عند هيغل؟", "يرى أن الفكر والتاريخ يتطوران عبر صراع بين فكرة ونقيضها، ليُثمر الصراع عن تركيب جديد يرتقي بهما."],
      ["p", "ما هو «مبدأ الإحسان التأويلي» (Principle of Charity) في الحوار الفلسفي؟", "قاعدة أخلاقية ومنطقية تقضي بتفسير حجة المحاور بأقوى وأعقل صورة ممكنة قبل نقدها، بدلاً من استغلال هفواته اللفظية."],
      ["p", "ما هو «مبدأ عدم التناقض» في المنطق الأرسطي؟", "مبدأ منطقي أساسي ينص على استحالة أن يكون الشيء صادقاً وكاذباً في آنٍ واحد ومن الجهة نفسها، وهو حجر الزاوية في الاستدلال العقلي."],
      ["p", "ما هي «مغالطة التوسّل بالطبيعة» (Appeal to Nature)؟", "الافتراض الخاطئ بأن كل ما هو طبيعي بالضرورة جيد أو نافع، وكل ما هو صناعي بالضرورة ضار، مع تجاهل الدليل العلمي."],
      ["p", "ما المقصود بـ«مغالطة الأسكتلندي غير الحقيقي» (No True Scotsman)؟", "حيلة جدلية يقوم فيها الشخص بتغيير تعريف فئة ما فجأة لاستبعاد أي مثال مضاد يهدم تعميمه الأصلي."],
      ["p", "ما هي «فلسفة العبث» عند الكاتب والفيلسوف ألبير كامو؟", "تتناول التوتر بين سعي الإنسان الفطري للبحث عن معنى مطلق وصمت الكون غير المبالي، وتدعو لمواجهة ذلك بالوعي والتمرد الخلّاق لا باليأس."],
      ["p", "ما هو مفهوم «العدل» عند المعتزلة في الفكر الإسلامي الكلاسيكي؟", "أحد أصولهم الخمسة، ويعني تنزيه الله عن الظلم وإثبات حرية إرادة الإنسان وقدرته على الاختيار ليكون مسؤولاً عن أفعاله."],
      ["p", "ما هي «نظرية الحقوق الطبيعية» عند الفيلسوف جون لوك؟", "فكرة أن كل إنسان يولد بحقوق أصيلة لا تمنحها الدولة، أبرزها الحق في الحياة والحرية والملكية، ووظيفة الحكم حمايتها."],
      ["p", "ما هو «مبدأ القابلية للتعميم» في الأخلاق؟", "اختبار أخلاقي يسأل: هل يصح هذا السلوك لو أقدم عليه جميع الناس في الظرف نفسه دون أن ينهار النظام الاجتماعي؟"],
      ["p", "ما هي «مفارقة الكذّاب» (Liar Paradox) في المنطق؟", "جملة مثل «هذه الجملة كاذبة»؛ فإن كانت صادقة لزم أن تكون كاذبة، وإن كانت كاذبة لزم أن تكون صادقة، مما يكشف حدود المنطق الصوري."],
      ["p", "ما المقصود بـ«التفكير النقدي» (Critical Thinking)؟", "القدرة المنهجية على تحليل المعلومات وتقييم الأدلة وكشف الافتراضات الخفية والمغالطات قبل إصدار الأحكام."],
      ["p", "ما هي «مفارقة أبيلين» (Abilene Paradox) في اتخاذ القرار الجماعي؟", "اتفاق مجموعة من الأفراد على قرار لا يريده أحدهم فعلياً، لأن كل فرد يخشى مخالفة ما يظنه رغبة الآخرين."],
      ["p", "ما الفرق بين «الشكّية الفلسفية» و«التشكيك الساخر»؟", "الشكّية المنهجية تطلب الدليل وتُبقي العقل منفتحاً للحقيقة، أما التشكيك الساخر فيرفض الأدلة مسبقاً بدافع الريبة أو التعالي."],
      ["p", "ما هي «فلسفة اللغة العادية» التي ازدهرت في أكسفورد منتصف القرن العشرين؟", "اتجاه يرى أن كثيراً من المشكلات الفلسفية العويصة تنشأ من إساءة استخدام الألفاظ خارج سياقها اليومي المعتاد."],
      ["p", "ما هو «مفهوم السعادة» (يودايمونيا) عند أرسطو؟", "لا يعني اللذة العابرة، بل الازدهار الإنساني الكامل الذي يتحقق بممارسة الفضيلة وتوظيف العقل على مدى حياة متوازنة."],
      ["p", "ما هي «أخلاقيات الفضيلة» مقارنةً بأخلاقيات الواجب والنتائج؟", "منهج أخلاقي يركز على بناء شخصية الإنسان وفضائله كالشجاعة والحكمة والعدل، بدلاً من حصر الأخلاق في قواعد صارمة أو حسابات نفعية."],
      ["p", "ما المقصود بـ«الحجاج البلاغي الثلاثي» عند أرسطو (إيثوس وباثوس ولوغوس)؟", "ركائز الإقناع الثلاث: الإيثوس (مصداقية المتحدث)، والباثوس (مخاطبة العاطفة)، واللوغوس (البرهان العقلي والمنطقي)."],
      ["p", "ما هي «تجربة آلة الخبرة» (Experience Machine) للفيلسوف روبرت نوزيك؟", "تجربة فكرية تسأل إن كنت ستختار العيش داخل محاكاة تمنحك متعة دائمة؛ ورفض معظم الناس لها يبيّن أننا نقدّر الحقيقة والواقع لا اللذة وحدها."],
      // ===================== [l] أدب ولغة (115 معلومة) =====================
      ["l", "من هو مؤلف أول معجم شامل في اللغة العربية «كتاب العين»؟", "الخليل بن أحمد الفراهيدي، وقد رتّبه صوتياً بدءاً من أعمق الحروف مخرجاً في الحلق وهو حرف العين."],
      ["l", "ما هو أعظم معجم لغوي تراثي موسوعي في العربية ألّفه ابن منظور؟", "«لسان العرب»، ويضم نحو 80 ألف مادة لغوية جمع فيها خلاصة المعاجم السابقة."],
      ["l", "من هو الشاعر العباسي الذي لُقّب بـ«شاعر الفلاسفة وفيلسوف الشعراء» وعُرف بـ«رهين المحبسين»؟", "أبو العلاء المعري، وسُمي بذلك لفقده بصره ولزومه بيته في معرة النعمان."],
      ["l", "من هو رائد شعر التفعيلة (الشعر الحر) في العراق والوطن العربي إلى جانب نازك الملائكة؟", "بدر شاكر السياب، صاحب قصيدة «أنشودة المطر» الشهيرة التي غيّرت مسار الشعر العربي الحديث."],
      ["l", "ما اسم الرواية التي تُعد على نطاق واسع أول رواية عربية فنية حديثة؟", "رواية «زينب» للكاتب المصري محمد حسين هيكل التي نُشرت مطلع القرن العشرين."],
      ["l", "من هو الكاتب العربي الوحيد الذي فاز بجائزة نوبل في الأدب حتى اليوم؟", "الروائي المصري نجيب محفوظ، وفاز بها عام 1988م عن مجمل أعماله وفي مقدمتها «الثلاثية»."],
      ["l", "ما هما الملحمتان الإغريقيتان الشهيرتان المنسوبتان إلى هوميروس؟", "«الإلياذة» التي تروي حصار طروادة، و«الأوديسة» التي تصف رحلة عودة أوديسيوس إلى وطنه."],
      ["l", "ما الفرق بين «التشبيه» و«الاستعارة» في البلاغة العربية؟", "التشبيه يُذكر فيه المشبّه والمشبّه به معاً، أما الاستعارة فهي تشبيه حُذف أحد طرفيه مع بقاء قرينة تدل عليه."],
      ["l", "من هو الأديب الأندلسي صاحب «طوق الحمامة في الألفة والألاف»؟", "ابن حزم الأندلسي، وهو كتاب أدبي ونفسي بديع في تحليل مشاعر الحب والعلاقات الإنسانية."],
      ["l", "ما هي «المقامات» في الأدب العربي ومن أشهر مبدعيها؟", "فن قصصي نثري مسجوع يجمع البلاغة والطرافة، وأشهر رواده بديع الزمان الهمذاني ثم الحريري البصري."],
      ["l", "من هو الروائي الروسي الذي ألّف «الجريمة والعقاب» و«الإخوة كارامازوف»؟", "فيودور دوستويفسكي، ويُعد من أعمق من حللوا النفس البشرية والصراعات الأخلاقية في الأدب العالمي."],
      ["l", "كم عدد حروف اللغة العربية؟", "28 حرفاً أساسياً، وتُصنّف صوتياً بين الحروف الشمسية والقمرية بحسب إدغام لام التعريف فيها."],
      ["l", "من هو الشاعر العراقي الكبير الملقب بـ«شاعر العرب الأكبر» في العصر الحديث؟", "محمد مهدي الجواهري، الذي اشتهر بقصائده العمودية الرصينة مثل «يا دجلة الخير»."],
      ["l", "ما معنى «التورية» في علم البديع؟", "استخدام لفظ له معنيان: معنى قريب ظاهر غير مقصود، ومعنى بعيد خفي هو الذي يقصده الأديب."],
      ["l", "من هو مؤلف رواية «مئة عام من العزلة» وأحد أبرز رواد الواقعية السحرية؟", "الكاتب الكولومبي غابرييل غارسيا ماركيز، الحائز على جائزة نوبل للآداب عام 1982م."],
      ["l", "ما هو الكتاب النقدي والبلاغي الأشهر لعبد القاهر الجرجاني الذي أسس فيه نظرية «النظم»؟", "«دلائل الإعجاز»، وبيّن فيه أن جمال الكلام يكمن في ترابط المعاني وتناسق التراكيب لا في الألفاظ المفردة وحدها."],
      ["l", "من هو الشاعر الجاهلي الملقب بـ«الملك الضليل» وصاحب المعلقة التي مطلعها «قفا نبكِ»؟", "امرؤ القيس بن حجر الكندي، ويُنسب إليه ابتكار الوقوف على الأطلال في مطالع القصيدة العربية."],
      ["l", "ما اسم الرواية الفلسفية التراثية التي كتبها ابن طفيل الأندلسي عن طفل نشأ وحيداً في جزيرة؟", "«حي بن يقظان»، وتُظهر كيف يمكن للعقل البشري بالتأمل والتجربة الوصول إلى الحقائق الكبرى."],
      ["l", "من هو المسرحي الإنجليزي صاحب «هاملت» و«ماكبث» و«عطيل»؟", "ويليام شكسبير، الذي أثرت أعماله في المسرح العالمي واللغة الإنجليزية أكثر من أي كاتب آخر."],
      ["l", "ما هي «رسالة الغفران» ومن مؤلفها؟", "عمل أدبي تخيلي ساخر كتبه أبو العلاء المعري يصف فيه رحلة خيالية في العالم الآخر مع شعراء الجاهلية والإسلام."],
      ["l", "من هو الشاعر العباسي الذي قال: «أنا الذي نظر الأعمى إلى أدبي وأسمعت كلماتي من به صممُ»؟", "أبو الطيب المتنبي، أحد أعظم شعراء العربية وأكثرهم حضوراً في الحكمة والأمثال."],
      ["l", "من هو الأديب البصري الذي ألّف «البيان والتبيين» و«الحيوان» و«البخلاء»؟", "أبو عثمان عمرو بن بحر الجاحظ، ويُعد من أبرز مؤسسي النثر الأدبي العربي الساخر والعلمي."],
      ["l", "من الذي نقل كتاب «كليلة ودمنة» إلى العربية بأسلوب أدبي رفيع في العصر العباسي؟", "عبد الله بن المقفع، وتدور حكاياته الرمزية على ألسنة الحيوانات لتقديم دروس في السياسة والحكمة."],
      ["l", "من وضع علم «العَروض» لضبط أوزان الشعر العربي وكم عدد بحوره؟", "الخليل بن أحمد الفراهيدي؛ وضع 15 بحراً شعرياً ثم استدرك عليه تلميذه الأخفش الأوسط البحر السادس عشر وهو «المتدارك»."],
      ["l", "ما هي أقدم ملحمة أدبية مكتوبة معروفة في تاريخ البشرية؟", "ملحمة جلجامش من بلاد الرافدين، وتروي رحلة ملك أوروك في البحث عن الخلود ومعنى الحياة."],
      ["l", "ما اسم المجموعة القصصية التراثية التي ترويها شهرزاد للملك شهريار؟", "«ألف ليلة وليلة»، وقد جمعت قصصاً من تراث بغداد وبلاد فارس والهند ومصر وتركت أثراً عميقاً في الأدب العالمي."],
      ["l", "من هو الشاعر الفلسطيني المعاصر صاحب قصائد «سجّل أنا عربي» و«جدارية»؟", "محمود درويش، الذي حوّل القضية الإنسانية والوطنية إلى شعر عالمي رفيع المستوى."],
      ["l", "من هي الشاعرة والناقدة العراقية التي شاركت في ريادة الشعر الحر وكتبت قصيدة «الكوليرا» عام 1947م؟", "نازك الملائكة، وألّفت كتاب «قضايا الشعر المعاصر» الذي نظّر لحركة شعر التفعيلة."],
      ["l", "ما الفرق بين «الطباق» و«المقابلة» في علم البديع؟", "الطباق هو الجمع بين كلمتين متضادتين (مثل الليل والنهار)، أما المقابلة فهي الإتيان بمعنيين أو أكثر ثم الإتيان بما يقابلهما على الترتيب."],
      ["l", "ما هو «الجناس» في البلاغة العربية؟", "تشابه لفظين في النطق مع اختلافهما في المعنى، وقد يكون تاماً (كتماثل الحروف والحركات) أو ناقصاً."],
      ["l", "من هو الشاعر الإيطالي الذي ألّف ملحمة «الكوميديا الإلهية»؟", "دانتي أليغييري، وتصف رحلة رمزية عبر الجحيم والمطهر والفردوس، وأسهمت في توحيد اللغة الإيطالية الأدبية."],
      ["l", "من مؤلف رواية «دون كيخوتي» الشهيرة التي تسخر من قصص الفروسية؟", "الأديب الإسباني ميغيل دي ثيربانتس في مطلع القرن السابع عشر، وتُعد حجر الأساس للرواية الأوروبية الحديثة."],
      ["l", "من هو الروائي الروسي صاحب الملحمتين «الحرب والسلم» و«آنا كارنينا»؟", "ليو تولستوي، ويُصنّف من أعظم كتاب الواقعية في تاريخ الأدب العالمي."],
      ["l", "من هو الأديب الفرنسي الذي ألّف روايتي «البؤساء» و«أحدب نوتردام»؟", "فيكتور هوغو، الذي جمع بين العمق الإنساني والنقد الاجتماعي في أعماله الرومانسية الخالدة."],
      ["l", "ما هي «الموشحات الأندلسية»؟", "فن شعري غنائي ابتكره الأندلسيون، يخرج عن وحدة القافية التقليدية إلى مقاطع وأدوار موسيقية متنوعة القوافي."],
      ["l", "من هي أشهر شاعرات الرثاء في تاريخ الأدب العربي؟", "تماضر بنت عمرو المعروفة بالخنساء، وقد خلدت مراثيها في أخويها صخر ومعاوية في الذاكرة الشعرية."],
      ["l", "من هو الراوية واللغوي البصري الشهير الذي جمع ديوان «الأصمعيات»؟", "عبد الملك بن قريب الأصمعي، وكان مرجعاً في شعر العرب ولغتهم وأخبار البادية في عصر هارون الرشيد."],
      ["l", "ما عنوان السيرة الذاتية الشهيرة التي كتبها عميد الأدب العربي طه حسين؟", "كتاب «الأيام»، وروى فيه طفولته وفقدانه البصر ورحلته العلمية بأسلوب قصصي مؤثر مستخدماً ضمير الغائب."],
      ["l", "من هو الأديب الفلسطيني الذي كتب روايتي «رجال في الشمس» و«عائد إلى حيفا»؟", "غسان كنفاني، ويُعد من أبرز رموز الرواية والقصة القصيرة والمسرح في الأدب العربي الحديث."],
      ["l", "ما المقصود بـ«الكناية» في البلاغة العربية؟", "استخدام تعبير يُراد به معنى لازم غير مباشر مع جواز المعنى الحقيقي، مثل قول العرب «فلان كثير الرماد» كنايةً عن الكرم."],
